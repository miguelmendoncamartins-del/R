<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Comentários em SQL e PL/SQL: Teoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#070c12; --panel:#0d1620; --panel2:#0a121a; --line:#1c2f40;
    --green:#3aa0ff; --green-dim:#2b6ba3; --blood:#c1121f; --blood-bright:#ff5b4d;
    --yellow:#e0c46a; --ink:#d6e2ec; --ink-dim:#6c8698;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--green-dim); background:#050a10;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(58,160,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--green); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .eri-row{ display:flex; align-items:flex-start; gap:12px; }
  .eri-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(58,160,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--green-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .eri-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--green);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble pre{
    background:#000; border:1px solid var(--line); padding:8px; margin:8px 0 0;
    overflow-x:auto; font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--yellow); white-space:pre;
  }
  .speech-bubble code{ color:var(--yellow); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--yellow); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--green-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--green); background:rgba(58,160,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--green); color:var(--green); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,91,77,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--green); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--yellow); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--green); color:#04150c; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--green); border:1px solid var(--green-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--green); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--yellow); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--green); border:1px solid var(--green-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(58,160,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  /* Celular: deixa a página rolar em vez de prender tudo numa tela só, e
     tira padding/borda que só rouba espaço útil numa tela pequena. */
  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'sql_comentarios_teoria';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/vendor/pptxgen.bundle.js"></script>
<script src="../../../shared/slides-generator.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>SQL — DOCUMENTAÇÃO DE CÓDIGO (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">8</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `sql_comentarios_teoria_progress_${username}`;

  const STEPS = [
    {
      story: 'Oi de novo! Eu sou a <b>Query</b>, e agora vamos falar de uma capacidade que parece simples, mas faz toda diferença: <b>documentar seu código com comentários</b>. Comentários são textos que o banco de dados IGNORA na hora de rodar — servem só pra explicar o código pra quem for ler depois (inclusive você mesmo, no futuro).',
      question: {
        prompt: 'Olhando este trecho, o que o banco de dados faz com a primeira linha quando o script roda?<pre>-- busca os pedidos pendentes\nSELECT * FROM pedidos WHERE status = \'pendente\';</pre>',
        options: [
          'Ignora essa linha e só executa o SELECT',
          'Executa a linha como se fosse um filtro adicional',
          'Trava o script porque ela não é um comando válido',
          'Apaga a tabela pedidos'
        ],
        correctIndex: 0,
        explanation: 'Isso! Comentários são só texto explicativo — o banco simplesmente pula essa parte na hora de rodar o código.'
      }
    },
    {
      story: 'Em SQL, o comentário de UMA LINHA começa com dois traços: <code>--</code>. Tudo que vem depois dele, até o fim da linha, é ignorado.<pre>-- lista os funcionários do setor de TI\nSELECT * FROM funcionarios WHERE departamento_id = 1;</pre>',
      question: {
        prompt: 'Você quer comentar a linha explicativa "calcula o total de vendas do dia". Qual das opções abaixo é um comentário de UMA LINHA válido em SQL?',
        options: [
          '-- calcula o total de vendas do dia',
          '// calcula o total de vendas do dia',
          '# calcula o total de vendas do dia',
          '** calcula o total de vendas do dia'
        ],
        correctIndex: 0,
        explanation: 'Correto! Dois traços (--) comentam até o final daquela linha.'
      }
    },
    {
      story: 'Quando o comentário precisa ocupar VÁRIAS linhas, usamos <code>/* ... */</code> — tudo entre a abertura e o fechamento é ignorado, mesmo passando por várias linhas.<pre>/* Este bloco calcula\n   o total de vendas do mês */\nSELECT SUM(valor) FROM vendas;</pre>',
      question: {
        prompt: 'Você precisa comentar uma explicação que ocupa três linhas inteiras, do começo ao fim. Qual sintaxe você usa?',
        options: ['/* ... */', '-- ... --', '<!-- ... -->', '""" ... """'],
        correctIndex: 0,
        explanation: 'Isso! /* abre e */ fecha um comentário que pode se espalhar por quantas linhas precisar.'
      }
    },
    {
      story: 'Comentários são úteis pra explicar a INTENÇÃO de um trecho complicado — por exemplo, por que um agrupamento (GROUP BY) foi feito daquele jeito, ou o que uma consulta com vários JOINs está tentando responder. Bom comentário explica o "por quê", não repete o óbvio do "o quê".',
      question: {
        prompt: 'Qual desses comentários é mais ÚTIL dentro de uma consulta?',
        options: [
          '-- agrupamos por regiao pra comparar o desempenho de cada equipe de vendas',
          '-- isso e um SELECT',
          '-- FROM indica a tabela',
          '-- fim da consulta'
        ],
        correctIndex: 0,
        explanation: 'Exato! O comentário mais útil explica a lógica ou intenção — não descreve o óbvio que o próprio código já mostra.'
      }
    },
    {
      story: 'Em PL/SQL, comentários também documentam a <b>declaração de variáveis</b> — deixando claro pra que serve cada uma:<pre>DECLARE\n  v_total NUMBER(10,2); -- soma acumulada das vendas\nBEGIN\n  ...\nEND;</pre>',
      question: {
        prompt: 'Olhando <code>v_desconto NUMBER(5,2); -- percentual aplicado no fechamento do pedido</code>, o que esse comentário explica?',
        options: [
          'Pra que serve a variável v_desconto',
          'O valor atual da variável em tempo de execução',
          'O tipo de dado (isso já está explícito no código)',
          'O nome do bloco PL/SQL'
        ],
        correctIndex: 0,
        explanation: 'Isso! Comentário na declaração explica o PROPÓSITO da variável — o tipo de dado já está visível no próprio código.'
      }
    },
    {
      story: 'Também é comum comentar os <b>desvios condicionais</b> (IF/ELSE) explicando a regra de negócio por trás da condição, e as <b>condições de parada de laços</b> (o EXIT WHEN de um LOOP) — pra quem ler entender rápido POR QUE o código para ali.<pre>EXIT WHEN v_contador > 100; -- limite de segurança do laço</pre>',
      question: {
        prompt: 'Você vê <code>EXIT WHEN v_tentativas > 5; -- evita loop infinito em caso de falha de conexão</code>. Por que um comentário assim é útil, mesmo com o número visível no código?',
        options: [
          'Porque o número sozinho não explica o motivo do limite — o comentário sim',
          'Porque faz o laço rodar mais rápido',
          'Porque é a única forma de o laço realmente parar',
          'Porque substitui a necessidade do EXIT WHEN'
        ],
        correctIndex: 0,
        explanation: 'Isso! O número sozinho não conta a história — o comentário explica de onde veio aquele limite.'
      }
    },
    {
      story: 'Por fim, é boa prática colocar um <b>comentário de cabeçalho</b> no início de um bloco PL/SQL mais complexo, resumindo o que ele faz, antes mesmo do DECLARE — como um resumo rápido pra quem só quer entender o objetivo sem ler linha por linha.<pre>/* Calcula o bônus anual de cada funcionário\n   com base no salário e no tempo de casa. */\nDECLARE\n  ...</pre>',
      question: {
        prompt: 'No topo de um bloco PL/SQL complexo você vê <code>/* Recalcula o estoque de todos os produtos após um pedido cancelado */</code>, antes até do DECLARE. Qual a função desse comentário?',
        options: [
          'Resumir o objetivo do bloco antes de entrar nos detalhes do código',
          'Substituir a necessidade de DECLARE',
          'Ser executado como parte da lógica',
          'Aumentar a performance do bloco'
        ],
        correctIndex: 0,
        explanation: 'Correto! É um resumo rápido — documentação técnica do que aquele bloco resolve, sem precisar ler tudo primeiro.'
      }
    },
    {
      story: 'Cuidado com o extremo oposto também: comentar TUDO, inclusive o óbvio, deixa o código poluído e mais difícil de ler — não mais fácil. O segredo é comentar o que NÃO é óbvio só de olhar o código. Com isso, você já sabe documentar consultas SQL e blocos PL/SQL com comentários que realmente ajudam.',
      question: {
        prompt: 'Um colega comentou até a linha "END;" com "-- fim do bloco" e cada vírgula da consulta. Qual o problema dessa prática?',
        options: [
          'Polui o código e dificulta achar os comentários que realmente importam',
          'O banco de dados recusa rodar o script',
          'Deixa a consulta mais lenta',
          'Não existe problema nenhum'
        ],
        correctIndex: 0,
        explanation: 'Isso! Excesso de comentários óbvios "afoga" os comentários realmente úteis — comente com intenção, não por hábito.'
      }
    }
  ];

  // Exposto sempre (não só quando o botão local aparece) pra a aba "Gestão"
  // do portal da turma conseguir chamar isso remotamente, num iframe oculto,
  // sem o professor precisar abrir o módulo pra achar o botão.
  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Comentários em SQL e PL/SQL',
      subtitle: 'Aula Teórica · Trilha Documentação de Código · Turma Sistemas',
      capacidade: 'Empregar comentários para documentação do código fonte.',
      steps: STEPS,
      fileName: 'sql-comentarios-teoria-slides.pptx',
      closingTitle: 'Pratique a documentação!',
      closingText: 'Ao escrever consultas SQL e blocos PL/SQL nos outros módulos, aplique comentários que expliquem o "por quê", não o óbvio.'
    });
  };

  // Mesmo esquema do generateSlidesForGestao acima: exposto sempre pra a aba
  // "Gestão" poder chamar remotamente, num iframe oculto, e baixar um .txt
  // com pergunta + resposta esperada de cada etapa — sem o professor precisar
  // decorar as respostas ou abrir o módulo pra conferir.
  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Comentários em SQL e PL/SQL',
      subtitle: 'Aula Teórica · Trilha Documentação de Código · Turma Sistemas',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'sql-comentarios-teoria-gabarito.txt'
    });
  };

  // Só o professor vê o botão de gerar slides aqui dentro do módulo — é
  // material de apoio pra ele apresentar em aula, não faz parte da jornada
  // do aluno.
  const role = urlParams.get('role') || 'aluno';
  const btnGenSlides = document.getElementById('btnGenSlides');
  if (role === 'professor') {
    btnGenSlides.style.display = 'inline-block';
    btnGenSlides.addEventListener('click', () => {
      btnGenSlides.disabled = true;
      btnGenSlides.textContent = '⏳ Gerando...';
      setTimeout(() => {
        window.generateSlidesForGestao();
        btnGenSlides.disabled = false;
        btnGenSlides.textContent = '🖨️ Gerar Slides (PPTX)';
      }, 50);
    });
  }

  const storyWrap = document.getElementById('storyWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const lblStepTotal = document.getElementById('lblStepTotal');
  const progressFill = document.getElementById('progressFill');

  lblStepTotal.textContent = STEPS.length;

  function loadProgress() {
    try {
      return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
    } catch (e) {
      return null;
    }
  }

  function saveProgress(data) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(data));
  }

  // Ordem das perguntas embaralhada por aluno/tentativa — evita que a sequência
  // fixa vire uma "lista de gabarito" compartilhada entre turmas.
  const ORDER_KEY = PROGRESS_KEY.replace('_progress_', '_order_');

  function shuffleOrder() {
    const arr = STEPS.map((_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function loadOrder() {
    try {
      const parsed = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
      if (Array.isArray(parsed) && parsed.length === STEPS.length && parsed.every(n => Number.isInteger(n) && n >= 0 && n < STEPS.length)) {
        return parsed;
      }
    } catch (e) {}
    return null;
  }

  const saved = loadProgress();
  let stepOrder = (saved && !saved.completed) ? (loadOrder() || shuffleOrder()) : shuffleOrder();
  localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
  let currentStepIndex = (saved && !saved.completed) ? Math.min(saved.lastStepIndex || 0, STEPS.length - 1) : 0;
  let correctCount = (saved && typeof saved.correctCount === 'number') ? saved.correctCount : 0;

  function updateProgressBar() {
    const pct = Math.round(((currentStepIndex) / STEPS.length) * 100);
    progressFill.style.width = pct + '%';
    lblStepNum.textContent = Math.min(currentStepIndex + 1, STEPS.length);
  }

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity('sql_comentarios_teoria', label, {
        step: currentStepIndex + 1,
        total: STEPS.length,
        correctCount: correctCount
      });
    }
  }

  function renderStory() {
    updateProgressBar();
    const step = STEPS[stepOrder[currentStepIndex]];
    reportStep(`Comentários em SQL/PL-SQL — Etapa ${currentStepIndex + 1}/${STEPS.length}`);

    storyWrap.innerHTML = '';

    const row = document.createElement('div');
    row.className = 'eri-row';
    row.innerHTML = `
      <div class="eri-avatar">🤖</div>
      <div class="speech-bubble">
        <span class="eri-name">Query, IA da Central de Dados</span>
        ${step.story}
      </div>
    `;
    storyWrap.appendChild(row);

    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.innerHTML = `<button class="btn" id="btnNext">Próximo →</button>`;
    storyWrap.appendChild(actions);

    document.getElementById('btnNext').addEventListener('click', renderQuestion);
  }

  function renderQuestion() {
    const step = STEPS[stepOrder[currentStepIndex]];
    const q = step.question;

    storyWrap.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2>❓ ${q.prompt}</h2>`;

    const optionsWrap = document.createElement('div');
    const letters = ['A', 'B', 'C', 'D'];
    let answered = false;

    // Embaralha a ordem de exibição pra resposta certa não cair sempre na letra A.
    const order = q.options.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    const correctPos = order.indexOf(q.correctIndex);

    order.forEach((origIdx, pos) => {
      const optText = q.options[origIdx];
      const opt = document.createElement('div');
      opt.className = 'option';
      opt.innerHTML = `<span class="opt-letter">${letters[pos]}</span><span>${optText}</span>`;
      opt.addEventListener('click', () => {
        if (answered) return;
        answered = true;
        selectAnswer(pos);
      });
      optionsWrap.appendChild(opt);

      function selectAnswer(chosenIdx) {
        const allOptionEls = optionsWrap.querySelectorAll('.option');
        allOptionEls.forEach(el => el.classList.add('disabled'));

        const isCorrect = chosenIdx === correctPos;
        allOptionEls[chosenIdx].classList.add(isCorrect ? 'correct' : 'incorrect');
        if (!isCorrect) {
          allOptionEls[correctPos].classList.add('correct');
        }
        if (isCorrect) correctCount++;

        const feedback = document.createElement('div');
        feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
        feedback.innerHTML = isCorrect
          ? `✅ Correto! ${q.explanation}`
          : `❌ Não foi dessa vez. A resposta certa é "<b>${q.options[q.correctIndex]}</b>": ${q.explanation.replace(/^(Isso mesmo!|Isso!|Correto!|Exato!|Perfeito!|Correta!)\s*/i, '')}`;
        card.appendChild(feedback);

        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.style.marginTop = '14px';
        actions.innerHTML = `<button class="btn" id="btnNextAfterAnswer">Próximo →</button>`;
        card.appendChild(actions);

        saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
        reportStep(`Comentários em SQL/PL-SQL — Etapa ${currentStepIndex + 1}/${STEPS.length} (respondida)`);

        document.getElementById('btnNextAfterAnswer').addEventListener('click', () => {
          currentStepIndex++;
          if (currentStepIndex >= STEPS.length) {
            finishJourney();
          } else {
            saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
            renderStory();
          }
        });
      }
    });

    card.appendChild(optionsWrap);
    storyWrap.innerHTML = '';
    storyWrap.appendChild(card);
  }

  function finishJourney(reviewOnly) {
    // Só conta como concluída (e libera o resto da trilha/jogos) com pelo
    // menos 80% de acerto — abaixo disso, fica só o convite pra tentar de novo.
    // reviewOnly=true (reabrindo um módulo já concluído) só reexibe a tela
    // de sucesso sem recalcular/regravar — sem isso, progresso salvo antes
    // dessa regra existir (sem correctCount) seria rebaixado pra "não
    // concluído" só por reabrir o módulo.
    const pct = STEPS.length > 0 ? Math.round((correctCount / STEPS.length) * 100) : 0;
    const passed = reviewOnly ? true : pct >= 80;
    if (!reviewOnly) {
      saveProgress({ lastStepIndex: STEPS.length, correctCount, completed: passed });
      reportStep(`Comentários em SQL/PL-SQL — ${passed ? 'Concluída' : 'Não concluída'} (${correctCount}/${STEPS.length})`);
    }

    progressFill.style.width = '100%';
    lblStepNum.textContent = STEPS.length;

    storyWrap.innerHTML = passed ? `
      <div class="card finish-screen">
        <div class="trophy">🏆</div>
        <h2>Documentação de código concluída!</h2>
        <p>Você já sabe usar -- e /* */ pra documentar consultas SQL e blocos PL/SQL, explicando o "por quê" sem poluir o código com o óbvio.</p>
        <div class="score">Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%).</div>
        <p>Aplique isso nos outros módulos da trilha SQL: comente suas consultas mais complexas.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn btn-secondary" id="btnRestart">🔁 Rever a teoria</button>
        </div>
      </div>
    ` : `
      <div class="card finish-screen">
        <div class="trophy">📚</div>
        <h2>Quase lá!</h2>
        <p>Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%) — é preciso pelo menos 80% de acerto para concluir esta atividade.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn" id="btnRestart">🔁 Tentar novamente</button>
        </div>
      </div>
    `;

    document.getElementById('btnRestart').addEventListener('click', () => {
      currentStepIndex = 0;
      correctCount = 0;
      stepOrder = shuffleOrder();
      localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
      saveProgress({ lastStepIndex: 0, correctCount: 0, completed: false });
      renderStory();
    });
  }

  if (saved && saved.completed) {
    currentStepIndex = STEPS.length;
    finishJourney(true);
  } else {
    renderStory();
  }
</script>
