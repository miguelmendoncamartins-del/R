<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Programação de Jogos 2D na Prática: Teoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d0a; --panel:#10140f; --panel2:#0d110c; --line:#223022;
    --green:#7cff3f; --green-dim:#4a9a2a; --blood:#c1121f; --blood-bright:#ff3b30;
    --yellow:#d4c86a; --ink:#d9e6d2; --ink-dim:#6f8368;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--green-dim); background:#050805;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(124,255,63,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--green); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .eri-row{ display:flex; align-items:flex-start; gap:12px; }
  .eri-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(124,255,63,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--green-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .eri-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--green);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble code{ color:var(--yellow); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--yellow); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--green-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--green); background:rgba(124,255,63,0.08); }
  .option.correct .opt-letter{ border-color:var(--green); color:var(--green); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--green); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--yellow); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--green); color:#04220a; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--green); border:1px solid var(--green-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--green); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--yellow); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--green); border:1px solid var(--green-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(124,255,63,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'fund_prog2d_teoria';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/vendor/pptxgen.bundle.js"></script>
<script src="../../../shared/slides-generator.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>JOGOS — PROGRAMAÇÃO DE JOGOS 2D (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">7</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `fund_prog2d_teoria_progress_${username}`;

  const STEPS = [
    {
      story: 'Sou o <b>Eri</b> de novo, agora pra falarmos de mão na massa: como fazer um personagem <b>se mover com o teclado</b>. A prática mais comum é guardar o ESTADO das teclas (pressionada ou não) e, a cada frame do game loop, mover o personagem na direção correspondente — em vez de mover só uma vez no momento do clique.',
      question: {
        prompt: 'Um personagem se move UMA vez quando a tecla é pressionada, mas não continua andando enquanto o jogador segura a tecla. O que a lógica de movimentação provavelmente está tratando errado?',
        options: [
          'Ela só reage ao evento único de "tecla pressionada", em vez de checar o ESTADO da tecla a cada frame do game loop',
          'O teclado do jogador está com defeito',
          'O personagem está sem sprite',
          'Isso é esperado, teclado só deveria mover uma vez mesmo'
        ],
        correctIndex: 0,
        explanation: 'Isso! Pra movimento contínuo, o jogo precisa checar "essa tecla está pressionada agora?" a cada frame, não só reagir ao evento único de tecla pressionada.'
      }
    },
    {
      story: 'Já a <b>movimentação com mouse</b> costuma usar a posição do cursor na tela (coordenadas X e Y) — seja pra mover o personagem até o ponto clicado, seja pra girar/mirar na direção do cursor. É comum converter a posição do mouse na tela pra posição correspondente no mundo do jogo.',
      question: {
        prompt: 'Num jogo do tipo "clique para mover", o que o código precisa capturar no momento do clique pra saber pra onde o personagem deve ir?',
        options: [
          'A posição (coordenadas X e Y) do cursor do mouse no momento do clique',
          'A cor do pixel clicado',
          'O nome do arquivo do sprite',
          'A velocidade de rolagem da roda do mouse'
        ],
        correctIndex: 0,
        explanation: 'Exato! É a posição X, Y do clique que vira o destino do movimento (ou a direção de mira, dependendo do tipo de jogo).'
      }
    },
    {
      story: 'Pra detectar quando dois elementos se tocam, usamos <b>colisores</b> (colliders): formas simples — geralmente retângulos ou círculos — anexadas aos sprites, que servem só pra checar sobreposição. O colisor pode ser menor que o sprite visual, pra deixar a colisão mais "justa" com o que o jogador realmente vê.',
      question: {
        prompt: 'Dois sprites parecem se tocar na tela, mas o jogo não detecta nenhuma colisão entre eles. Qual é a explicação mais provável?',
        options: [
          'Os elementos não têm colisores configurados corretamente (ou os colisores não estão realmente se sobrepondo)',
          'O jogo está rodando rápido demais',
          'A cor dos sprites está errada',
          'Colisão não pode ser detectada em jogos 2D'
        ],
        correctIndex: 0,
        explanation: 'Isso! Sem um colisor bem configurado (e de fato sobreposto), o motor do jogo não tem como saber que os dois elementos "se tocaram" — a aparência visual sozinha não conta.'
      }
    },
    {
      story: 'O <b>fluxo de eventos</b> de um jogo conecta causa e efeito: entrada do jogador, colisões e temporizadores disparam <b>eventos</b> que atualizam o estado do jogo — por exemplo, "jogador entrou na área do inimigo" dispara o evento de "inimigo detectou o jogador e começa a perseguir".',
      question: {
        prompt: 'Um inimigo deveria começar a perseguir o jogador assim que ele entra num raio de detecção, mas o inimigo nunca reage. Que peça do fluxo de eventos provavelmente está faltando?',
        options: [
          'Um evento de colisão/detecção (jogador entrou na área) que dispara a mudança de comportamento do inimigo',
          'Uma nova textura para o inimigo',
          'Mais luzes na cena',
          'Um botão de pausa'
        ],
        correctIndex: 0,
        explanation: 'Correto! Sem o evento de detecção disparando a mudança de estado do inimigo, ele nunca "sabe" que o jogador chegou perto.'
      }
    },
    {
      story: 'Pra não virar uma bagunça, o <b>código do jogo</b> costuma se organizar em partes claras: <b>inicialização</b> (carregar assets, criar objetos), <b>atualização</b> (a lógica que roda a cada frame) e <b>renderização</b> (desenhar tudo na tela) — muitas vezes usando classes/objetos pra representar cada tipo de elemento do jogo (jogador, inimigo, item).',
      question: {
        prompt: 'Por que separar o código do jogo em "inicialização", "atualização" e "renderização", em vez de escrever tudo misturado num bloco só?',
        options: [
          'Porque fica mais fácil entender, manter e depurar cada responsabilidade separadamente',
          'Porque isso deixa o jogo rodar em menos frames por segundo de propósito',
          'Porque engines exigem por lei essa separação',
          'Não existe vantagem real, é só estética'
        ],
        correctIndex: 0,
        explanation: 'Isso! Separar essas responsabilidades deixa o código muito mais organizado, fácil de entender e de corrigir quando algo dá errado.'
      }
    },
    {
      story: 'Elementos do jogo (inimigos, itens, projéteis) seguem um ciclo parecido com <b>CRUD</b>: são <b>criados</b> (instanciados na cena), <b>atualizados</b> a cada frame (posição, vida, estado) e, quando não são mais necessários, precisam ser <b>removidos</b> — senão continuam consumindo processamento e memória mesmo "mortos".',
      question: {
        prompt: 'Um jogo cria dezenas de projéteis por segundo e, depois de um tempo jogando, começa a travar bastante. Qual etapa do ciclo de vida dos objetos provavelmente está sendo ignorada?',
        options: [
          'A remoção dos projéteis que já saíram da tela ou já atingiram o alvo',
          'A criação dos projéteis',
          'A cor dos projéteis',
          'O som do disparo'
        ],
        correctIndex: 0,
        explanation: 'Exato! Sem remover objetos que não são mais necessários, eles continuam ocupando processamento e memória — um vazamento clássico de performance.'
      }
    },
    {
      story: 'Por fim, o <b>controle de objetos</b> geralmente usa uma lista/array guardando todos os elementos ativos da cena — cada frame, o jogo percorre essa lista pra atualizar e desenhar cada um, e remove da lista quem já deve desaparecer. Agora você já entende o ciclo completo: entrada, colisão, eventos, estrutura e ciclo de vida dos objetos!',
      question: {
        prompt: 'Um inimigo foi derrotado e sumiu visualmente da tela, mas o jogo continua checando colisão com ele "fantasma", travando o jogador em paredes invisíveis. O que provavelmente não foi feito?',
        options: [
          'O inimigo não foi removido da lista/array de objetos ativos do jogo, só ficou invisível',
          'A lista de objetos nunca deveria existir',
          'O jogador está com bug de movimento',
          'O problema é sempre da placa de vídeo'
        ],
        correctIndex: 0,
        explanation: 'Isso mesmo! Esconder visualmente não basta — é preciso de fato remover o objeto da estrutura de controle (lista/array) pra ele parar de participar da lógica do jogo.'
      }
    },
    {
      story: 'Voltando à <b>atualização</b> de elementos: cada objeto ativo (inimigo, item, projétil) precisa rodar sua própria lógica de estado a cada frame — vida, posição, animação. Se essa atualização for feita só uma vez (na criação) e não a cada frame, o objeto fica "congelado" mesmo que o jogo continue mudando por trás.',
      question: {
        prompt: 'Um inimigo recebe dano e o valor interno de vida diminui corretamente no código, mas a barra de vida na tela nunca muda visualmente. O que provavelmente falta?',
        options: [
          'Atualizar a representação visual (a barra de vida) a cada frame, lendo o valor de vida atual do objeto',
          'Aumentar o dano causado ao inimigo',
          'Trocar o sprite do inimigo',
          'Remover o inimigo da cena'
        ],
        correctIndex: 0,
        explanation: 'Isso! O dado interno (vida) pode estar certo, mas se a atualização visual não roda a cada frame lendo esse valor, a tela nunca reflete a mudança.'
      }
    },
    {
      story: 'Sobre <b>criação</b> de elementos: instanciar e destruir objetos o tempo todo (como um projétil por disparo) pode pesar bastante no desempenho. Uma técnica comum é o <b>object pooling</b>: em vez de criar/destruir sem parar, um conjunto de objetos é reaproveitado — "desativado" e reposicionado, em vez de recriado do zero.',
      question: {
        prompt: 'Um jogo cria e destrói centenas de projéteis por segundo durante tiroteios intensos, e a taxa de quadros despenca nesses momentos. Qual técnica ajudaria a resolver esse problema de desempenho?',
        options: [
          'Object pooling: reaproveitar um conjunto de projéteis já criados, em vez de criar/destruir a cada disparo',
          'Aumentar o dano de cada projétil',
          'Reduzir a cor dos projéteis para preto e branco',
          'Remover o som dos disparos'
        ],
        correctIndex: 0,
        explanation: 'Exato! Reaproveitar objetos existentes (object pooling) evita o custo repetido de criar e destruir instâncias, aliviando bastante o desempenho em momentos intensos.'
      }
    },
    {
      story: 'Por fim, um jogo real costuma combinar <b>múltiplas fontes de entrada</b> no mesmo frame — teclado pra mover e mouse pra mirar, por exemplo. O game loop precisa checar TODAS as entradas relevantes a cada volta do ciclo, não processar uma e ignorar a outra.',
      question: {
        prompt: 'Um jogo usa teclado (WASD) pra mover o personagem e mouse pra mirar ao mesmo tempo, mas só a mira do mouse funciona — o personagem não anda mais com o teclado. O que a lógica do game loop provavelmente está fazendo de errado?',
        options: [
          'Está processando só uma fonte de entrada por frame (mouse), em vez de checar teclado E mouse a cada volta do loop',
          'O mouse está com defeito',
          'É impossível usar teclado e mouse juntos num jogo',
          'O teclado precisa ser trocado por um controle'
        ],
        correctIndex: 0,
        explanation: 'Correto! O game loop precisa checar todas as entradas relevantes (teclado E mouse) a cada frame — se só uma for processada, a outra "trava".'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Jogos — Programação de Jogos 2D na Prática',
      subtitle: 'Aula Teórica · Trilha Programação de Jogos 2D · Turma Jogos Digitais',
      capacidade: 'Utilizar linguagem de programação para desenvolvimento de jogos digitais 2D.',
      steps: STEPS,
      fileName: 'fund-prog2d-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Prática — Central de Suporte: Programação de Jogos 2D" no Portal de Aulas para os alunos resolverem chamados de verdade.'
    });
  };

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Jogos — Programação de Jogos 2D na Prática',
      subtitle: 'Aula Teórica · Trilha Programação de Jogos 2D · Turma Jogos Digitais',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'fund-prog2d-teoria-gabarito.txt'
    });
  };

  const role = urlParams.get('role') || 'aluno';
  const btnGenSlides = document.getElementById('btnGenSlides');
  if (role === 'professor') {
    btnGenSlides.style.display = 'inline-block';
    btnGenSlides.addEventListener('click', () => {
      btnGenSlides.disabled = true;
      btnGenSlides.textContent = '⏳ Gerando...';
      setTimeout(() => {
        window.generateSlidesForGestao();
        btnGenSlides.disabled = false;
        btnGenSlides.textContent = '🖨️ Gerar Slides (PPTX)';
      }, 50);
    });
  }

  const storyWrap = document.getElementById('storyWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const lblStepTotal = document.getElementById('lblStepTotal');
  const progressFill = document.getElementById('progressFill');

  lblStepTotal.textContent = STEPS.length;

  function loadProgress() {
    try {
      return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
    } catch (e) {
      return null;
    }
  }

  function saveProgress(data) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(data));
  }

  const ORDER_KEY = PROGRESS_KEY.replace('_progress_', '_order_');

  function shuffleOrder() {
    const arr = STEPS.map((_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function loadOrder() {
    try {
      const parsed = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
      if (Array.isArray(parsed) && parsed.length === STEPS.length && parsed.every(n => Number.isInteger(n) && n >= 0 && n < STEPS.length)) {
        return parsed;
      }
    } catch (e) {}
    return null;
  }

  const saved = loadProgress();
  let stepOrder = (saved && !saved.completed) ? (loadOrder() || shuffleOrder()) : shuffleOrder();
  localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
  let currentStepIndex = (saved && !saved.completed) ? Math.min(saved.lastStepIndex || 0, STEPS.length - 1) : 0;
  let correctCount = (saved && typeof saved.correctCount === 'number') ? saved.correctCount : 0;

  function updateProgressBar() {
    const pct = Math.round(((currentStepIndex) / STEPS.length) * 100);
    progressFill.style.width = pct + '%';
    lblStepNum.textContent = Math.min(currentStepIndex + 1, STEPS.length);
  }

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity('fund_prog2d_teoria', label, {
        step: currentStepIndex + 1,
        total: STEPS.length,
        correctCount: correctCount
      });
    }
  }

  function renderStory() {
    updateProgressBar();
    const step = STEPS[stepOrder[currentStepIndex]];
    reportStep(`Jogos — Programação de Jogos 2D — Etapa ${currentStepIndex + 1}/${STEPS.length}`);

    storyWrap.innerHTML = '';

    const row = document.createElement('div');
    row.className = 'eri-row';
    row.innerHTML = `
      <div class="eri-avatar">🦈</div>
      <div class="speech-bubble">
        <span class="eri-name">Eri, o Guardião do Oceano de Código</span>
        ${step.story}
      </div>
    `;
    storyWrap.appendChild(row);

    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.innerHTML = `<button class="btn" id="btnNext">Próximo →</button>`;
    storyWrap.appendChild(actions);

    document.getElementById('btnNext').addEventListener('click', renderQuestion);
  }

  function renderQuestion() {
    const step = STEPS[stepOrder[currentStepIndex]];
    const q = step.question;

    storyWrap.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2>❓ ${q.prompt}</h2>`;

    const optionsWrap = document.createElement('div');
    const letters = ['A', 'B', 'C', 'D'];
    let answered = false;

    const order = q.options.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    const correctPos = order.indexOf(q.correctIndex);

    order.forEach((origIdx, pos) => {
      const optText = q.options[origIdx];
      const opt = document.createElement('div');
      opt.className = 'option';
      opt.innerHTML = `<span class="opt-letter">${letters[pos]}</span><span>${optText}</span>`;
      opt.addEventListener('click', () => {
        if (answered) return;
        answered = true;
        selectAnswer(pos);
      });
      optionsWrap.appendChild(opt);

      function selectAnswer(chosenIdx) {
        const allOptionEls = optionsWrap.querySelectorAll('.option');
        allOptionEls.forEach(el => el.classList.add('disabled'));

        const isCorrect = chosenIdx === correctPos;
        allOptionEls[chosenIdx].classList.add(isCorrect ? 'correct' : 'incorrect');
        if (!isCorrect) {
          allOptionEls[correctPos].classList.add('correct');
        }
        if (isCorrect) correctCount++;

        const feedback = document.createElement('div');
        feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
        feedback.innerHTML = isCorrect
          ? `✅ Correto! ${q.explanation}`
          : `❌ Não foi dessa vez. A resposta certa é "<b>${q.options[q.correctIndex]}</b>": ${q.explanation.replace(/^(Isso mesmo!|Isso!|Correto!|Exato!|Perfeito!|Correta!)\s*/i, '')}`;
        card.appendChild(feedback);

        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.style.marginTop = '14px';
        actions.innerHTML = `<button class="btn" id="btnNextAfterAnswer">Próximo →</button>`;
        card.appendChild(actions);

        saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
        reportStep(`Jogos — Programação de Jogos 2D — Etapa ${currentStepIndex + 1}/${STEPS.length} (respondida)`);

        document.getElementById('btnNextAfterAnswer').addEventListener('click', () => {
          currentStepIndex++;
          if (currentStepIndex >= STEPS.length) {
            finishJourney();
          } else {
            saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
            renderStory();
          }
        });
      }
    });

    card.appendChild(optionsWrap);
    storyWrap.innerHTML = '';
    storyWrap.appendChild(card);
  }

  function finishJourney(reviewOnly) {
    const pct = STEPS.length > 0 ? Math.round((correctCount / STEPS.length) * 100) : 0;
    const passed = reviewOnly ? true : pct >= 80;
    if (!reviewOnly) {
      saveProgress({ lastStepIndex: STEPS.length, correctCount, completed: passed });
      reportStep(`Jogos — Programação de Jogos 2D — ${passed ? 'Concluída' : 'Não concluída'} (${correctCount}/${STEPS.length})`);
    }

    progressFill.style.width = '100%';
    lblStepNum.textContent = STEPS.length;

    storyWrap.innerHTML = passed ? `
      <div class="card finish-screen">
        <div class="trophy">🏆</div>
        <h2>Programação de Jogos 2D concluída!</h2>
        <p>Você já sabe movimentação por teclado e mouse, colisores, fluxo de eventos, estrutura do código e o ciclo de criação/atualização/remoção de objetos.</p>
        <div class="score">Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%).</div>
        <p>Agora é hora de colocar a mão na massa: volte à trilha e abra o módulo de prática da Central de Suporte.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn btn-secondary" id="btnRestart">🔁 Rever a teoria</button>
        </div>
      </div>
    ` : `
      <div class="card finish-screen">
        <div class="trophy">📚</div>
        <h2>Quase lá!</h2>
        <p>Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%) — é preciso pelo menos 80% de acerto para concluir esta atividade.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn" id="btnRestart">🔁 Tentar novamente</button>
        </div>
      </div>
    `;

    document.getElementById('btnRestart').addEventListener('click', () => {
      currentStepIndex = 0;
      correctCount = 0;
      stepOrder = shuffleOrder();
      localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
      saveProgress({ lastStepIndex: 0, correctCount: 0, completed: false });
      renderStory();
    });
  }

  if (saved && saved.completed) {
    currentStepIndex = STEPS.length;
    finishJourney(true);
  } else {
    renderStory();
  }
</script>
