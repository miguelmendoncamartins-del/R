<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — POO, Componentes e Multimídia: Teoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d14; --panel:#10141f; --panel2:#0d101a; --line:#20283a;
    --blue:#5ec8ff; --blue-dim:#2f7aa8; --blood:#c1121f; --blood-bright:#ff3b30;
    --gold:#e0b84a; --ink:#dbe4f2; --ink-dim:#657388;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--blue-dim); background:#060810;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(94,200,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--blue); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .bia-row{ display:flex; align-items:flex-start; gap:12px; }
  .bia-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(94,200,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--blue-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .bia-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--blue);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble code{ color:var(--gold); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--gold); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--blue-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--blue); background:rgba(94,200,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--blue); color:var(--blue); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--blue); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--gold); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--blue); color:#04162a; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--blue); border:1px solid var(--blue-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--blue); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--gold); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--blue); border:1px solid var(--blue-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(94,200,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'cod_poo_teoria';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/vendor/pptxgen.bundle.js"></script>
<script src="../../../shared/slides-generator.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>CODIFICAÇÃO — POO, COMPONENTES E MULTIMÍDIA (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">5</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `cod_poo_teoria_progress_${username}`;

  const STEPS = [
    {
      story: 'Oi! Eu sou a <b>Bia</b>, a joaninha debugger da PixelForge Studios. Hoje: <b>Programação Orientada a Objetos (POO)</b>. Uma <b>classe</b> é como um "molde" que descreve atributos e comportamentos — por exemplo, uma classe <code>Inimigo</code> com atributos de vida e velocidade. A partir dela, você cria várias <b>instâncias</b> (objetos individuais), cada uma com seus próprios valores.',
      question: {
        prompt: 'Um dev cria uma classe "Inimigo" com atributos de vida e velocidade, e depois cria três objetos diferentes a partir dela, cada um com sua própria vida atual. O que representam esses três objetos criados?',
        options: [
          'Instâncias da classe — cada uma com seus próprios valores individuais',
          'Três classes diferentes, cada uma com sua própria estrutura',
          'Três componentes desacoplados, reaproveitados no mesmo objeto',
          'Três frameworks distintos, usados juntos no projeto'
        ],
        correctIndex: 0,
        explanation: 'Isso! Cada objeto criado a partir de uma classe, com seus próprios valores, é uma instância dessa classe.'
      }
    },
    {
      story: 'Outro pilar da POO é o <b>encapsulamento</b>: esconder os detalhes internos de uma classe, expondo só o que é necessário pro resto do código usar. Isso evita que outras partes do jogo mexam diretamente em dados internos de forma descontrolada, e protege contra erros difíceis de rastrear.',
      question: {
        prompt: 'A classe "Inimigo" só permite alterar a vida através de um método específico "receberDano()", em vez de deixar qualquer parte do código mudar o valor da vida diretamente. Que princípio da POO é esse?',
        options: ['Encapsulamento dos dados internos', 'Instanciação de um novo objeto', 'Desacoplamento de componentes', 'Renderização de sprites na tela'],
        correctIndex: 0,
        explanation: 'Exato! Controlar como os dados internos são acessados e alterados, expondo só métodos específicos, é encapsulamento.'
      }
    },
    {
      story: 'Já a <b>Programação Orientada a Componentes</b> segue outra filosofia: em vez de uma classe gigante fazendo tudo, cada lógica (movimento, saúde, ataque) vira um <b>componente</b> separado e independente, que pode ser <b>desacoplado</b> e reaproveitado em qualquer objeto que precisar dele — sem herdar de uma classe pai específica.',
      question: {
        prompt: 'Em vez de criar uma classe "Inimigo" gigante com tudo dentro, um dev cria um componente separado só de "Movimento" e outro só de "Saúde", que podem ser reaproveitados em qualquer objeto do jogo. Que abordagem é essa?',
        options: [
          'Programação Orientada a Componentes — lógicas desacopladas e reaproveitáveis',
          'Programação Orientada a Objetos clássica, usando herança de classes',
          'Encapsulamento, sem nenhuma relação direta com componentes',
          'Frameworks externos usados no projeto'
        ],
        correctIndex: 0,
        explanation: 'Isso mesmo! Separar lógicas em componentes independentes e reaproveitáveis é justamente a Programação Orientada a Componentes.'
      }
    },
    {
      story: 'Muitos jogos usam <b>frameworks</b> (bibliotecas externas prontas) pra funcionalidades como áudio ou partículas, em vez de programar tudo do zero. Pra usar um framework direito, é essencial ler sua <b>documentação técnica</b> — ela explica quais funções existem, o que cada parâmetro faz e como integrar corretamente com seu projeto.',
      question: {
        prompt: 'Antes de usar uma biblioteca externa de áudio pela primeira vez, um dev lê o material que explica todas as funções disponíveis e como cada uma deve ser chamada. Que material é esse?',
        options: ['Documentação técnica oficial do framework', 'Um arquivo de save do jogo, com o progresso do jogador', 'Um componente de movimento reaproveitável', 'Um GDD, documento de design do jogo'],
        correctIndex: 0,
        explanation: 'Perfeito! O material que explica as funções e como usá-las corretamente é a documentação técnica do framework.'
      }
    },
    {
      story: 'Por fim, a <b>integração multimídia</b> usa <b>triggers</b> (disparadores): quando uma ação específica do jogador acontece (pular, atacar, colidir), o código dispara automaticamente o som ou a animação correspondente. Agora você já reconhece classes, instâncias, encapsulamento, componentes desacoplados, frameworks e triggers de multimídia!',
      question: {
        prompt: 'Toda vez que o personagem pula, o código automaticamente toca o som de pulo e ativa a animação de salto, sem nenhuma ação manual extra do dev durante o jogo. Que mecanismo dispara isso automaticamente?',
        options: [
          'Um trigger (disparador) ligado à ação de pular',
          'Encapsulamento de dados internos da classe',
          'Uma nova instância de classe sendo criada',
          'Um framework de rede multiplayer'
        ],
        correctIndex: 0,
        explanation: 'Isso! Um trigger disparado por uma ação específica do jogador é exatamente o mecanismo que ativa som/animação automaticamente.'
      }
    },
    {
      story: 'Voltando à POO: além de criar objetos direto de uma classe, você pode criar uma <b>subclasse</b> que <b>herda</b> atributos e comportamentos de uma classe base, e ainda soma funcionalidades próprias. Por exemplo, uma classe "InimigoVoador" pode herdar vida e velocidade de "Inimigo", e adicionar um comportamento exclusivo de voo.',
      question: {
        prompt: 'A classe "InimigoVoador" reaproveita os atributos de vida e velocidade já definidos em "Inimigo", e ainda adiciona um comportamento próprio de voar. Que mecanismo da POO permite essa relação entre as duas classes?',
        options: ['Herança — a subclasse reaproveita e estende a classe base', 'Encapsulamento dos dados internos', 'Um componente de movimento desacoplado', 'Um trigger de multimídia'],
        correctIndex: 0,
        explanation: 'Isso! Reaproveitar atributos/comportamentos de uma classe base e adicionar algo próprio é herança.'
      }
    },
    {
      story: 'Dentro de uma classe, é importante diferenciar dois tipos de membros: <b>atributos</b> guardam dados (como <code>vida</code> ou <code>velocidade</code>), enquanto <b>métodos</b> são as ações/comportamentos que a classe sabe executar (como <code>atacar()</code> ou <code>mover()</code>).',
      question: {
        prompt: 'Na classe "Inimigo", <code>vida</code> guarda um número e <code>atacar()</code> executa uma ação quando chamado. O que é <code>atacar()</code> nesse caso?',
        options: ['Um método — comportamento/ação que a classe executa', 'Um atributo — dado guardado pela classe', 'Uma instância criada a partir da classe', 'Um framework externo integrado ao projeto'],
        correctIndex: 0,
        explanation: 'Exato! Uma ação que a classe sabe executar, como atacar(), é um método — diferente de um atributo, que guarda dado.'
      }
    },
    {
      story: 'Nem sempre herança é a melhor escolha: se só ALGUNS inimigos precisam voar, forçar todos numa hierarquia rígida de herança complica o design. Por isso muitos jogos preferem <b>componentes desacoplados</b> — um componente "Voo" que só é anexado aos objetos que realmente precisam dele, sem alterar a estrutura dos demais.',
      question: {
        prompt: 'Só alguns inimigos do jogo precisam voar; os demais ficam no chão. Um dev decide não criar uma subclasse "InimigoVoador" pra isso, e em vez disso anexa um componente "Voo" só nos objetos que voam. Por que essa escolha evita um problema de design?',
        options: ['Evita forçar uma hierarquia rígida de herança em objetos que não precisam do comportamento', 'Porque herança é proibida em jogos digitais', 'Porque componentes sempre substituem classes por completo', 'Porque só componentes podem ter atributos de vida'],
        correctIndex: 0,
        explanation: 'Isso mesmo! Componentes desacoplados evitam obrigar todos os objetos de uma hierarquia rígida a carregar um comportamento que só alguns precisam.'
      }
    },
    {
      story: 'Frameworks não servem só pra áudio — muitos jogos usam um <b>framework de partículas</b> pronto pra efeitos como explosões, fumaça ou faíscas. Assim como qualquer framework, o primeiro passo é sempre ler a documentação técnica pra saber como chamar a função certa com os parâmetros certos.',
      question: {
        prompt: 'Um dev quer criar um efeito de explosão quando um inimigo morre, usando um framework de partículas que a equipe nunca usou antes. Qual deve ser o primeiro passo antes de chamar qualquer função desse framework?',
        options: ['Ler a documentação técnica do framework, pra saber a função e os parâmetros certos', 'Criar uma nova instância de classe do zero, sem usar o framework', 'Pular direto pro código, sem consultar nada', 'Desativar o encapsulamento da classe Inimigo'],
        correctIndex: 0,
        explanation: 'Correto! Mesmo pra frameworks diferentes (partículas, áudio etc.), o primeiro passo continua sendo consultar a documentação técnica.'
      }
    },
    {
      story: 'Já vimos um trigger disparado por pular — mas triggers também disparam em <b>colisões</b>. Quando o personagem toca numa moeda, por exemplo, o jogo pode automaticamente tocar um som de coleta e remover o sprite da moeda da tela, sem nenhuma ação manual do jogador além de encostar nela.',
      question: {
        prompt: 'Assim que o personagem toca numa moeda no cenário, o jogo automaticamente toca um som de coleta e faz o sprite da moeda desaparecer. Que mecanismo dispara essa sequência de ações a partir do toque?',
        options: ['Um trigger disparado pela colisão com a moeda', 'Uma subclasse herdando da classe Moeda', 'Um atributo de vida sendo alterado', 'Documentação técnica de um framework'],
        correctIndex: 0,
        explanation: 'Isso! A colisão do personagem com a moeda dispara o trigger que toca o som e remove o sprite — mesmo mecanismo do exemplo do pulo, só que ativado por colisão.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Codificação de Jogos — POO, Componentes e Multimídia',
      subtitle: 'Aula Teórica · Trilha POO, Componentes e Multimídia · Turma Jogos Digitais',
      capacidade: 'Aplicar técnicas e métodos de desenvolvimento utilizando Programação Orientada a Objetos (POO) e Programação Orientada a Componentes / Aplicar linguagem de programação no uso de frameworks e integração multimídia.',
      steps: STEPS,
      fileName: 'cod-poo-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Prática — Central de Codificação: POO, Componentes e Multimídia" no Portal de Aulas para os alunos resolverem os pareceres de verdade.'
    });
  };

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Codificação de Jogos — POO, Componentes e Multimídia',
      subtitle: 'Aula Teórica · Trilha POO, Componentes e Multimídia · Turma Jogos Digitais',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'cod-poo-teoria-gabarito.txt'
    });
  };

  const role = urlParams.get('role') || 'aluno';
  const btnGenSlides = document.getElementById('btnGenSlides');
  if (role === 'professor') {
    btnGenSlides.style.display = 'inline-block';
    btnGenSlides.addEventListener('click', () => {
      btnGenSlides.disabled = true;
      btnGenSlides.textContent = '⏳ Gerando...';
      setTimeout(() => {
        window.generateSlidesForGestao();
        btnGenSlides.disabled = false;
        btnGenSlides.textContent = '🖨️ Gerar Slides (PPTX)';
      }, 50);
    });
  }

  const storyWrap = document.getElementById('storyWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const lblStepTotal = document.getElementById('lblStepTotal');
  const progressFill = document.getElementById('progressFill');

  lblStepTotal.textContent = STEPS.length;

  function loadProgress() {
    try {
      return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
    } catch (e) {
      return null;
    }
  }

  function saveProgress(data) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(data));
  }

  const ORDER_KEY = PROGRESS_KEY.replace('_progress_', '_order_');

  function shuffleOrder() {
    const arr = STEPS.map((_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function loadOrder() {
    try {
      const parsed = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
      if (Array.isArray(parsed) && parsed.length === STEPS.length && parsed.every(n => Number.isInteger(n) && n >= 0 && n < STEPS.length)) {
        return parsed;
      }
    } catch (e) {}
    return null;
  }

  const saved = loadProgress();
  let stepOrder = (saved && !saved.completed) ? (loadOrder() || shuffleOrder()) : shuffleOrder();
  localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
  let currentStepIndex = (saved && !saved.completed) ? Math.min(saved.lastStepIndex || 0, STEPS.length - 1) : 0;
  let correctCount = (saved && typeof saved.correctCount === 'number') ? saved.correctCount : 0;

  function updateProgressBar() {
    const pct = Math.round(((currentStepIndex) / STEPS.length) * 100);
    progressFill.style.width = pct + '%';
    lblStepNum.textContent = Math.min(currentStepIndex + 1, STEPS.length);
  }

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity('cod_poo_teoria', label, {
        step: currentStepIndex + 1,
        total: STEPS.length,
        correctCount: correctCount
      });
    }
  }

  function renderStory() {
    updateProgressBar();
    const step = STEPS[stepOrder[currentStepIndex]];
    reportStep(`Codificação — POO e Componentes — Etapa ${currentStepIndex + 1}/${STEPS.length}`);

    storyWrap.innerHTML = '';

    const row = document.createElement('div');
    row.className = 'bia-row';
    row.innerHTML = `
      <div class="bia-avatar">🐞</div>
      <div class="speech-bubble">
        <span class="bia-name">Bia, a Joaninha Debugger</span>
        ${step.story}
      </div>
    `;
    storyWrap.appendChild(row);

    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.innerHTML = `<button class="btn" id="btnNext">Próximo →</button>`;
    storyWrap.appendChild(actions);

    document.getElementById('btnNext').addEventListener('click', renderQuestion);
  }

  function renderQuestion() {
    const step = STEPS[stepOrder[currentStepIndex]];
    const q = step.question;

    storyWrap.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2>❓ ${q.prompt}</h2>`;

    const optionsWrap = document.createElement('div');
    const letters = ['A', 'B', 'C', 'D'];
    let answered = false;

    const order = q.options.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    const correctPos = order.indexOf(q.correctIndex);

    order.forEach((origIdx, pos) => {
      const optText = q.options[origIdx];
      const opt = document.createElement('div');
      opt.className = 'option';
      opt.innerHTML = `<span class="opt-letter">${letters[pos]}</span><span>${optText}</span>`;
      opt.addEventListener('click', () => {
        if (answered) return;
        answered = true;
        selectAnswer(pos);
      });
      optionsWrap.appendChild(opt);

      function selectAnswer(chosenIdx) {
        const allOptionEls = optionsWrap.querySelectorAll('.option');
        allOptionEls.forEach(el => el.classList.add('disabled'));

        const isCorrect = chosenIdx === correctPos;
        allOptionEls[chosenIdx].classList.add(isCorrect ? 'correct' : 'incorrect');
        if (!isCorrect) {
          allOptionEls[correctPos].classList.add('correct');
        }
        if (isCorrect) correctCount++;

        const feedback = document.createElement('div');
        feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
        feedback.innerHTML = isCorrect
          ? `✅ Correto! ${q.explanation}`
          : `❌ Não foi dessa vez. A resposta certa é "<b>${q.options[q.correctIndex]}</b>": ${q.explanation.replace(/^(Isso mesmo!|Isso!|Correto!|Exato!|Perfeito!|Correta!)\s*/i, '')}`;
        card.appendChild(feedback);

        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.style.marginTop = '14px';
        actions.innerHTML = `<button class="btn" id="btnNextAfterAnswer">Próximo →</button>`;
        card.appendChild(actions);

        saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
        reportStep(`Codificação — POO e Componentes — Etapa ${currentStepIndex + 1}/${STEPS.length} (respondida)`);

        document.getElementById('btnNextAfterAnswer').addEventListener('click', () => {
          currentStepIndex++;
          if (currentStepIndex >= STEPS.length) {
            finishJourney();
          } else {
            saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
            renderStory();
          }
        });
      }
    });

    card.appendChild(optionsWrap);
    storyWrap.innerHTML = '';
    storyWrap.appendChild(card);
  }

  function finishJourney(reviewOnly) {
    const pct = STEPS.length > 0 ? Math.round((correctCount / STEPS.length) * 100) : 0;
    const passed = reviewOnly ? true : pct >= 80;
    if (!reviewOnly) {
      saveProgress({ lastStepIndex: STEPS.length, correctCount, completed: passed });
      reportStep(`Codificação — POO e Componentes — ${passed ? 'Concluída' : 'Não concluída'} (${correctCount}/${STEPS.length})`);
    }

    progressFill.style.width = '100%';
    lblStepNum.textContent = STEPS.length;

    storyWrap.innerHTML = passed ? `
      <div class="card finish-screen">
        <div class="trophy">🏆</div>
        <h2>POO, Componentes e Multimídia concluídos!</h2>
        <p>Você já reconhece classes, instâncias, encapsulamento, componentes desacoplados, frameworks/documentação técnica e triggers de integração multimídia.</p>
        <div class="score">Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%).</div>
        <p>Agora é hora de colocar a mão na massa: volte à trilha e abra o módulo de prática da Central de Codificação.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn btn-secondary" id="btnRestart">🔁 Rever a teoria</button>
        </div>
      </div>
    ` : `
      <div class="card finish-screen">
        <div class="trophy">📚</div>
        <h2>Quase lá!</h2>
        <p>Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%) — é preciso pelo menos 80% de acerto para concluir esta atividade.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn" id="btnRestart">🔁 Tentar novamente</button>
        </div>
      </div>
    `;

    document.getElementById('btnRestart').addEventListener('click', () => {
      currentStepIndex = 0;
      correctCount = 0;
      stepOrder = shuffleOrder();
      localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
      saveProgress({ lastStepIndex: 0, correctCount: 0, completed: false });
      renderStory();
    });
  }

  if (saved && saved.completed) {
    currentStepIndex = STEPS.length;
    finishJourney(true);
  } else {
    renderStory();
  }
</script>
