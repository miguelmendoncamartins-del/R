<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Revoluções Industriais e Indústria 4.0: Teoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d14; --panel:#10141f; --panel2:#0d101a; --line:#20283a;
    --blue:#5ec8ff; --blue-dim:#2f7aa8; --blood:#c1121f; --blood-bright:#ff3b30;
    --gold:#e0b84a; --ink:#dbe4f2; --ink-dim:#657388;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--blue-dim); background:#060810;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(94,200,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--blue); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .bit-row{ display:flex; align-items:flex-start; gap:12px; }
  .bit-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(94,200,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--blue-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .bit-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--blue);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble code{ color:var(--gold); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--gold); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--blue-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--blue); background:rgba(94,200,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--blue); color:var(--blue); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--blue); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--gold); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--blue); color:#04162a; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--blue); border:1px solid var(--blue-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--blue); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--gold); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--blue); border:1px solid var(--blue-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(94,200,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'mundo_revolucao_teoria';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/vendor/pptxgen.bundle.js"></script>
<script src="../../../shared/slides-generator.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>JOGOS — REVOLUÇÕES INDUSTRIAIS E INDÚSTRIA 4.0 (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">5</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `mundo_revolucao_teoria_progress_${username}`;

  const STEPS = [
    {
      story: 'Olá! Eu sou o <b>Bit</b>, assistente de indústria 4.0 da PixelForge Studios — minha função é te mostrar como o mundo do trabalho chegou até aqui. Tudo começou na <b>1ª Revolução Industrial</b> (final do século 18), quando a <b>máquina a vapor</b> substituiu a força humana e animal nas fábricas de tecelagem. Artesãos que trabalhavam em casa migraram em massa pras cidades pra operar máquinas — o início do <b>êxodo rural</b> e das primeiras fábricas.',
      question: {
        prompt: 'Uma oficina do século 18 troca teares manuais por teares movidos a máquina a vapor, e os artesãos passam a se mudar pra perto da fábrica pra trabalhar nela. Isso marca qual revolução industrial?',
        options: [
          '1ª Revolução Industrial — mecanização com máquina a vapor',
          '2ª Revolução Industrial — eletricidade e linha de montagem',
          '3ª Revolução Industrial — eletrônica e automação por computador',
          '4ª Revolução Industrial — máquinas conectadas em tempo real'
        ],
        correctIndex: 0,
        explanation: 'Isso! Máquina a vapor substituindo o trabalho manual/animal e o êxodo rural pras fábricas são a marca registrada da 1ª Revolução Industrial.'
      }
    },
    {
      story: 'Mais de um século depois veio a <b>2ª Revolução Industrial</b> (final do século 19 até início do 20): a <b>eletricidade</b> chegou às fábricas e, com ela, a <b>linha de montagem</b> e a <b>produção em massa</b> — cada operário fazia uma etapa específica e repetida do processo. O impacto social foi enorme: surgiram empregos padronizados, jornadas de trabalho regulares e os primeiros grandes sindicatos.',
      question: {
        prompt: 'Uma fábrica de automóveis do início do século 20 organiza sua produção em uma linha de montagem elétrica, onde cada operário repete sempre a mesma etapa do processo. Que revolução industrial essa cena representa?',
        options: [
          '2ª Revolução Industrial — eletricidade e linha de montagem',
          '1ª Revolução Industrial — mecanização com máquina a vapor',
          '3ª Revolução Industrial — eletrônica e automação por computador',
          '4ª Revolução Industrial — máquinas conectadas em tempo real'
        ],
        correctIndex: 0,
        explanation: 'Exato! Eletricidade movendo a fábrica e a linha de montagem com produção em massa são a marca da 2ª Revolução Industrial.'
      }
    },
    {
      story: 'Na segunda metade do século 20 veio a <b>3ª Revolução Industrial</b>: a <b>eletrônica</b> e os primeiros <b>computadores</b> permitiram automatizar máquinas com programação, sem precisar de um operário controlando cada movimento manualmente. Isso reduziu o trabalho manual repetitivo e criou uma nova demanda: técnicos e programadores capazes de configurar e manter esses sistemas automatizados.',
      question: {
        prompt: 'Uma fábrica passa a controlar suas máquinas por meio de computadores e circuitos programáveis, reduzindo a necessidade de um operário acionando cada peça manualmente — mas as máquinas ainda não trocam dados entre si pela internet. Que revolução é essa?',
        options: [
          '3ª Revolução Industrial — eletrônica e automação por computador',
          '2ª Revolução Industrial — eletricidade e linha de montagem',
          '1ª Revolução Industrial — mecanização com máquina a vapor',
          '4ª Revolução Industrial — máquinas conectadas em tempo real'
        ],
        correctIndex: 0,
        explanation: 'Isso mesmo! Automação por eletrônica/computador, sem conexão em rede entre as máquinas, é a marca da 3ª Revolução Industrial.'
      }
    },
    {
      story: 'E chegamos na <b>4ª Revolução Industrial</b>, também chamada de <b>Indústria 4.0</b>: agora as máquinas não só são automatizadas, elas se <b>conectam entre si e à internet</b> em tempo real, formando <b>sistemas ciber-físicos</b> que tomam decisões sozinhos com base em dados. O impacto pro desenvolvimento de cada pessoa é direto: quem trabalha hoje precisa de <b>competências digitais</b> e aprender a se atualizar constantemente, porque as ferramentas mudam rápido.',
      question: {
        prompt: 'Sensores instalados em máquinas de uma fábrica enviam dados em tempo real pela internet, e o sistema ajusta sozinho a produção com base nesses dados, sem intervenção manual constante. Isso é característica de qual revolução?',
        options: [
          '4ª Revolução Industrial — máquinas conectadas em tempo real',
          '3ª Revolução Industrial — eletrônica e automação por computador',
          '2ª Revolução Industrial — eletricidade e linha de montagem',
          '1ª Revolução Industrial — mecanização com máquina a vapor'
        ],
        correctIndex: 0,
        explanation: 'Perfeito! Máquinas conectadas trocando dados em tempo real e ajustando a produção sozinhas é exatamente a Indústria 4.0.'
      }
    },
    {
      story: 'A Indústria 4.0 é sustentada por várias <b>tecnologias habilitadoras</b> trabalhando juntas: <b>nuvem</b> e <b>IoT</b> (sensores conectados enviando dados o tempo todo), <b>manufatura digital/aditiva</b> (como impressão 3D) e <b>robótica colaborativa</b>, além de <b>big data</b> (analisar grandes volumes de dados pra prever problemas), <b>segurança digital</b> (proteger tudo isso de ataques) e <b>integração de sistemas</b> (fazer sistemas diferentes conversarem entre si). Agora você já reconhece os marcos das revoluções industriais e as tecnologias que movem a Indústria 4.0!',
      question: {
        prompt: 'Uma empresa analisa anos de histórico de sensores de uma máquina pra prever, com antecedência, quando uma peça provavelmente vai falhar. Qual tecnologia habilitadora da Indústria 4.0 está sendo usada principalmente aqui?',
        options: [
          'Big Data — analisar grandes volumes de dados históricos pra prever falhas',
          'Manufatura aditiva — usar impressão 3D pra fabricar peças sob demanda',
          'Segurança digital — proteger sistemas conectados contra ataques',
          'Robótica colaborativa — robôs trabalhando lado a lado com humanos'
        ],
        correctIndex: 0,
        explanation: 'Isso! Analisar um grande histórico de dados pra prever eventos futuros é o uso clássico de Big Data dentro da Indústria 4.0.'
      }
    },
    {
      story: 'Vamos destrinchar as tecnologias habilitadoras uma a uma. A dupla <b>nuvem</b> e <b>IoT</b> (Internet das Coisas) é a base de tudo: sensores espalhados pela fábrica (IoT) coletam dados o tempo todo e enviam pra servidores remotos (nuvem), que guardam e processam essas informações de qualquer lugar, sem precisar de um computador local rodando 24h.',
      question: {
        prompt: 'Uma estufa agrícola tem sensores de temperatura e umidade que enviam dados a cada minuto pra um servidor remoto, permitindo ao produtor acompanhar tudo pelo celular de qualquer lugar. Que dupla de tecnologias habilitadoras está em ação aqui?',
        options: [
          'IoT (sensores conectados) e nuvem (armazenamento/processamento remoto)',
          'Manufatura aditiva e robótica colaborativa',
          'Big Data e segurança digital',
          'Integração de sistemas apenas, sem sensores envolvidos'
        ],
        correctIndex: 0,
        explanation: 'Isso! Sensores coletando dados em tempo real (IoT) e enviando pra um servidor remoto acessível de qualquer lugar (nuvem) é a combinação clássica dessas duas tecnologias habilitadoras.'
      }
    },
    {
      story: '<b>Manufatura digital/aditiva</b> (como a impressão 3D) permite fabricar peças sob demanda, sem precisar de um molde industrial caro pronto — ótimo pra protótipos e peças de reposição raras. Já a <b>robótica colaborativa</b> (cobots) trabalha lado a lado com humanos na linha de produção, dividindo tarefas repetitivas ou pesadas, sem precisar de gaiolas de segurança isolando o robô.',
      question: {
        prompt: 'Uma fábrica precisa de uma peça de reposição rara que não é mais fabricada em série, então imprime a peça sob demanda numa impressora 3D industrial, evitando encomendar um lote inteiro. Qual tecnologia habilitadora está sendo usada?',
        options: [
          'Manufatura digital/aditiva (impressão 3D sob demanda)',
          'Big Data (análise preditiva de falhas)',
          'Integração de sistemas (comunicação entre setores)',
          'Segurança digital (proteção contra ataques)'
        ],
        correctIndex: 0,
        explanation: 'Exato! Fabricar uma peça sob demanda, sem molde industrial pronto, é o uso clássico da manufatura digital/aditiva (como a impressão 3D).'
      }
    },
    {
      story: 'Quanto mais máquinas conectadas, maior a superfície de ataque — por isso a <b>segurança digital</b> é tão essencial na Indústria 4.0 quanto qualquer sensor ou robô. Ela envolve proteger os sistemas conectados contra invasões, com práticas como autenticação forte, criptografia dos dados transmitidos e monitoramento constante de acessos suspeitos.',
      question: {
        prompt: 'Uma fábrica conectada exige autenticação em duas etapas pra acessar o painel de controle das máquinas e criptografa todos os dados enviados entre os sensores e o servidor. Que tecnologia habilitadora da Indústria 4.0 está sendo aplicada?',
        options: [
          'Segurança digital',
          'Manufatura aditiva',
          'Robótica colaborativa',
          'Big Data'
        ],
        correctIndex: 0,
        explanation: 'Isso! Autenticação forte e criptografia de dados são medidas centrais de segurança digital, essenciais numa fábrica com tantos sistemas conectados.'
      }
    },
    {
      story: 'Por fim, de nada adianta ter nuvem, IoT, robótica e segurança se cada sistema "fala uma língua diferente". A <b>integração de sistemas</b> conecta softwares distintos (estoque, produção, vendas) pra que troquem dados automaticamente entre si, sem alguém copiando planilha de um sistema pro outro manualmente.',
      question: {
        prompt: 'O sistema de estoque de uma fábrica avisa automaticamente o sistema de produção quando a matéria-prima está acabando, sem nenhum funcionário digitando essa informação manualmente de um sistema pro outro. Que tecnologia habilitadora é essa?',
        options: [
          'Integração de sistemas',
          'Manufatura aditiva',
          'Robótica colaborativa',
          'Nuvem e IoT isoladamente, sem integração nenhuma'
        ],
        correctIndex: 0,
        explanation: 'Isso mesmo! Sistemas diferentes trocando dados automaticamente entre si, sem intervenção manual, é exatamente integração de sistemas.'
      }
    },
    {
      story: 'E qual o impacto de tudo isso na vida de quem trabalha? Com a Indústria 4.0, funções repetitivas tendem a ser automatizadas, e quem trabalha precisa desenvolver <b>competências digitais</b> continuamente — aprender novas ferramentas não é mais "um curso que se faz uma vez", e sim um hábito constante ao longo da carreira.',
      question: {
        prompt: 'Um operário que antes só apertava botões numa linha de montagem agora precisa aprender a interpretar dados de um painel digital e ajustar parâmetros num sistema conectado. Que impacto da Indústria 4.0 no desenvolvimento do indivíduo esse cenário representa?',
        options: [
          'A necessidade de desenvolver competências digitais continuamente ao longo da carreira',
          'O fim total do trabalho humano nas fábricas, substituído por máquinas',
          'Nenhum impacto real, o trabalho continua exatamente igual a antes',
          'A obrigação de trocar de profissão completamente, sem nenhuma adaptação possível'
        ],
        correctIndex: 0,
        explanation: 'Isso! A Indústria 4.0 exige aprendizado contínuo de competências digitais — não muda só a ferramenta, muda a necessidade de se atualizar sempre.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Jogos — Revoluções Industriais e Indústria 4.0',
      subtitle: 'Aula Teórica · Trilha Revoluções Industriais e Indústria 4.0 · Turma Jogos Digitais',
      capacidade: 'Reconhecer os marcos que alavancaram as revoluções industriais e seus impactos nas atividades de produção e no desenvolvimento do indivíduo / Reconhecer as tecnologias habilitadoras para indústria 4.0.',
      steps: STEPS,
      fileName: 'mundo-revolucao-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Prática — Central do Mundo do Trabalho: Revoluções Industriais" no Portal de Aulas para os alunos resolverem os pareceres de verdade.'
    });
  };

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Jogos — Revoluções Industriais e Indústria 4.0',
      subtitle: 'Aula Teórica · Trilha Revoluções Industriais e Indústria 4.0 · Turma Jogos Digitais',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'mundo-revolucao-teoria-gabarito.txt'
    });
  };

  const role = urlParams.get('role') || 'aluno';
  const btnGenSlides = document.getElementById('btnGenSlides');
  if (role === 'professor') {
    btnGenSlides.style.display = 'inline-block';
    btnGenSlides.addEventListener('click', () => {
      btnGenSlides.disabled = true;
      btnGenSlides.textContent = '⏳ Gerando...';
      setTimeout(() => {
        window.generateSlidesForGestao();
        btnGenSlides.disabled = false;
        btnGenSlides.textContent = '🖨️ Gerar Slides (PPTX)';
      }, 50);
    });
  }

  const storyWrap = document.getElementById('storyWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const lblStepTotal = document.getElementById('lblStepTotal');
  const progressFill = document.getElementById('progressFill');

  lblStepTotal.textContent = STEPS.length;

  function loadProgress() {
    try {
      return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
    } catch (e) {
      return null;
    }
  }

  function saveProgress(data) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(data));
  }

  const ORDER_KEY = PROGRESS_KEY.replace('_progress_', '_order_');

  function shuffleOrder() {
    const arr = STEPS.map((_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function loadOrder() {
    try {
      const parsed = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
      if (Array.isArray(parsed) && parsed.length === STEPS.length && parsed.every(n => Number.isInteger(n) && n >= 0 && n < STEPS.length)) {
        return parsed;
      }
    } catch (e) {}
    return null;
  }

  const saved = loadProgress();
  let stepOrder = (saved && !saved.completed) ? (loadOrder() || shuffleOrder()) : shuffleOrder();
  localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
  let currentStepIndex = (saved && !saved.completed) ? Math.min(saved.lastStepIndex || 0, STEPS.length - 1) : 0;
  let correctCount = (saved && typeof saved.correctCount === 'number') ? saved.correctCount : 0;

  function updateProgressBar() {
    const pct = Math.round(((currentStepIndex) / STEPS.length) * 100);
    progressFill.style.width = pct + '%';
    lblStepNum.textContent = Math.min(currentStepIndex + 1, STEPS.length);
  }

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity('mundo_revolucao_teoria', label, {
        step: currentStepIndex + 1,
        total: STEPS.length,
        correctCount: correctCount
      });
    }
  }

  function renderStory() {
    updateProgressBar();
    const step = STEPS[stepOrder[currentStepIndex]];
    reportStep(`Jogos — Revoluções Industriais — Etapa ${currentStepIndex + 1}/${STEPS.length}`);

    storyWrap.innerHTML = '';

    const row = document.createElement('div');
    row.className = 'bit-row';
    row.innerHTML = `
      <div class="bit-avatar">🤖</div>
      <div class="speech-bubble">
        <span class="bit-name">Bit, Assistente de Indústria 4.0</span>
        ${step.story}
      </div>
    `;
    storyWrap.appendChild(row);

    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.innerHTML = `<button class="btn" id="btnNext">Próximo →</button>`;
    storyWrap.appendChild(actions);

    document.getElementById('btnNext').addEventListener('click', renderQuestion);
  }

  function renderQuestion() {
    const step = STEPS[stepOrder[currentStepIndex]];
    const q = step.question;

    storyWrap.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2>❓ ${q.prompt}</h2>`;

    const optionsWrap = document.createElement('div');
    const letters = ['A', 'B', 'C', 'D'];
    let answered = false;

    const order = q.options.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    const correctPos = order.indexOf(q.correctIndex);

    order.forEach((origIdx, pos) => {
      const optText = q.options[origIdx];
      const opt = document.createElement('div');
      opt.className = 'option';
      opt.innerHTML = `<span class="opt-letter">${letters[pos]}</span><span>${optText}</span>`;
      opt.addEventListener('click', () => {
        if (answered) return;
        answered = true;
        selectAnswer(pos);
      });
      optionsWrap.appendChild(opt);

      function selectAnswer(chosenIdx) {
        const allOptionEls = optionsWrap.querySelectorAll('.option');
        allOptionEls.forEach(el => el.classList.add('disabled'));

        const isCorrect = chosenIdx === correctPos;
        allOptionEls[chosenIdx].classList.add(isCorrect ? 'correct' : 'incorrect');
        if (!isCorrect) {
          allOptionEls[correctPos].classList.add('correct');
        }
        if (isCorrect) correctCount++;

        const feedback = document.createElement('div');
        feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
        feedback.innerHTML = isCorrect
          ? `✅ Correto! ${q.explanation}`
          : `❌ Não foi dessa vez. A resposta certa é "<b>${q.options[q.correctIndex]}</b>": ${q.explanation.replace(/^(Isso mesmo!|Isso!|Correto!|Exato!|Perfeito!|Correta!)\s*/i, '')}`;
        card.appendChild(feedback);

        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.style.marginTop = '14px';
        actions.innerHTML = `<button class="btn" id="btnNextAfterAnswer">Próximo →</button>`;
        card.appendChild(actions);

        saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
        reportStep(`Jogos — Revoluções Industriais — Etapa ${currentStepIndex + 1}/${STEPS.length} (respondida)`);

        document.getElementById('btnNextAfterAnswer').addEventListener('click', () => {
          currentStepIndex++;
          if (currentStepIndex >= STEPS.length) {
            finishJourney();
          } else {
            saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
            renderStory();
          }
        });
      }
    });

    card.appendChild(optionsWrap);
    storyWrap.innerHTML = '';
    storyWrap.appendChild(card);
  }

  function finishJourney(reviewOnly) {
    const pct = STEPS.length > 0 ? Math.round((correctCount / STEPS.length) * 100) : 0;
    const passed = reviewOnly ? true : pct >= 80;
    if (!reviewOnly) {
      saveProgress({ lastStepIndex: STEPS.length, correctCount, completed: passed });
      reportStep(`Jogos — Revoluções Industriais — ${passed ? 'Concluída' : 'Não concluída'} (${correctCount}/${STEPS.length})`);
    }

    progressFill.style.width = '100%';
    lblStepNum.textContent = STEPS.length;

    storyWrap.innerHTML = passed ? `
      <div class="card finish-screen">
        <div class="trophy">🏆</div>
        <h2>Revoluções Industriais concluídas!</h2>
        <p>Você já reconhece os marcos das quatro revoluções industriais — da máquina a vapor até as fábricas conectadas — e as tecnologias que sustentam a Indústria 4.0: nuvem, IoT, manufatura digital, robótica, big data, segurança digital e integração de sistemas.</p>
        <div class="score">Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%).</div>
        <p>Agora é hora de colocar a mão na massa: volte à trilha e abra o módulo de prática da Central do Mundo do Trabalho.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn btn-secondary" id="btnRestart">🔁 Rever a teoria</button>
        </div>
      </div>
    ` : `
      <div class="card finish-screen">
        <div class="trophy">📚</div>
        <h2>Quase lá!</h2>
        <p>Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%) — é preciso pelo menos 80% de acerto para concluir esta atividade.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn" id="btnRestart">🔁 Tentar novamente</button>
        </div>
      </div>
    `;

    document.getElementById('btnRestart').addEventListener('click', () => {
      currentStepIndex = 0;
      correctCount = 0;
      stepOrder = shuffleOrder();
      localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
      saveProgress({ lastStepIndex: 0, correctCount: 0, completed: false });
      renderStory();
    });
  }

  if (saved && saved.completed) {
    currentStepIndex = STEPS.length;
    finishJourney(true);
  } else {
    renderStory();
  }
</script>
