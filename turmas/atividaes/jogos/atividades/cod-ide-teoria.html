<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Instalação e Configuração da IDE: Teoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d14; --panel:#10141f; --panel2:#0d101a; --line:#20283a;
    --blue:#5ec8ff; --blue-dim:#2f7aa8; --blood:#c1121f; --blood-bright:#ff3b30;
    --gold:#e0b84a; --ink:#dbe4f2; --ink-dim:#657388;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--blue-dim); background:#060810;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(94,200,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--blue); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .bia-row{ display:flex; align-items:flex-start; gap:12px; }
  .bia-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(94,200,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--blue-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .bia-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--blue);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble code{ color:var(--gold); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--gold); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--blue-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--blue); background:rgba(94,200,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--blue); color:var(--blue); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--blue); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--gold); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--blue); color:#04162a; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--blue); border:1px solid var(--blue-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--blue); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--gold); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--blue); border:1px solid var(--blue-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(94,200,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'cod_ide_teoria';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/vendor/pptxgen.bundle.js"></script>
<script src="../../../shared/slides-generator.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>CODIFICAÇÃO — INSTALAÇÃO E CONFIGURAÇÃO DA IDE (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">5</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `cod_ide_teoria_progress_${username}`;

  const STEPS = [
    {
      story: 'Olá! Eu sou a <b>Bia</b>, a joaninha debugger da PixelForge Studios — vou te acompanhar por toda a trilha de Codificação de Jogos. Nossa primeira parada: a <b>IDE</b> (Ambiente de Desenvolvimento Integrado). Diferente de um editor de texto simples, uma IDE junta editor de código, depurador, terminal e outras ferramentas num só lugar, facilitando muito o dia a dia de quem programa jogos.',
      question: {
        prompt: 'Uma ferramenta junta, num único programa, editor de código, depurador (debugger) e terminal integrado, facilitando o fluxo de trabalho do desenvolvedor. Que tipo de ferramenta é essa?',
        options: [
          'Uma IDE (Ambiente de Desenvolvimento Integrado)',
          'Um simples bloco de notas, sem nenhuma ferramenta extra',
          'Um navegador de internet comum, usado pra acessar sites',
          'Um editor de imagens, usado pra criar arte pro jogo'
        ],
        correctIndex: 0,
        explanation: 'Isso! Reunir editor, depurador e terminal num só programa é justamente o que caracteriza uma IDE.'
      }
    },
    {
      story: 'A IDE mais usada aqui na PixelForge é o <b>VSCode</b>. A <b>instalação</b> é simples: baixar o instalador oficial pro seu sistema operacional e seguir o assistente. Mas antes de instalar, vale entender que existem várias IDEs no mercado — a escolha depende da linguagem e da engine que você vai usar no jogo.',
      question: {
        prompt: 'Antes de instalar uma IDE pra um projeto de jogo, o que é mais importante levar em conta na escolha?',
        options: [
          'A linguagem de programação e a engine que serão usadas no projeto',
          'Só a cor do tema visual da IDE, sem mais nenhum critério',
          'Qual IDE é mais famosa nas redes sociais no momento',
          'Nenhum critério importa, todas as IDEs são idênticas'
        ],
        correctIndex: 0,
        explanation: 'Exato! A escolha da IDE deve considerar a linguagem e a engine do projeto — nem toda IDE serve igualmente bem pra qualquer stack.'
      }
    },
    {
      story: 'Depois de instalada, a IDE precisa de <b>configuração</b>: um passo importante são as <b>variáveis de ambiente</b>, como o <code>PATH</code>. Elas dizem ao sistema operacional onde encontrar os programas (como compiladores) que a IDE vai chamar por trás dos panos. Sem isso configurado direito, comandos que deveriam funcionar simplesmente "não são encontrados".',
      question: {
        prompt: 'Um aluno instala um compilador, mas ao tentar rodá-lo pelo terminal da IDE recebe o erro "comando não encontrado". O que provavelmente falta configurar?',
        options: [
          'A variável de ambiente PATH, que diz ao sistema onde encontrar o programa',
          'O tema visual da IDE, que não tem relação com comandos',
          'O tamanho da fonte do editor de código, sem relação com comandos',
          'Nada, isso é normal e simplesmente não tem solução possível'
        ],
        correctIndex: 0,
        explanation: 'Isso mesmo! Quando o sistema não "encontra" um comando instalado, geralmente é a variável de ambiente PATH que está sem o caminho correto configurado.'
      }
    },
    {
      story: 'Pra deixar a IDE ainda mais poderosa, existem as <b>extensões</b>: pequenos plugins que adicionam funcionalidades extras, como realce de sintaxe pra uma linguagem específica, ferramentas de debug pra uma engine, ou até formatação automática de código. Cada projeto costuma ter seu próprio conjunto recomendado de extensões.',
      question: {
        prompt: 'Um dev instala um plugin no VSCode que adiciona realce de sintaxe e ferramentas de debug específicas pra engine que ele está usando. Que recurso da IDE ele está usando?',
        options: [
          'Extensões — plugins que adicionam funcionalidades extras à IDE',
          'Variáveis de ambiente configuradas manualmente no sistema',
          'Um novo sistema operacional inteiro, instalado do zero',
          'Nenhum recurso da IDE, é uma ferramenta totalmente separada'
        ],
        correctIndex: 0,
        explanation: 'Isso! Plugins que adicionam funcionalidades específicas à IDE são justamente as extensões.'
      }
    },
    {
      story: 'Depois de instalar e configurar tudo, o último passo é o <b>teste básico</b>: escrever e rodar um programa simples que exibe "<code>Hello World</code>" na tela. Se essa mensagem aparecer certinho, significa que o ambiente inteiro (IDE, compilador, variáveis de ambiente) está funcionando corretamente, pronto pra começar o projeto de verdade. Agora você já reconhece o que é uma IDE, como instalar, configurar e testar o ambiente!',
      question: {
        prompt: 'Depois de instalar e configurar toda a IDE, um aluno escreve um pequeno programa que só exibe uma mensagem na tela, antes de começar o projeto de verdade. Qual é o propósito principal desse teste?',
        options: [
          'Confirmar que todo o ambiente (IDE, compilador, variáveis de ambiente) está funcionando corretamente',
          'Impressionar o professor com um programa bem complexo e cheio de funcionalidades extras',
          'Testar apenas a velocidade da conexão de internet do computador do aluno',
          'Nenhum propósito real, é apenas uma tradição sem nenhuma função prática de verdade'
        ],
        correctIndex: 0,
        explanation: 'Perfeito! O teste "Hello World" serve justamente pra validar que todo o ambiente de desenvolvimento está funcionando antes de começar o projeto real.'
      }
    },
    {
      story: 'Antes das engines modernas, era comum escrever jogos praticamente sem essas facilidades: código em baixo nível, compiladores manuais e pouquíssima automação. Conhecer esse <b>histórico</b> ajuda a entender por que ferramentas como a IDE moderna economizam tanto trabalho hoje.',
      question: {
        prompt: 'Comparado às linguagens e ferramentas usadas nos primórdios do desenvolvimento de jogos, o que uma IDE moderna oferece a mais, tornando o trabalho do programador bem mais produtivo?',
        options: [
          'Editor, depurador, terminal e outras ferramentas já integradas num só lugar',
          'Nenhuma vantagem real, é só uma questão de estética visual',
          'Jogos eram programados exatamente do mesmo jeito, sem nenhuma diferença',
          'Apenas gráficos mais bonitos na tela do computador'
        ],
        correctIndex: 0,
        explanation: 'Isso! O grande ganho histórico das IDEs modernas é reunir várias ferramentas — antes usadas separadamente e manualmente — num único ambiente integrado.'
      }
    },
    {
      story: 'É importante não confundir <b>instalar</b> com <b>configurar</b>: instalar é copiar o programa pro computador (rodar o instalador). Configurar é o passo seguinte — ajustar variáveis de ambiente, preferências e extensões pra IDE funcionar do jeito que o projeto precisa.',
      question: {
        prompt: 'Um aluno baixa o instalador do VSCode e conclui a instalação com sucesso, mas ainda precisa ajustar variáveis de ambiente e instalar extensões antes de começar a programar de verdade. Essa segunda etapa é chamada de quê?',
        options: [
          'Configuração do ambiente',
          'Instalação, que é a mesma coisa que configuração',
          'Desinstalação do programa recém-instalado',
          'Renderização de sprites na tela'
        ],
        correctIndex: 0,
        explanation: 'Exato! Instalar coloca o programa no computador; configurar é o passo seguinte de ajustar tudo pro projeto específico.'
      }
    },
    {
      story: 'Às vezes, mais de uma versão de uma mesma ferramenta fica instalada no computador — por exemplo, duas versões diferentes de um compilador. Quando isso acontece, a ordem das entradas na variável <code>PATH</code> decide qual versão o sistema vai encontrar primeiro ao rodar um comando.',
      question: {
        prompt: 'Um dev tem duas versões de um compilador instaladas e percebe que o terminal está sempre chamando a versão antiga, mesmo depois de instalar a nova. Qual é a explicação mais provável?',
        options: [
          'A entrada da versão antiga aparece antes na variável PATH, sendo encontrada primeiro',
          'O computador só é capaz de guardar uma versão de cada programa',
          'A versão nova foi apagada automaticamente sem motivo',
          'Isso nunca acontece de verdade em computadores reais'
        ],
        correctIndex: 0,
        explanation: 'Isso mesmo! Quando há várias versões instaladas, a ordem das pastas na variável PATH determina qual é encontrada primeiro.'
      }
    },
    {
      story: 'Nem toda extensão serve pra todo projeto: instalar uma extensão pensada pra outra linguagem ou engine pode até conflitar com o que você está usando. Por isso, vale escolher extensões específicas pra stack do projeto — por exemplo, uma extensão de C# faz sentido pra quem trabalha com Unity, mas não ajuda em nada num projeto em GDScript.',
      question: {
        prompt: 'Um aluno que programa em GDScript na Godot instala, por engano, uma extensão pensada só pra projetos C# na Unity. O que é mais provável de acontecer?',
        options: [
          'A extensão não ajuda em nada nesse projeto, pois foi pensada pra outra linguagem/engine',
          'A extensão converte automaticamente todo o projeto pra C#',
          'Nenhum problema, porque toda extensão serve pra qualquer projeto',
          'O VSCode para de funcionar completamente por causa disso'
        ],
        correctIndex: 0,
        explanation: 'Isso! Extensões costumam ser específicas de linguagem/engine — instalar uma fora de contexto simplesmente não ajuda no projeto atual.'
      }
    },
    {
      story: 'Se o teste "Hello World" falhar mesmo depois de tudo instalado e configurado, o problema costuma estar numa etapa anterior: PATH mal configurado, SDK ausente ou extensão faltando. Por isso o teste básico é tão valioso — ele aponta exatamente se algo ficou pra trás no processo. Agora você já reconhece o histórico, a instalação, a configuração de ambiente, as extensões certas e o papel do teste "Hello World"!',
      question: {
        prompt: 'O teste "Hello World" de um aluno falha com uma mensagem de erro relacionada ao compilador não encontrado. Em qual etapa anterior do processo ele deve procurar o problema primeiro?',
        options: [
          'Na instalação/configuração do ambiente, como variáveis de ambiente e SDK',
          'No próprio código do "Hello World", que está sempre correto por padrão',
          'Na velocidade da internet do computador',
          'No tema visual escolhido para a IDE'
        ],
        correctIndex: 0,
        explanation: 'Perfeito! Um "Hello World" que falha por compilador não encontrado aponta pra um problema de instalação/configuração do ambiente, não do próprio código simples.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Codificação de Jogos — Instalação e Configuração da IDE',
      subtitle: 'Aula Teórica · Trilha Instalação e Configuração da IDE · Turma Jogos Digitais',
      capacidade: 'Reconhecer os procedimentos de instalação e configuração do ambiente de desenvolvimento (IDE) / Executar instalação e configuração da IDE (VSCode).',
      steps: STEPS,
      fileName: 'cod-ide-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Prática — Central de Codificação: Instalação e Configuração da IDE" no Portal de Aulas para os alunos resolverem os pareceres de verdade.'
    });
  };

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Codificação de Jogos — Instalação e Configuração da IDE',
      subtitle: 'Aula Teórica · Trilha Instalação e Configuração da IDE · Turma Jogos Digitais',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'cod-ide-teoria-gabarito.txt'
    });
  };

  const role = urlParams.get('role') || 'aluno';
  const btnGenSlides = document.getElementById('btnGenSlides');
  if (role === 'professor') {
    btnGenSlides.style.display = 'inline-block';
    btnGenSlides.addEventListener('click', () => {
      btnGenSlides.disabled = true;
      btnGenSlides.textContent = '⏳ Gerando...';
      setTimeout(() => {
        window.generateSlidesForGestao();
        btnGenSlides.disabled = false;
        btnGenSlides.textContent = '🖨️ Gerar Slides (PPTX)';
      }, 50);
    });
  }

  const storyWrap = document.getElementById('storyWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const lblStepTotal = document.getElementById('lblStepTotal');
  const progressFill = document.getElementById('progressFill');

  lblStepTotal.textContent = STEPS.length;

  function loadProgress() {
    try {
      return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
    } catch (e) {
      return null;
    }
  }

  function saveProgress(data) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(data));
  }

  const ORDER_KEY = PROGRESS_KEY.replace('_progress_', '_order_');

  function shuffleOrder() {
    const arr = STEPS.map((_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function loadOrder() {
    try {
      const parsed = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
      if (Array.isArray(parsed) && parsed.length === STEPS.length && parsed.every(n => Number.isInteger(n) && n >= 0 && n < STEPS.length)) {
        return parsed;
      }
    } catch (e) {}
    return null;
  }

  const saved = loadProgress();
  let stepOrder = (saved && !saved.completed) ? (loadOrder() || shuffleOrder()) : shuffleOrder();
  localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
  let currentStepIndex = (saved && !saved.completed) ? Math.min(saved.lastStepIndex || 0, STEPS.length - 1) : 0;
  let correctCount = (saved && typeof saved.correctCount === 'number') ? saved.correctCount : 0;

  function updateProgressBar() {
    const pct = Math.round(((currentStepIndex) / STEPS.length) * 100);
    progressFill.style.width = pct + '%';
    lblStepNum.textContent = Math.min(currentStepIndex + 1, STEPS.length);
  }

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity('cod_ide_teoria', label, {
        step: currentStepIndex + 1,
        total: STEPS.length,
        correctCount: correctCount
      });
    }
  }

  function renderStory() {
    updateProgressBar();
    const step = STEPS[stepOrder[currentStepIndex]];
    reportStep(`Codificação — IDE — Etapa ${currentStepIndex + 1}/${STEPS.length}`);

    storyWrap.innerHTML = '';

    const row = document.createElement('div');
    row.className = 'bia-row';
    row.innerHTML = `
      <div class="bia-avatar">🐞</div>
      <div class="speech-bubble">
        <span class="bia-name">Bia, a Joaninha Debugger</span>
        ${step.story}
      </div>
    `;
    storyWrap.appendChild(row);

    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.innerHTML = `<button class="btn" id="btnNext">Próximo →</button>`;
    storyWrap.appendChild(actions);

    document.getElementById('btnNext').addEventListener('click', renderQuestion);
  }

  function renderQuestion() {
    const step = STEPS[stepOrder[currentStepIndex]];
    const q = step.question;

    storyWrap.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2>❓ ${q.prompt}</h2>`;

    const optionsWrap = document.createElement('div');
    const letters = ['A', 'B', 'C', 'D'];
    let answered = false;

    const order = q.options.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    const correctPos = order.indexOf(q.correctIndex);

    order.forEach((origIdx, pos) => {
      const optText = q.options[origIdx];
      const opt = document.createElement('div');
      opt.className = 'option';
      opt.innerHTML = `<span class="opt-letter">${letters[pos]}</span><span>${optText}</span>`;
      opt.addEventListener('click', () => {
        if (answered) return;
        answered = true;
        selectAnswer(pos);
      });
      optionsWrap.appendChild(opt);

      function selectAnswer(chosenIdx) {
        const allOptionEls = optionsWrap.querySelectorAll('.option');
        allOptionEls.forEach(el => el.classList.add('disabled'));

        const isCorrect = chosenIdx === correctPos;
        allOptionEls[chosenIdx].classList.add(isCorrect ? 'correct' : 'incorrect');
        if (!isCorrect) {
          allOptionEls[correctPos].classList.add('correct');
        }
        if (isCorrect) correctCount++;

        const feedback = document.createElement('div');
        feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
        feedback.innerHTML = isCorrect
          ? `✅ Correto! ${q.explanation}`
          : `❌ Não foi dessa vez. A resposta certa é "<b>${q.options[q.correctIndex]}</b>": ${q.explanation.replace(/^(Isso mesmo!|Isso!|Correto!|Exato!|Perfeito!|Correta!)\s*/i, '')}`;
        card.appendChild(feedback);

        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.style.marginTop = '14px';
        actions.innerHTML = `<button class="btn" id="btnNextAfterAnswer">Próximo →</button>`;
        card.appendChild(actions);

        saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
        reportStep(`Codificação — IDE — Etapa ${currentStepIndex + 1}/${STEPS.length} (respondida)`);

        document.getElementById('btnNextAfterAnswer').addEventListener('click', () => {
          currentStepIndex++;
          if (currentStepIndex >= STEPS.length) {
            finishJourney();
          } else {
            saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
            renderStory();
          }
        });
      }
    });

    card.appendChild(optionsWrap);
    storyWrap.innerHTML = '';
    storyWrap.appendChild(card);
  }

  function finishJourney(reviewOnly) {
    const pct = STEPS.length > 0 ? Math.round((correctCount / STEPS.length) * 100) : 0;
    const passed = reviewOnly ? true : pct >= 80;
    if (!reviewOnly) {
      saveProgress({ lastStepIndex: STEPS.length, correctCount, completed: passed });
      reportStep(`Codificação — IDE — ${passed ? 'Concluída' : 'Não concluída'} (${correctCount}/${STEPS.length})`);
    }

    progressFill.style.width = '100%';
    lblStepNum.textContent = STEPS.length;

    storyWrap.innerHTML = passed ? `
      <div class="card finish-screen">
        <div class="trophy">🏆</div>
        <h2>Instalação e Configuração da IDE concluídas!</h2>
        <p>Você já reconhece o que é uma IDE, como instalá-la, configurar variáveis de ambiente e extensões, e como validar o ambiente com um teste "Hello World".</p>
        <div class="score">Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%).</div>
        <p>Agora é hora de colocar a mão na massa: volte à trilha e abra o módulo de prática da Central de Codificação.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn btn-secondary" id="btnRestart">🔁 Rever a teoria</button>
        </div>
      </div>
    ` : `
      <div class="card finish-screen">
        <div class="trophy">📚</div>
        <h2>Quase lá!</h2>
        <p>Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%) — é preciso pelo menos 80% de acerto para concluir esta atividade.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn" id="btnRestart">🔁 Tentar novamente</button>
        </div>
      </div>
    `;

    document.getElementById('btnRestart').addEventListener('click', () => {
      currentStepIndex = 0;
      correctCount = 0;
      stepOrder = shuffleOrder();
      localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
      saveProgress({ lastStepIndex: 0, correctCount: 0, completed: false });
      renderStory();
    });
  }

  if (saved && saved.completed) {
    currentStepIndex = STEPS.length;
    finishJourney(true);
  } else {
    renderStory();
  }
</script>

    <div class="vw-plugin-top-wrapper"></div>
  </div>
