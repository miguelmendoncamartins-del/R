<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Fases de Elaboração de um Projeto: Teoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d14; --panel:#10141f; --panel2:#0d101a; --line:#20283a;
    --blue:#5ec8ff; --blue-dim:#2f7aa8; --blood:#c1121f; --blood-bright:#ff3b30;
    --gold:#e0b84a; --ink:#dbe4f2; --ink-dim:#657388;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--blue-dim); background:#060810;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(94,200,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--blue); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .nia-row{ display:flex; align-items:flex-start; gap:12px; }
  .nia-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(94,200,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--blue-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .nia-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--blue);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble code{ color:var(--gold); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--gold); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--blue-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--blue); background:rgba(94,200,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--blue); color:var(--blue); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--blue); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--gold); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--blue); color:#04162a; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--blue); border:1px solid var(--blue-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--blue); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--gold); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--blue); border:1px solid var(--blue-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(94,200,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'projetos_fases_teoria';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/vendor/pptxgen.bundle.js"></script>
<script src="../../../shared/slides-generator.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>JOGOS — FASES DE UM PROJETO (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">6</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `projetos_fases_teoria_progress_${username}`;

  const STEPS = [
    {
      story: 'De volta! Eu sou a <b>Nia</b>, e agora vamos falar sobre o que exatamente é um <b>projeto</b>. Diferente de uma tarefa rotineira que se repete todo dia sem data pra acabar, um projeto tem <b>início, fim e objetivo bem definidos</b>, e conta com <b>recursos limitados</b> (tempo, gente, orçamento) — é isso que obriga a equipe a planejar em vez de só "ir fazendo".',
      question: {
        prompt: 'Qual das opções abaixo caracteriza um "projeto", diferenciando-o de uma tarefa rotineira contínua?',
        options: [
          'Tem início, fim e objetivo bem definidos, com recursos limitados',
          'Se repete todos os dias, sem nunca ter um prazo pra acabar',
          'Não precisa ter nenhum objetivo específico',
          'Pode consumir recursos infinitos, sem limite de tempo ou orçamento'
        ],
        correctIndex: 0,
        explanation: 'Isso! Início, fim, objetivo e recursos limitados são justamente o que separa um projeto de uma atividade rotineira contínua.'
      }
    },
    {
      story: 'Todo projeto nasce na fase de <b>concepção (ideação)</b>: antes de programar qualquer coisa, a equipe se dedica a formular <b>hipóteses e perguntas</b> de partida — "que problema esse jogo resolve?", "pra qual jogador?". É aqui que a ideia começa a ganhar forma.',
      question: {
        prompt: 'Antes de escrever qualquer linha de código, uma equipe se reúne só para perguntar "que problema esse jogo resolve, e para qual tipo de jogador?". Em qual fase do projeto isso normalmente acontece?',
        options: [
          'Concepção (ideação)',
          'Execução',
          'Registro de patente',
          'Apresentação final (pitch)'
        ],
        correctIndex: 0,
        explanation: 'Exato! Formular as perguntas e hipóteses de partida é o coração da fase de concepção/ideação, bem no início do projeto.'
      }
    },
    {
      story: 'Ainda na concepção, entra a <b>pesquisa de anterioridade</b>: checar se uma ideia parecida já existe no mercado, evitando reinventar (ou copiar sem saber) algo que já foi feito. Quando a ideia é realmente original e vale proteger, aí entram os <b>registros e patentes</b>.',
      question: {
        prompt: 'Antes de investir meses de trabalho no projeto, a equipe pesquisa se já existe algum jogo com a mesma mecânica central no mercado. Por que essa pesquisa de anterioridade é importante?',
        options: [
          'Para não duplicar algo que já existe e evitar problemas de originalidade/direitos autorais',
          'Porque é obrigatório por lei parar de programar até a pesquisa terminar',
          'Porque a pesquisa de anterioridade define o preço de venda do jogo',
          'Ela não tem nenhuma utilidade prática real'
        ],
        correctIndex: 0,
        explanation: 'Isso! A pesquisa de anterioridade evita retrabalho e problemas futuros de originalidade — melhor descobrir isso no início do que depois de meses de produção.'
      }
    },
    {
      story: 'Com a ideia validada, vem a <b>fundamentação e planejamento</b>: a equipe avalia a <b>viabilidade técnica e financeira</b> — será que dá pra construir esse jogo com a equipe, o prazo e o orçamento disponíveis? Ideia boa sem viabilidade real não sai do papel.',
      question: {
        prompt: 'A equipe tem uma ideia de jogo muito criativa, mas antes de seguir em frente avalia se dá pra construí-la com a equipe, o prazo e o orçamento disponíveis. Como se chama essa análise?',
        options: [
          'Análise de viabilidade técnica e financeira',
          'Pitch do projeto',
          'Documentação final do projeto',
          'Registro de patente'
        ],
        correctIndex: 0,
        explanation: 'Correto! Avaliar se o projeto é tecnicamente e financeiramente viável evita começar a construir algo que a equipe não vai conseguir entregar.'
      }
    },
    {
      story: 'Aprovado o planejamento, começa a <b>execução</b>: monta-se a <b>infraestrutura</b> de trabalho (repositório de código, ferramentas, divisão de tarefas) e a equipe produz o jogo de fato, acompanhando os <b>resultados</b> entregues ao longo do caminho.',
      question: {
        prompt: 'Depois do planejamento aprovado, o time monta o ambiente de trabalho (repositório, ferramentas, divisão de tarefas) e começa a produzir o jogo, medindo o que já foi entregue. Qual fase é essa?',
        options: [
          'Execução, com infraestrutura montada e acompanhamento de resultados',
          'Concepção (ideação)',
          'Pesquisa de anterioridade',
          'Registro de patente'
        ],
        correctIndex: 0,
        explanation: 'Isso! Montar a infraestrutura de trabalho e produzir de fato, acompanhando os resultados, é a marca da fase de execução.'
      }
    },
    {
      story: 'Por fim, um projeto bem conduzido depende de <b>argumentação e colaboração</b> — defender escolhas técnicas com dados, não só opinião — e de <b>comunicação e documentação</b>: registrar decisões por escrito, pra qualquer pessoa que entrar depois no projeto entender o porquê de cada escolha. Agora você já conhece o caminho completo de um projeto, da ideia à entrega!',
      question: {
        prompt: 'Durante uma reunião, duas devs defendem abordagens técnicas diferentes usando dados e testes pra sustentar cada ponto de vista — e a decisão final é registrada num documento para quem entrar depois no projeto. Que dois processos-chave estão em jogo aqui?',
        options: [
          'Argumentação colaborativa e documentação (comunicação/registro das decisões)',
          'Sorte e adivinhação',
          'Votação sem nenhum dado envolvido',
          'Ausência total de qualquer registro'
        ],
        correctIndex: 0,
        explanation: 'Exato! Defender ideias com dados (argumentação colaborativa) e registrar as decisões (documentação) garantem que o projeto siga rastreável e bem fundamentado.'
      }
    },
    {
      story: 'Retomando a definição: todo projeto tem uma característica extra além de início/fim e recursos limitados — ele é <b>temporário e único</b>. Mesmo que o estúdio já tenha lançado vários jogos antes, cada novo projeto tem um resultado diferente dos anteriores, por mais parecido que pareça.',
      question: {
        prompt: 'A PixelForge já lançou 5 jogos de plataforma antes, mas cada um teve mecânicas, arte e história diferentes — nenhum foi repetição do anterior. Que característica de projeto isso demonstra?',
        options: [
          'Um projeto é único — mesmo repetindo o tipo de jogo, o resultado de cada projeto é diferente',
          'Projetos são sempre idênticos entre si',
          'Só o primeiro projeto de um estúdio conta como projeto de verdade',
          'Projetos nunca têm nada em comum entre si'
        ],
        correctIndex: 0,
        explanation: 'Isso! Unicidade é uma característica central de projeto: cada um produz um resultado próprio, mesmo que o "tipo" geral se repita.'
      }
    },
    {
      story: 'Voltando à <b>pesquisa de anterioridade</b> com mais profundidade: ela não serve só pra evitar copiar por acidente — também protege a equipe de investir tempo numa ideia que já está registrada por outra empresa, o que poderia gerar problemas legais depois do lançamento.',
      question: {
        prompt: 'Depois de pesquisar, a equipe descobre que uma mecânica muito parecida com a que planejavam já está patenteada por outro estúdio. O que essa descoberta evita?',
        options: [
          'Evita investir meses de trabalho numa mecânica que poderia gerar problema legal depois do lançamento',
          'Não evita nada, patentes de outras empresas não afetam projetos próprios',
          'Obriga o estúdio a fechar imediatamente',
          'Só afeta o orçamento de marketing do jogo'
        ],
        correctIndex: 0,
        explanation: 'Exato! Descobrir uma patente conflitante cedo, na pesquisa de anterioridade, evita meses de trabalho que poderiam esbarrar num problema legal sério mais tarde.'
      }
    },
    {
      story: 'Do outro lado da moeda: quando a equipe cria algo realmente original — um mecanismo de jogo novo, uma tecnologia própria —, vale considerar <b>registrar ou patentear</b> essa criação, protegendo o trabalho de ser copiado por outros depois do lançamento.',
      question: {
        prompt: 'A equipe cria um sistema de física totalmente original para o jogo, nunca visto em outro título. O que fazer com essa criação, além de usá-la no jogo?',
        options: [
          'Avaliar registrar/patentear a criação original, protegendo-a de cópia',
          'Publicar o código-fonte completo sem nenhuma proteção, por padrão',
          'Ignorar completamente, registros não servem pra nada em jogos',
          'Vender a ideia pra outro estúdio antes de lançar o próprio jogo'
        ],
        correctIndex: 0,
        explanation: 'Isso! Criações realmente originais valem proteção por registro/patente — cuidando pra que o esforço da equipe não seja simplesmente copiado por terceiros.'
      }
    },
    {
      story: 'Por fim, um projeto bem conduzido nunca para de se perguntar: mesmo depois da concepção inicial, a equipe segue <b>formulando hipóteses e perguntas</b> em cada etapa — "será que os jogadores vão entender esse controle sem tutorial?" — testando-as antes de assumir que estão certas. Agora você conhece o caminho completo, do "isso é mesmo um projeto?" até a entrega final!',
      question: {
        prompt: 'No meio da produção, a equipe se pergunta "será que os jogadores vão entender esse controle sem nenhum tutorial?" e decide testar essa dúvida com um grupo pequeno antes de decidir. Que prática do desenvolvimento de projeto é essa?',
        options: [
          'Formulação de hipóteses e perguntas, testadas antes de assumir que estão certas',
          'Registro de patente',
          'Pesquisa de anterioridade',
          'Encerramento definitivo do projeto'
        ],
        correctIndex: 0,
        explanation: 'Correto! Levantar perguntas/hipóteses e testá-las ao longo do projeto — não só no início — é o que mantém as decisões fundamentadas em vez de suposições soltas.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Jogos — Fases de Elaboração de um Projeto',
      subtitle: 'Aula Teórica · Trilha Fases de Elaboração de um Projeto · Turma Jogos Digitais',
      capacidade: 'Reconhecer as diferentes fases pertinentes à elaboração de um projeto.',
      steps: STEPS,
      fileName: 'projetos-fases-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Prática — Central de Projetos: Fases de um Projeto" no Portal de Aulas para os alunos resolverem os pareceres de verdade.'
    });
  };

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Jogos — Fases de Elaboração de um Projeto',
      subtitle: 'Aula Teórica · Trilha Fases de Elaboração de um Projeto · Turma Jogos Digitais',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'projetos-fases-teoria-gabarito.txt'
    });
  };

  const role = urlParams.get('role') || 'aluno';
  const btnGenSlides = document.getElementById('btnGenSlides');
  if (role === 'professor') {
    btnGenSlides.style.display = 'inline-block';
    btnGenSlides.addEventListener('click', () => {
      btnGenSlides.disabled = true;
      btnGenSlides.textContent = '⏳ Gerando...';
      setTimeout(() => {
        window.generateSlidesForGestao();
        btnGenSlides.disabled = false;
        btnGenSlides.textContent = '🖨️ Gerar Slides (PPTX)';
      }, 50);
    });
  }

  const storyWrap = document.getElementById('storyWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const lblStepTotal = document.getElementById('lblStepTotal');
  const progressFill = document.getElementById('progressFill');

  lblStepTotal.textContent = STEPS.length;

  function loadProgress() {
    try {
      return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
    } catch (e) {
      return null;
    }
  }

  function saveProgress(data) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(data));
  }

  const ORDER_KEY = PROGRESS_KEY.replace('_progress_', '_order_');

  function shuffleOrder() {
    const arr = STEPS.map((_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function loadOrder() {
    try {
      const parsed = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
      if (Array.isArray(parsed) && parsed.length === STEPS.length && parsed.every(n => Number.isInteger(n) && n >= 0 && n < STEPS.length)) {
        return parsed;
      }
    } catch (e) {}
    return null;
  }

  const saved = loadProgress();
  let stepOrder = (saved && !saved.completed) ? (loadOrder() || shuffleOrder()) : shuffleOrder();
  localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
  let currentStepIndex = (saved && !saved.completed) ? Math.min(saved.lastStepIndex || 0, STEPS.length - 1) : 0;
  let correctCount = (saved && typeof saved.correctCount === 'number') ? saved.correctCount : 0;

  function updateProgressBar() {
    const pct = Math.round(((currentStepIndex) / STEPS.length) * 100);
    progressFill.style.width = pct + '%';
    lblStepNum.textContent = Math.min(currentStepIndex + 1, STEPS.length);
  }

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity('projetos_fases_teoria', label, {
        step: currentStepIndex + 1,
        total: STEPS.length,
        correctCount: correctCount
      });
    }
  }

  function renderStory() {
    updateProgressBar();
    const step = STEPS[stepOrder[currentStepIndex]];
    reportStep(`Jogos — Fases de um Projeto — Etapa ${currentStepIndex + 1}/${STEPS.length}`);

    storyWrap.innerHTML = '';

    const row = document.createElement('div');
    row.className = 'nia-row';
    row.innerHTML = `
      <div class="nia-avatar">🧭</div>
      <div class="speech-bubble">
        <span class="nia-name">Nia, a Bússola de Projetos</span>
        ${step.story}
      </div>
    `;
    storyWrap.appendChild(row);

    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.innerHTML = `<button class="btn" id="btnNext">Próximo →</button>`;
    storyWrap.appendChild(actions);

    document.getElementById('btnNext').addEventListener('click', renderQuestion);
  }

  function renderQuestion() {
    const step = STEPS[stepOrder[currentStepIndex]];
    const q = step.question;

    storyWrap.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2>❓ ${q.prompt}</h2>`;

    const optionsWrap = document.createElement('div');
    const letters = ['A', 'B', 'C', 'D'];
    let answered = false;

    const order = q.options.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    const correctPos = order.indexOf(q.correctIndex);

    order.forEach((origIdx, pos) => {
      const optText = q.options[origIdx];
      const opt = document.createElement('div');
      opt.className = 'option';
      opt.innerHTML = `<span class="opt-letter">${letters[pos]}</span><span>${optText}</span>`;
      opt.addEventListener('click', () => {
        if (answered) return;
        answered = true;
        selectAnswer(pos);
      });
      optionsWrap.appendChild(opt);

      function selectAnswer(chosenIdx) {
        const allOptionEls = optionsWrap.querySelectorAll('.option');
        allOptionEls.forEach(el => el.classList.add('disabled'));

        const isCorrect = chosenIdx === correctPos;
        allOptionEls[chosenIdx].classList.add(isCorrect ? 'correct' : 'incorrect');
        if (!isCorrect) {
          allOptionEls[correctPos].classList.add('correct');
        }
        if (isCorrect) correctCount++;

        const feedback = document.createElement('div');
        feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
        feedback.innerHTML = isCorrect
          ? `✅ Correto! ${q.explanation}`
          : `❌ Não foi dessa vez. A resposta certa é "<b>${q.options[q.correctIndex]}</b>": ${q.explanation.replace(/^(Isso mesmo!|Isso!|Correto!|Exato!|Perfeito!|Correta!)\s*/i, '')}`;
        card.appendChild(feedback);

        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.style.marginTop = '14px';
        actions.innerHTML = `<button class="btn" id="btnNextAfterAnswer">Próximo →</button>`;
        card.appendChild(actions);

        saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
        reportStep(`Jogos — Fases de um Projeto — Etapa ${currentStepIndex + 1}/${STEPS.length} (respondida)`);

        document.getElementById('btnNextAfterAnswer').addEventListener('click', () => {
          currentStepIndex++;
          if (currentStepIndex >= STEPS.length) {
            finishJourney();
          } else {
            saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
            renderStory();
          }
        });
      }
    });

    card.appendChild(optionsWrap);
    storyWrap.innerHTML = '';
    storyWrap.appendChild(card);
  }

  function finishJourney(reviewOnly) {
    const pct = STEPS.length > 0 ? Math.round((correctCount / STEPS.length) * 100) : 0;
    const passed = reviewOnly ? true : pct >= 80;
    if (!reviewOnly) {
      saveProgress({ lastStepIndex: STEPS.length, correctCount, completed: passed });
      reportStep(`Jogos — Fases de um Projeto — ${passed ? 'Concluída' : 'Não concluída'} (${correctCount}/${STEPS.length})`);
    }

    progressFill.style.width = '100%';
    lblStepNum.textContent = STEPS.length;

    storyWrap.innerHTML = passed ? `
      <div class="card finish-screen">
        <div class="trophy">🏆</div>
        <h2>Fases de um Projeto concluídas!</h2>
        <p>Você já reconhece o caminho completo de um projeto: definição, concepção, pesquisa de anterioridade, viabilidade, execução e a dupla argumentação + documentação.</p>
        <div class="score">Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%).</div>
        <p>Agora é hora de colocar a mão na massa: volte à trilha e abra o módulo de prática da Central de Projetos.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn btn-secondary" id="btnRestart">🔁 Rever a teoria</button>
        </div>
      </div>
    ` : `
      <div class="card finish-screen">
        <div class="trophy">📚</div>
        <h2>Quase lá!</h2>
        <p>Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%) — é preciso pelo menos 80% de acerto para concluir esta atividade.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn" id="btnRestart">🔁 Tentar novamente</button>
        </div>
      </div>
    `;

    document.getElementById('btnRestart').addEventListener('click', () => {
      currentStepIndex = 0;
      correctCount = 0;
      stepOrder = shuffleOrder();
      localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
      saveProgress({ lastStepIndex: 0, correctCount: 0, completed: false });
      renderStory();
    });
  }

  if (saved && saved.completed) {
    currentStepIndex = STEPS.length;
    finishJourney(true);
  } else {
    renderStory();
  }
</script>
