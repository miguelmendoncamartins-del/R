<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Jogos: Central de Suporte a Devs (Lógica) — Código</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d0a; --panel:#10140f; --panel2:#0d110c; --line:#223022;
    --green:#7cff3f; --green-dim:#4a9a2a; --blood:#c1121f; --blood-bright:#ff3b30;
    --yellow:#d4c86a; --ink:#d9e6d2; --ink-dim:#6f8368;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--green-dim); background:#050805;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(124,255,63,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .stage{ flex:1; min-height:0; padding:12px; overflow:hidden; display:flex; }
  .layout{ display:flex; flex-direction:row; flex-wrap:nowrap; gap:14px; width:100%; height:100%; }

  .sidebar{
    width:200px; flex-shrink:0; height:100%; overflow-y:auto;
    background:var(--panel); border:1px solid var(--line); padding:8px;
  }
  .sidebar-title{ font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; padding:0 2px; }
  .challenge-item{
    display:flex; align-items:center; gap:8px; padding:8px 8px; margin-bottom:4px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:11px;
  }
  .challenge-item .status{ font-size:13px; width:16px; text-align:center; flex-shrink:0; }
  .challenge-item.active{ border-color:var(--green); color:var(--green); }
  .challenge-item.completed{ color:var(--ink); }
  .challenge-item.locked{ opacity:0.4; cursor:not-allowed; }
  .challenge-item .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .main-panel{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; height:100%; overflow-y:auto; }

  .challenge-header{ flex-shrink:0; background:var(--panel); border:1px solid var(--line); padding:10px 14px; }

  .ticket-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .ticket-icon{ font-size:26px; line-height:1; }
  .ticket-status{ font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; padding:3px 8px; border-radius:2px; }
  .ticket-status.pending{ background:rgba(255,59,48,0.15); color:var(--blood-bright); }
  .ticket-status.done{ background:rgba(124,255,63,0.15); color:var(--green); }

  .challenge-header h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:19px; color:var(--green); margin:0 0 8px; letter-spacing:1px; }
  .challenge-header p{ font-size:12px; color:var(--ink-dim); margin:8px 0 0; line-height:1.5; }
  .challenge-header code{ color:var(--yellow); }

  .explanation-box{
    background:#050805; border:1px solid var(--green-dim); padding:10px 12px;
    font-size:11.5px; color:var(--ink); line-height:1.6;
  }
  .explanation-box .exp-title{
    color:var(--green); font-weight:800; text-transform:uppercase; font-size:10px; letter-spacing:1px; margin-bottom:6px;
  }
  .explanation-box code{ color:var(--yellow); }
  .explanation-box pre{
    background:#000; border:1px solid var(--line); padding:8px; margin:6px 0 0;
    overflow-x:auto; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--yellow); white-space:pre;
  }

  .hint-toggle{
    display:inline-block; margin-top:8px; font-size:10.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--yellow); border:1px solid var(--green-dim); padding:5px 10px; cursor:pointer; border-radius:2px;
  }
  .hint-toggle:hover{ background:rgba(212,200,106,0.1); }
  .hint-box{
    display:none; margin-top:8px; background:var(--panel2); border:1px dashed var(--yellow);
    padding:8px 10px; font-size:11.5px; color:var(--ink); line-height:1.5;
  }
  .hint-box.show{ display:block; }
  .hint-box b{ color:var(--yellow); }

  textarea#codeInput{
    width:100%; flex:1; min-height:60px; resize:vertical; background:#000; color:var(--green);
    border:1px solid var(--line); font-family:'JetBrains Mono', monospace; font-size:12px;
    padding:10px; outline:none; line-height:1.5;
  }
  textarea#codeInput:focus{ border-color:var(--green); }

  .actions{ display:flex; gap:8px; align-items:center; flex-shrink:0; flex-wrap:wrap; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11px; letter-spacing:1px; text-transform:uppercase;
    background:var(--green); color:#04220a; border:none; padding:9px 16px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.5; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--green); border:1px solid var(--green-dim); }

  .console{
    background:#060806; border:1px solid var(--line); padding:8px 10px; font-size:11px;
    flex:1; min-height:50px; overflow-y:auto; line-height:1.6;
  }
  .console .line.info{ color:var(--ink-dim); }
  .console .line.pass{ color:var(--green); }
  .console .line.fail{ color:var(--blood-bright); }
  .console .line.success{ color:var(--green); font-weight:bold; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:8px; }
    .layout{ flex-direction:column; height:auto; }
    .sidebar{ width:100%; height:auto; max-height:150px; }
    .main-panel{ height:auto; overflow-y:visible; }
    textarea#codeInput{ min-height:110px; }
    .console{ flex:none; max-height:160px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'fund_logica_pratica';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>JOGOS — CENTRAL DE SUPORTE (LÓGICA E ALGORITMOS)</div>
    <div>RESOLVIDOS: <span id="lblProgress">0/0</span></div>
  </div>

  <div class="stage">
    <div class="layout">
      <div class="sidebar">
        <div class="sidebar-title">Chamados</div>
        <div id="challengeList"></div>
      </div>

      <div class="main-panel">
        <div class="challenge-header">
          <div class="ticket-row">
            <div class="ticket-icon" id="ticketIcon">🎫</div>
            <div class="ticket-status pending" id="ticketStatus">PENDENTE</div>
          </div>
          <h2 id="challengeTitle">--</h2>

          <div class="explanation-box">
            <div class="exp-title">📖 Como funciona</div>
            <div id="explanationText"></div>
          </div>

          <p id="challengeDesc"></p>

          <button class="hint-toggle" id="btnHint">💡 Ver dica</button>
          <div class="hint-box" id="hintBox"></div>
        </div>

        <textarea id="codeInput" spellcheck="false"></textarea>

        <div class="actions">
          <button class="btn" id="btnRun">▶ Executar</button>
          <button class="btn btn-secondary" id="btnNext" style="display:none;">Próximo chamado →</button>
        </div>

        <div class="console" id="consoleOutput"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `fund_logica_pratica_progress_${username}`;

  const CHALLENGES = [
    {
      id: 1,
      title: 'O ciclo que nunca para',
      icon: '🔁',
      fnName: 'atualizarPosicao',
      explanation: 'O game loop atualiza a posição de cada objeto a cada frame, somando a velocidade atual à posição. Se um saldo bancário aumenta com um depósito, o novo saldo é <code>saldo + deposito</code> — o mesmo raciocínio se aplica a posição e velocidade.',
      desc: 'Chamado: "preciso de uma função que receba a posição atual de um objeto e sua velocidade, e devolva a posição dele no próximo frame do game loop." Implemente <code>atualizarPosicao(pos, velocidade)</code>.',
      hint: 'Pense em como a velocidade se soma (ou subtrai, se for negativa) à posição a cada novo frame.',
      starter: 'function atualizarPosicao(pos, velocidade) {\n  // devolva a posição do objeto no próximo frame\n\n}',
      tests: [
        { args: [0, 5], expected: 5 },
        { args: [10, -3], expected: 7 },
        { args: [100, 0], expected: 100 }
      ]
    },
    {
      id: 2,
      title: 'Para onde é "baixo"?',
      icon: '📐',
      fnName: 'moverNoEixoY',
      explanation: 'Na maioria dos motores 2D, a origem fica no canto superior esquerdo e o eixo Y cresce para BAIXO — o oposto do gráfico da escola. Uma função que decide entre dois resultados conforme uma condição booleana costuma usar <code>if/else</code> ou o operador ternário: <pre>condicao ? valorSeVerdadeiro : valorSeFalso</pre>',
      desc: 'Chamado: "preciso mover um objeto uma casa no eixo Y — se <code>paraBaixo</code> for true, ele desce; se for false, ele sobe." Implemente <code>moverNoEixoY(y, paraBaixo)</code>, devolvendo o novo valor de Y.',
      hint: 'Lembre pra qual lado o eixo Y cresce nos motores de jogo 2D — não é como no gráfico da escola.',
      starter: 'function moverNoEixoY(y, paraBaixo) {\n  // se paraBaixo for true, desça (mude Y na direção certa)\n  // se for false, suba\n\n}',
      tests: [
        { args: [5, true], expected: 6 },
        { args: [5, false], expected: 4 },
        { args: [0, true], expected: 1 }
      ]
    },
    {
      id: 3,
      title: 'Vira pra direita, anda pra esquerda',
      icon: '↔️',
      fnName: 'moverNoEixoX',
      explanation: 'Diferente do Y, o eixo X segue o sentido "natural": aumentar move pra direita, diminuir move pra esquerda, e isso não se inverte entre engines.',
      desc: 'Chamado: "preciso mover um objeto uma casa no eixo X — se <code>paraDireita</code> for true, ele vai pra direita; se for false, pra esquerda." Implemente <code>moverNoEixoX(x, paraDireita)</code>.',
      hint: 'Pense em qual direção o valor de X precisa ir pra mover algo pra direita ou pra esquerda na tela.',
      starter: 'function moverNoEixoX(x, paraDireita) {\n  // se paraDireita for true, vá pra direita\n  // se for false, vá pra esquerda\n\n}',
      tests: [
        { args: [5, true], expected: 6 },
        { args: [5, false], expected: 4 },
        { args: [10, false], expected: 9 }
      ]
    },
    {
      id: 4,
      title: 'Organize o cenário',
      icon: '🗺️',
      fnName: 'tileNaMatriz',
      explanation: 'Guardar o cenário como uma matriz de tiles (uma grade de linhas e colunas) permite consultar qualquer posição só acessando aquela linha e coluna do array. Em JS, um array de arrays se acessa em duas etapas: primeiro a linha, depois a coluna dentro dela.<pre>const grade = [[10, 20], [30, 40]];\ngrade[0][1]; // 20 — linha 0, coluna 1</pre>',
      desc: 'Chamado: "preciso de uma função que devolva o tile que está numa determinada linha/coluna da matriz do cenário." Implemente <code>tileNaMatriz(matriz, linha, coluna)</code>.',
      hint: 'Acesse primeiro a linha da matriz, e dentro dela, a coluna.',
      starter: 'function tileNaMatriz(matriz, linha, coluna) {\n  // devolva o valor guardado na matriz nessa linha/coluna\n\n}',
      tests: [
        { args: [[[1, 2], [3, 4]], 0, 1], expected: 2 },
        { args: [[[1, 2], [3, 4]], 1, 0], expected: 3 },
        { args: [[[5]], 0, 0], expected: 5 }
      ]
    },
    {
      id: 5,
      title: 'Sprite sumindo aos poucos',
      icon: '🎨',
      fnName: 'aplicarAlpha',
      explanation: 'O sistema RGBA guarda um quarto canal, o alpha, controlando a transparência. Uma função pode devolver uma cópia de um objeto com um campo novo usando o operador spread: <pre>const atualizado = { ...original, novoCampo: valor };</pre>',
      desc: 'Chamado: "preciso de uma função que receba uma cor <code>{r, g, b}</code> e um valor de transparência, e devolva a cor com o canal alpha aplicado." Implemente <code>aplicarAlpha(cor, alpha)</code>, devolvendo um novo objeto com <code>r</code>, <code>g</code>, <code>b</code> iguais aos da cor recebida, e <code>a</code> igual ao alpha recebido.',
      hint: 'Copie os campos <code>r</code>, <code>g</code>, <code>b</code> da cor recebida e acrescente um campo <code>a</code> com o valor do alpha.',
      starter: 'function aplicarAlpha(cor, alpha) {\n  // cor é um objeto { r, g, b }\n  // devolva um novo objeto com r, g, b da cor recebida, e a com o alpha\n\n}',
      tests: [
        { args: [{ r: 255, g: 0, b: 0 }, 0.5], check: (r) => r && r.r === 255 && r.g === 0 && r.b === 0 && r.a === 0.5, expectedLabel: '{ r: 255, g: 0, b: 0, a: 0.5 }' },
        { args: [{ r: 10, g: 20, b: 30 }, 0], check: (r) => r && r.r === 10 && r.g === 20 && r.b === 30 && r.a === 0, expectedLabel: '{ r: 10, g: 20, b: 30, a: 0 }' },
        { args: [{ r: 1, g: 2, b: 3 }, 1], check: (r) => r && r.a === 1, expectedLabel: 'objeto com a: 1' }
      ]
    },
    {
      id: 6,
      title: 'Por que ele não cai?',
      icon: '🪂',
      fnName: 'aplicarGravidade',
      explanation: 'Gravidade é uma aceleração constante somada à velocidade vertical a cada frame — é isso que faz um personagem, depois de pular, comece a acelerar de volta pra baixo.',
      desc: 'Chamado: "preciso de uma função que, a cada frame, some a gravidade à velocidade vertical atual de um personagem." Implemente <code>aplicarGravidade(velocidadeY, gravidade)</code>.',
      hint: 'A gravidade se soma à velocidade vertical a cada frame — pense em como somar dois valores.',
      starter: 'function aplicarGravidade(velocidadeY, gravidade) {\n  // devolva a nova velocidade vertical após somar a gravidade\n\n}',
      tests: [
        { args: [0, 0.5], expected: 0.5 },
        { args: [2, 0.5], expected: 2.5 },
        { args: [-1, 1], expected: 0 }
      ]
    },
    {
      id: 7,
      title: 'Rápido demais no PC do chefe',
      icon: '⏱️',
      fnName: 'escalarPorDeltaTime',
      explanation: 'Delta time é o tempo real (em segundos) que passou desde o último frame. Escalar uma velocidade "por segundo" pelo delta time converte ela pro tanto que deve se mover NESSE frame específico, independente do FPS da máquina.',
      desc: 'Chamado: "o personagem anda rápido demais em PCs potentes e devagar em PCs fracos — preciso de uma função que escale a velocidade pelo delta time do frame atual." Implemente <code>escalarPorDeltaTime(velocidade, deltaTime)</code>.',
      hint: 'Pense em qual operação matemática "escala" um valor por uma fração de tempo.',
      starter: 'function escalarPorDeltaTime(velocidade, deltaTime) {\n  // devolva o quanto o objeto deve se mover NESTE frame\n\n}',
      tests: [
        { args: [100, 0.5], expected: 50 },
        { args: [200, 1], expected: 200 },
        { args: [60, 0.25], expected: 15 }
      ]
    },
    {
      id: 8,
      title: 'Personagens se atravessando',
      icon: '🚧',
      fnName: 'colideAABB',
      explanation: 'A colisão AABB compara as bordas de dois retângulos: eles se sobrepõem se, em AMBOS os eixos (X e Y), a faixa de um cruza a faixa do outro. Se em qualquer um dos dois eixos eles não se cruzam, não há colisão.',
      desc: 'Chamado: "preciso de uma função que receba dois retângulos <code>{x, y, w, h}</code> (posição e tamanho) e diga se eles estão colidindo." Implemente <code>colideAABB(a, b)</code>, devolvendo <code>true</code> se os retângulos se sobrepõem, <code>false</code> caso contrário.',
      hint: 'Um retângulo vai de <code>x</code> até <code>x + w</code>, e de <code>y</code> até <code>y + h</code>. Compare essas faixas nos dois eixos.',
      starter: 'function colideAABB(a, b) {\n  // a e b são objetos { x, y, w, h }\n  // devolva true se os dois retângulos se sobrepõem, false caso contrário\n\n}',
      tests: [
        { args: [{ x: 0, y: 0, w: 10, h: 10 }, { x: 5, y: 5, w: 10, h: 10 }], expected: true },
        { args: [{ x: 0, y: 0, w: 10, h: 10 }, { x: 20, y: 20, w: 10, h: 10 }], expected: false },
        { args: [{ x: 0, y: 0, w: 10, h: 10 }, { x: 10, y: 0, w: 10, h: 10 }], expected: false }
      ]
    },
    {
      id: 9,
      title: 'Encomenda: sprite amarelo',
      icon: '🟡',
      fnName: 'ehAmarelo',
      explanation: 'O amarelo nasce da mistura de Vermelho e Verde altos, com Azul baixo. Uma função pode checar várias condições ao mesmo tempo com o operador <code>&&</code>: <pre>valorA >= limite && valorB <= outroLimite</pre>',
      desc: 'Chamado: "preciso validar se uma cor <code>{r, g, b}</code> é (aproximadamente) amarela, pra um filtro de assets." Implemente <code>ehAmarelo(cor)</code>, devolvendo <code>true</code> se <code>r</code> e <code>g</code> forem pelo menos 200, e <code>b</code> for no máximo 50.',
      hint: 'As três condições (r, g e b) precisam valer AO MESMO TEMPO pra cor ser considerada amarela — que jeito você tem de exigir isso numa expressão só?',
      starter: 'function ehAmarelo(cor) {\n  // cor é um objeto { r, g, b }\n  // devolva true se for uma cor amarela (R e G altos, B baixo)\n\n}',
      tests: [
        { args: [{ r: 255, g: 255, b: 0 }], expected: true },
        { args: [{ r: 255, g: 0, b: 0 }], expected: false },
        { args: [{ r: 200, g: 200, b: 50 }], expected: true },
        { args: [{ r: 0, g: 0, b: 255 }], expected: false }
      ]
    },
    {
      id: 10,
      title: 'Personagem fora de controle',
      icon: '💨',
      fnName: 'limitarVelocidade',
      explanation: 'Sem um teto, uma velocidade que só aumenta acelera pra sempre. Limitar (clamp) um valor significa "prendê-lo" dentro de uma faixa mínima e máxima — em JS, <code>Math.min</code> e <code>Math.max</code> combinados fazem esse tipo de coisa.',
      desc: 'Chamado: "o personagem acelera sem limite até sair da tela — preciso de uma função que limite a velocidade dele entre <code>-maxVelocidade</code> e <code>+maxVelocidade</code>." Implemente <code>limitarVelocidade(velocidade, maxVelocidade)</code>.',
      hint: 'Pense em como usar <code>Math.min</code> e <code>Math.max</code> juntos pra "prender" um valor dentro de uma faixa.',
      starter: 'function limitarVelocidade(velocidade, maxVelocidade) {\n  // devolva velocidade "presa" entre -maxVelocidade e +maxVelocidade\n\n}',
      tests: [
        { args: [15, 10], expected: 10 },
        { args: [-15, 10], expected: -10 },
        { args: [5, 10], expected: 5 }
      ]
    }
  ];

  // Exposto sempre (não só quando o botão local aparece) pra a aba "Gestão"
  // do portal da turma conseguir chamar isso remotamente, num iframe oculto,
  // e baixar um .txt com enunciado + critério de avaliação (testes) de cada
  // chamado — aqui não existe UMA alternativa certa, e sim um valor esperado
  // por combinação de argumentos, então o gabarito lista os casos de teste.
  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Jogos: Central de Suporte a Devs — Lógica e Algoritmos',
      subtitle: 'Prática (código) · Turma Jogos Digitais',
      items: CHALLENGES.map((c, i) => ({
        number: i + 1,
        title: c.title,
        prompt: c.desc,
        answer: c.tests.map(t => {
          const inputs = (t.args || []).map(a => JSON.stringify(a)).join(', ');
          const exp = ('expected' in t) ? JSON.stringify(t.expected) : (t.expectedLabel || 'ver critério no código-fonte');
          return `${c.fnName}(${inputs}) deve retornar ${exp}`;
        }).join('\n')
      })),
      fileName: 'fund-logica-pratica-gabarito.txt'
    });
  };

  const challengeListEl = document.getElementById('challengeList');
  const challengeTitleEl = document.getElementById('challengeTitle');
  const challengeDescEl = document.getElementById('challengeDesc');
  const explanationTextEl = document.getElementById('explanationText');
  const ticketIconEl = document.getElementById('ticketIcon');
  const ticketStatusEl = document.getElementById('ticketStatus');
  const codeInput = document.getElementById('codeInput');
  const btnRun = document.getElementById('btnRun');
  const btnNext = document.getElementById('btnNext');
  const btnHint = document.getElementById('btnHint');
  const hintBox = document.getElementById('hintBox');
  const consoleOutput = document.getElementById('consoleOutput');
  const lblProgress = document.getElementById('lblProgress');

  function getCompleted() {
    try {
      return new Set(JSON.parse(localStorage.getItem(PROGRESS_KEY) || '[]'));
    } catch (e) {
      return new Set();
    }
  }
  function saveCompleted(set) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify([...set]));
  }

  let completed = getCompleted();
  let selectedId = CHALLENGES.find(c => !completed.has(c.id))?.id || CHALLENGES[0].id;

  function isUnlocked(challenge) {
    const idx = CHALLENGES.findIndex(c => c.id === challenge.id);
    if (idx === 0) return true;
    return completed.has(CHALLENGES[idx - 1].id);
  }

  function renderSidebar() {
    challengeListEl.innerHTML = '';
    CHALLENGES.forEach(c => {
      const unlocked = isUnlocked(c);
      const isDone = completed.has(c.id);
      const item = document.createElement('div');
      item.className = 'challenge-item' + (c.id === selectedId ? ' active' : '') + (isDone ? ' completed' : '') + (!unlocked ? ' locked' : '');
      const statusIcon = isDone ? '✅' : (unlocked ? '🎫' : '🔒');
      item.innerHTML = `<span class="status">${statusIcon}</span><span class="name">${c.icon} ${c.title}</span>`;
      if (unlocked) item.addEventListener('click', () => selectChallenge(c.id));
      challengeListEl.appendChild(item);
    });
    lblProgress.textContent = `${completed.size}/${CHALLENGES.length}`;
  }

  function clearConsole() { consoleOutput.innerHTML = ''; }
  function logConsole(msg, type) {
    const line = document.createElement('div');
    line.className = 'line ' + (type || 'info');
    line.textContent = msg;
    consoleOutput.appendChild(line);
    consoleOutput.scrollTop = consoleOutput.scrollHeight;
  }

  function deepEqual(a, b) {
    if (Array.isArray(a) && Array.isArray(b)) {
      return a.length === b.length && a.every((v, i) => deepEqual(v, b[i]));
    }
    return a === b;
  }

  function runChallenge() {
    const challenge = CHALLENGES.find(c => c.id === selectedId);
    if (!challenge) return;
    clearConsole();

    let fn;
    try {
      fn = new Function(`${codeInput.value}\nreturn typeof ${challenge.fnName} === 'function' ? ${challenge.fnName} : undefined;`)();
    } catch (err) {
      logConsole('Erro de sintaxe: ' + err.message, 'fail');
      return;
    }

    if (typeof fn !== 'function') {
      logConsole(`A função '${challenge.fnName}' não foi encontrada. Verifique o nome da função.`, 'fail');
      return;
    }

    let allPass = true;
    challenge.tests.forEach((t, i) => {
      let result, errorMsg = null;
      try {
        result = fn(...t.args);
      } catch (err) {
        errorMsg = err.message;
      }

      let pass;
      if (errorMsg !== null) {
        pass = false;
      } else if (typeof t.check === 'function') {
        pass = t.check(result, ...t.args);
      } else {
        pass = deepEqual(result, t.expected);
      }
      if (!pass) allPass = false;

      const argsStr = t.args.map(a => JSON.stringify(a)).join(', ');
      const expectedStr = t.expectedLabel ? t.expectedLabel : JSON.stringify(t.expected);

      if (pass) {
        logConsole(`[Teste ${i + 1}] ${challenge.fnName}(${argsStr}) → ${JSON.stringify(result)} ✅`, 'pass');
      } else if (errorMsg) {
        logConsole(`[Teste ${i + 1}] ${challenge.fnName}(${argsStr}) → Erro: ${errorMsg} ❌`, 'fail');
      } else {
        logConsole(`[Teste ${i + 1}] ${challenge.fnName}(${argsStr}) → ${JSON.stringify(result)} (esperado ${expectedStr}) ❌`, 'fail');
      }
    });

    if (allPass) {
      completed.add(challenge.id);
      saveCompleted(completed);
      ticketStatusEl.textContent = 'RESOLVIDO';
      ticketStatusEl.classList.add('done');
      ticketStatusEl.classList.remove('pending');

      const isLast = CHALLENGES[CHALLENGES.length - 1].id === challenge.id;
      if (isLast) {
        logConsole('🏆 Chamado resolvido! Você concluiu todos os chamados de lógica e algoritmos!', 'success');
      } else {
        logConsole('✅ Chamado resolvido! Próximo chamado liberado.', 'success');
        btnNext.style.display = 'inline-block';
      }
      renderSidebar();

      if (typeof window.reportActivity === 'function') {
        window.reportActivity(
          'fund_logica_pratica',
          `Jogos — Lógica e Algoritmos — Chamado ${challenge.id}: ${challenge.title} (resolvido)`,
          { challengeId: challenge.id, total: CHALLENGES.length, completed: completed.size }
        );
      }
    } else {
      logConsole('❌ Ainda não é isso. Ajuste o código e execute de novo.', 'fail');
    }
  }

  function selectChallenge(id) {
    const challenge = CHALLENGES.find(c => c.id === id);
    if (!challenge || !isUnlocked(challenge)) return;
    selectedId = id;

    challengeTitleEl.textContent = `Chamado ${challenge.id}: ${challenge.title}`;
    explanationTextEl.innerHTML = challenge.explanation;
    challengeDescEl.innerHTML = challenge.desc;
    codeInput.value = challenge.starter;
    btnNext.style.display = 'none';

    hintBox.innerHTML = challenge.hint || '';
    hintBox.classList.remove('show');
    btnHint.textContent = '💡 Ver dica';

    ticketIconEl.textContent = challenge.icon;
    const alreadyDone = completed.has(id);
    ticketStatusEl.textContent = alreadyDone ? 'RESOLVIDO' : 'PENDENTE';
    ticketStatusEl.classList.toggle('done', alreadyDone);
    ticketStatusEl.classList.toggle('pending', !alreadyDone);

    clearConsole();
    if (alreadyDone) logConsole('Você já resolveu este chamado. Pode revisar/reexecutar o código.', 'info');
    renderSidebar();

    if (typeof window.reportActivity === 'function') {
      window.reportActivity(
        'fund_logica_pratica',
        `Jogos — Lógica e Algoritmos — Chamado ${challenge.id}: ${challenge.title}`,
        { challengeId: challenge.id, total: CHALLENGES.length, completed: completed.size }
      );
    }
  }

  btnHint.addEventListener('click', () => {
    const showing = hintBox.classList.toggle('show');
    btnHint.textContent = showing ? '💡 Ocultar dica' : '💡 Ver dica';
  });
  btnRun.addEventListener('click', runChallenge);
  btnNext.addEventListener('click', () => {
    const idx = CHALLENGES.findIndex(c => c.id === selectedId);
    const next = CHALLENGES[idx + 1];
    if (next) selectChallenge(next.id);
  });

  renderSidebar();
  selectChallenge(selectedId);
</script>
