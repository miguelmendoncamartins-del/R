<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Testes de Jogos: Fundamentos e Níveis (Teoria)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d14; --panel:#10141f; --panel2:#0d101a; --line:#20283a;
    --blue:#5ec8ff; --blue-dim:#2f7aa8; --blood:#c1121f; --blood-bright:#ff3b30;
    --gold:#e0b84a; --ink:#dbe4f2; --ink-dim:#657388;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--blue-dim); background:#060810;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(94,200,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--blue); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .zeta-row{ display:flex; align-items:flex-start; gap:12px; }
  .zeta-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(94,200,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--blue-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .zeta-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--blue);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble code{ color:var(--gold); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--gold); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--blue-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--blue); background:rgba(94,200,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--blue); color:var(--blue); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--blue); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--gold); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--blue); color:#04162a; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--blue); border:1px solid var(--blue-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--blue); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--gold); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--blue); border:1px solid var(--blue-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(94,200,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'teste_fundamentos_teoria';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/vendor/pptxgen.bundle.js"></script>
<script src="../../../shared/slides-generator.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>TESTES DE JOGOS — FUNDAMENTOS E NÍVEIS (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">10</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `teste_fundamentos_teoria_progress_${username}`;

  const STEPS = [
    {
      story: 'Olá! Eu sou a <b>Zeta</b>, detetive de qualidade da PixelForge Studios — minha lupa 🔍 já achou bug em lugar que ninguém imaginava. Muita gente confunde "testar um jogo" com "jogar um jogo". Não é a mesma coisa: quando eu jogo pra <b>testar</b>, tenho a intenção clara de achar falhas ANTES que o jogador final encontre — clico onde não devia, repito ações estranhas, tento quebrar o que parece perfeito.',
      question: {
        prompt: 'Qual é a principal diferença entre "jogar um jogo por diversão" e "testar um jogo" como parte do trabalho de QA?',
        options: [
          'Testar é jogar com a intenção deliberada de encontrar falhas antes do jogador final',
          'Não existe diferença nenhuma entre as duas coisas',
          'Testar significa terminar o jogo o mais rápido possível, sem prestar atenção em nada',
          'Testar é só ler o código-fonte, sem nunca abrir o jogo'
        ],
        correctIndex: 0,
        explanation: 'Isso! O que torna um teste um TESTE é a intenção: procurar ativamente por comportamentos errados antes que o público jogue.'
      }
    },
    {
      story: 'Todo teste segue um <b>processo fundamental</b>, sempre nessa ordem: primeiro a equipe <b>planeja</b> o que vai ser testado; depois <b>executa</b> os testes de verdade; quando algo dá errado, isso é <b>registrado</b> (reportado) num chamado; a equipe de desenvolvimento corrige; e por fim vem o <b>reteste</b>, pra confirmar que o problema realmente sumiu — sem pular nenhuma dessas etapas.',
      question: {
        prompt: 'Uma testadora encontra um bug, registra o chamado, e o time de dev corrige o código. Antes de fechar esse chamado como resolvido, o que ainda falta fazer?',
        options: [
          'Retestar aquele ponto específico, pra confirmar que o bug realmente foi corrigido',
          'Nada, corrigir o código já é suficiente pra fechar o chamado',
          'Testar um ponto do jogo completamente diferente, sem relação com o bug original',
          'Apagar o registro do chamado sem verificar mais nada'
        ],
        correctIndex: 0,
        explanation: 'Exato! O processo só se fecha com o reteste — confirmar de verdade que a correção funcionou, e não só assumir que funcionou.'
      }
    },
    {
      story: 'Existem vários <b>tipos de teste</b>, cada um de olho em algo diferente. O <b>Teste de Funcionalidade</b> é o mais direto de todos: ele confere se cada recurso faz exatamente o que o design pediu. Um botão de pulo deveria fazer o personagem pular? Então é isso que a Zeta vai conferir, ponto por ponto.',
      question: {
        prompt: 'Um chamado descreve: "aperto o botão de atirar, mas nenhum projétil sai na tela — deveria sair, conforme o design do jogo". Que tipo de teste identifica exatamente esse tipo de problema?',
        options: [
          'Teste de Funcionalidade',
          'Teste de Desempenho',
          'Teste de Manutenibilidade',
          'Teste de Confiabilidade'
        ],
        correctIndex: 0,
        explanation: 'Isso! Verificar se um recurso faz o que o design promete — nem mais, nem menos — é o coração do Teste de Funcionalidade.'
      }
    },
    {
      story: 'Já o <b>Teste de Confiabilidade</b> não olha pra "faz ou não faz" — ele olha pro <b>tempo</b> e pra <b>repetição</b>. Um recurso pode funcionar perfeitamente da primeira vez, mas travar depois de horas de uso contínuo, ou depois da mesma ação ser repetida centenas de vezes. É esse tipo de falha, que só aparece com o tempo, que a confiabilidade investiga.',
      question: {
        prompt: 'O sistema de inventário funciona perfeitamente no início, mas depois de 3 horas de jogo contínuo, sem nenhum erro visível, ele começa a travar. Qual tipo de teste é voltado a esse tipo de falha?',
        options: [
          'Teste de Confiabilidade',
          'Teste de Funcionalidade',
          'Teste de Manutenibilidade',
          'Teste de Desempenho'
        ],
        correctIndex: 0,
        explanation: 'Exato! Falhas que só aparecem com o tempo/repetição, mesmo com tudo funcionando "certo" no começo, são território do Teste de Confiabilidade.'
      }
    },
    {
      story: 'O <b>Teste de Desempenho</b> mede outra coisa: o jogo pode estar 100% correto no que faz, e mesmo assim estar <b>lento</b> ou <b>pesado</b>. FPS caindo, tempo de carregamento longo demais, uso excessivo de memória — tudo isso é desempenho, não funcionalidade.',
      question: {
        prompt: 'Todos os recursos do jogo funcionam exatamente como deveriam, mas em cenas com muitos inimigos na tela o número de quadros por segundo (FPS) despenca. Que tipo de teste identifica esse problema?',
        options: [
          'Teste de Desempenho',
          'Teste de Funcionalidade',
          'Teste de Confiabilidade',
          'Teste de Manutenibilidade'
        ],
        correctIndex: 0,
        explanation: 'Isso! "Funciona certo, mas está lento/pesado" é justamente a marca registrada do Teste de Desempenho.'
      }
    },
    {
      story: 'Por fim entre os tipos, o <b>Teste de Manutenibilidade</b> muda completamente o foco: ele não olha pro que o JOGADOR vê, e sim pro CÓDIGO por trás. A pergunta aqui é: quão fácil é consertar ou alterar esse código sem quebrar outra coisa no processo?',
      question: {
        prompt: 'O código do sistema de física está tão emaranhado que qualquer ajuste pequeno acaba quebrando outra mecânica sem relação nenhuma. Isso é sintoma de que tipo de teste sendo negligenciado?',
        options: [
          'Teste de Manutenibilidade',
          'Teste de Funcionalidade',
          'Teste de Desempenho',
          'Teste de Confiabilidade'
        ],
        correctIndex: 0,
        explanation: 'Exato! Manutenibilidade é sobre a saúde interna do código — não é o jogador que sente isso direto, é quem precisa mexer no código depois.'
      }
    },
    {
      story: 'Existem também duas grandes <b>técnicas de teste</b>: na técnica <b>caixa-preta</b>, a testadora não olha o código-fonte, só interage com o jogo por fora e observa o comportamento — como um jogador real faria. Já na técnica <b>caixa-branca</b>, a pessoa conhece a lógica interna do código e usa esse conhecimento pra decidir exatamente o que testar.',
      question: {
        prompt: 'Um testador nunca abre o código-fonte do jogo — ele só clica, joga e observa o que acontece na tela, comparando com o que era esperado. Que técnica de teste é essa?',
        options: [
          'Técnica caixa-preta',
          'Técnica caixa-branca',
          'Nível de Unidade',
          'Nível de Aceitação'
        ],
        correctIndex: 0,
        explanation: 'Isso! Testar só pelo comportamento externo, sem enxergar a lógica interna, é a definição de caixa-preta.'
      }
    },
    {
      story: 'Testes também acontecem em <b>níveis</b> diferentes de abrangência. No <b>nível de Unidade</b>, testa-se uma peça isolada do código — uma única função, por exemplo — sem depender do jogo inteiro rodando. Já no <b>nível de Integração</b>, o foco passa a ser se duas ou mais peças conversam corretamente ENTRE si.',
      question: {
        prompt: 'Uma testadora quer confirmar que, ao um inimigo tomar dano, o sistema de dano e a barra de vida na tela ATUALIZAM JUNTOS corretamente. Que nível de teste é esse?',
        options: [
          'Nível de Integração',
          'Nível de Unidade',
          'Nível de Sistema',
          'Nível de Aceitação'
        ],
        correctIndex: 0,
        explanation: 'Exato! Verificar se duas partes diferentes (dano e barra de vida) se comunicam certo entre si é justamente o nível de Integração.'
      }
    },
    {
      story: 'Subindo mais um degrau, o <b>nível de Sistema</b> testa o jogo INTEIRO rodando de ponta a ponta, exatamente como um jogador real jogaria — do menu inicial até os créditos. Já o <b>nível de Aceitação</b> é o último degrau: é quando o cliente ou produtor do jogo valida se o que foi entregue realmente atende ao que foi pedido, antes de aprovar.',
      question: {
        prompt: 'O produtor do jogo está conferindo, pessoalmente, se a versão entregue pela equipe atende a tudo que foi contratado — antes de liberar o pagamento final do projeto. Que nível de teste é esse?',
        options: [
          'Nível de Aceitação',
          'Nível de Sistema',
          'Nível de Unidade',
          'Nível de Integração'
        ],
        correctIndex: 0,
        explanation: 'Isso! Quando quem valida é o cliente/produtor, decidindo se aceita a entrega, estamos no nível de Aceitação — o topo da escada.'
      }
    },
    {
      story: 'Um último ponto tão importante quanto qualquer técnica: <b>COMO</b> um bug é reportado importa muito. <b>Comunicação não violenta</b> nos ambientes de trabalho significa descrever FATOS e IMPACTO ("ao clicar em X, acontece Y, e o esperado era Z") em vez de culpar quem escreveu aquele código. Um chamado bem escrito resolve bug; um chamado hostil só cria atrito na equipe. Agora você já reconhece os tipos de teste, as técnicas, os níveis e como reportar tudo isso com respeito!',
      question: {
        prompt: 'Ao encontrar um bug grave, qual das opções abaixo é o jeito mais adequado de registrar esse chamado pra equipe de desenvolvimento?',
        options: [
          '"Ao clicar no botão de salvar, o jogo fecha sozinho — o esperado era salvar o progresso e continuar na tela"',
          '"Quem programou isso não sabe o que está fazendo, o botão de salvar é um lixo"',
          'Não registrar nada, só comentar de boca com um colega e esperar que ele lembre',
          '"O sistema de salvamento inteiro é péssimo e devia ser refeito do zero por outra pessoa"'
        ],
        correctIndex: 0,
        explanation: 'Perfeito! Descrever fato (o que aconteceu), ação (o que foi feito) e expectativa (o que deveria acontecer) é comunicação não violenta — direta, útil e sem atacar ninguém.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Testes de Jogos Digitais — Fundamentos e Níveis de Teste',
      subtitle: 'Aula Teórica · Trilha Fundamentos e Níveis de Teste · Turma Jogos Digitais',
      capacidade: 'Identificar tipos, função, ferramentas de teste de acordo com o sistema de jogos digitais / Reconhecer normas, métodos e técnicas de testes para correção de falhas de sistema.',
      steps: STEPS,
      fileName: 'teste-fundamentos-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Prática — Central de QA: Fundamentos e Níveis de Teste" no Portal de Aulas para os alunos resolverem os chamados de verdade.'
    });
  };

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Testes de Jogos Digitais — Fundamentos e Níveis de Teste',
      subtitle: 'Aula Teórica · Trilha Fundamentos e Níveis de Teste · Turma Jogos Digitais',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'teste-fundamentos-teoria-gabarito.txt'
    });
  };

  const role = urlParams.get('role') || 'aluno';
  const btnGenSlides = document.getElementById('btnGenSlides');
  if (role === 'professor') {
    btnGenSlides.style.display = 'inline-block';
    btnGenSlides.addEventListener('click', () => {
      btnGenSlides.disabled = true;
      btnGenSlides.textContent = '⏳ Gerando...';
      setTimeout(() => {
        window.generateSlidesForGestao();
        btnGenSlides.disabled = false;
        btnGenSlides.textContent = '🖨️ Gerar Slides (PPTX)';
      }, 50);
    });
  }

  const storyWrap = document.getElementById('storyWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const lblStepTotal = document.getElementById('lblStepTotal');
  const progressFill = document.getElementById('progressFill');

  lblStepTotal.textContent = STEPS.length;

  function loadProgress() {
    try {
      return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
    } catch (e) {
      return null;
    }
  }

  function saveProgress(data) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(data));
  }

  const ORDER_KEY = PROGRESS_KEY.replace('_progress_', '_order_');

  function shuffleOrder() {
    const arr = STEPS.map((_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function loadOrder() {
    try {
      const parsed = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
      if (Array.isArray(parsed) && parsed.length === STEPS.length && parsed.every(n => Number.isInteger(n) && n >= 0 && n < STEPS.length)) {
        return parsed;
      }
    } catch (e) {}
    return null;
  }

  const saved = loadProgress();
  let stepOrder = (saved && !saved.completed) ? (loadOrder() || shuffleOrder()) : shuffleOrder();
  localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
  let currentStepIndex = (saved && !saved.completed) ? Math.min(saved.lastStepIndex || 0, STEPS.length - 1) : 0;
  let correctCount = (saved && typeof saved.correctCount === 'number') ? saved.correctCount : 0;

  function updateProgressBar() {
    const pct = Math.round(((currentStepIndex) / STEPS.length) * 100);
    progressFill.style.width = pct + '%';
    lblStepNum.textContent = Math.min(currentStepIndex + 1, STEPS.length);
  }

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity('teste_fundamentos_teoria', label, {
        step: currentStepIndex + 1,
        total: STEPS.length,
        correctCount: correctCount
      });
    }
  }

  function renderStory() {
    updateProgressBar();
    const step = STEPS[stepOrder[currentStepIndex]];
    reportStep(`Testes de Jogos — Fundamentos — Etapa ${currentStepIndex + 1}/${STEPS.length}`);

    storyWrap.innerHTML = '';

    const row = document.createElement('div');
    row.className = 'zeta-row';
    row.innerHTML = `
      <div class="zeta-avatar">🔍</div>
      <div class="speech-bubble">
        <span class="zeta-name">Zeta, a Detetive de Qualidade</span>
        ${step.story}
      </div>
    `;
    storyWrap.appendChild(row);

    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.innerHTML = `<button class="btn" id="btnNext">Próximo →</button>`;
    storyWrap.appendChild(actions);

    document.getElementById('btnNext').addEventListener('click', renderQuestion);
  }

  function renderQuestion() {
    const step = STEPS[stepOrder[currentStepIndex]];
    const q = step.question;

    storyWrap.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2>❓ ${q.prompt}</h2>`;

    const optionsWrap = document.createElement('div');
    const letters = ['A', 'B', 'C', 'D'];
    let answered = false;

    const order = q.options.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    const correctPos = order.indexOf(q.correctIndex);

    order.forEach((origIdx, pos) => {
      const optText = q.options[origIdx];
      const opt = document.createElement('div');
      opt.className = 'option';
      opt.innerHTML = `<span class="opt-letter">${letters[pos]}</span><span>${optText}</span>`;
      opt.addEventListener('click', () => {
        if (answered) return;
        answered = true;
        selectAnswer(pos);
      });
      optionsWrap.appendChild(opt);

      function selectAnswer(chosenIdx) {
        const allOptionEls = optionsWrap.querySelectorAll('.option');
        allOptionEls.forEach(el => el.classList.add('disabled'));

        const isCorrect = chosenIdx === correctPos;
        allOptionEls[chosenIdx].classList.add(isCorrect ? 'correct' : 'incorrect');
        if (!isCorrect) {
          allOptionEls[correctPos].classList.add('correct');
        }
        if (isCorrect) correctCount++;

        const feedback = document.createElement('div');
        feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
        feedback.innerHTML = isCorrect
          ? `✅ Correto! ${q.explanation}`
          : `❌ Não foi dessa vez. A resposta certa é "<b>${q.options[q.correctIndex]}</b>": ${q.explanation.replace(/^(Isso mesmo!|Isso!|Correto!|Exato!|Perfeito!|Correta!)\s*/i, '')}`;
        card.appendChild(feedback);

        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.style.marginTop = '14px';
        actions.innerHTML = `<button class="btn" id="btnNextAfterAnswer">Próximo →</button>`;
        card.appendChild(actions);

        saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
        reportStep(`Testes de Jogos — Fundamentos — Etapa ${currentStepIndex + 1}/${STEPS.length} (respondida)`);

        document.getElementById('btnNextAfterAnswer').addEventListener('click', () => {
          currentStepIndex++;
          if (currentStepIndex >= STEPS.length) {
            finishJourney();
          } else {
            saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
            renderStory();
          }
        });
      }
    });

    card.appendChild(optionsWrap);
    storyWrap.innerHTML = '';
    storyWrap.appendChild(card);
  }

  function finishJourney(reviewOnly) {
    const pct = STEPS.length > 0 ? Math.round((correctCount / STEPS.length) * 100) : 0;
    const passed = reviewOnly ? true : pct >= 80;
    if (!reviewOnly) {
      saveProgress({ lastStepIndex: STEPS.length, correctCount, completed: passed });
      reportStep(`Testes de Jogos — Fundamentos — ${passed ? 'Concluída' : 'Não concluída'} (${correctCount}/${STEPS.length})`);
    }

    progressFill.style.width = '100%';
    lblStepNum.textContent = STEPS.length;

    storyWrap.innerHTML = passed ? `
      <div class="card finish-screen">
        <div class="trophy">🏆</div>
        <h2>Fundamentos e Níveis de Teste concluídos!</h2>
        <p>Você já reconhece os tipos de teste (Funcionalidade, Confiabilidade, Desempenho, Manutenibilidade), as técnicas caixa-preta/caixa-branca, os níveis (Unidade, Integração, Sistema, Aceitação) e como reportar um bug com respeito.</p>
        <div class="score">Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%).</div>
        <p>Agora é hora de colocar a mão na massa: volte à trilha e abra o módulo de prática da Central de QA.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn btn-secondary" id="btnRestart">🔁 Rever a teoria</button>
        </div>
      </div>
    ` : `
      <div class="card finish-screen">
        <div class="trophy">📚</div>
        <h2>Quase lá!</h2>
        <p>Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%) — é preciso pelo menos 80% de acerto para concluir esta atividade.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn" id="btnRestart">🔁 Tentar novamente</button>
        </div>
      </div>
    `;

    document.getElementById('btnRestart').addEventListener('click', () => {
      currentStepIndex = 0;
      correctCount = 0;
      stepOrder = shuffleOrder();
      localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
      saveProgress({ lastStepIndex: 0, correctCount: 0, completed: false });
      renderStory();
    });
  }

  if (saved && saved.completed) {
    currentStepIndex = STEPS.length;
    finishJourney(true);
  } else {
    renderStory();
  }
</script>
