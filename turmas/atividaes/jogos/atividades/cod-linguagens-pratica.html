<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Jogos: Central de Codificação</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d14; --panel:#10141f; --panel2:#0d101a; --line:#20283a;
    --blue:#5ec8ff; --blue-dim:#2f7aa8; --blood:#c1121f; --blood-bright:#ff3b30;
    --gold:#e0b84a; --ink:#dbe4f2; --ink-dim:#657388;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--blue-dim); background:#060810;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(94,200,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .stage{ flex:1; min-height:0; padding:12px; overflow:hidden; display:flex; }
  .layout{ display:flex; flex-direction:row; flex-wrap:nowrap; gap:14px; width:100%; height:100%; }

  .sidebar{
    width:200px; flex-shrink:0; height:100%; overflow-y:auto;
    background:var(--panel); border:1px solid var(--line); padding:8px;
  }
  .sidebar-title{ font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; padding:0 2px; }
  .challenge-item{
    display:flex; align-items:center; gap:8px; padding:8px 8px; margin-bottom:4px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:11px;
  }
  .challenge-item .status{ font-size:13px; width:16px; text-align:center; flex-shrink:0; }
  .challenge-item.active{ border-color:var(--blue); color:var(--blue); }
  .challenge-item.completed{ color:var(--ink); }
  .challenge-item.locked{ opacity:0.4; cursor:not-allowed; }
  .challenge-item .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .main-panel{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; height:100%; overflow-y:auto; }

  .challenge-header{ flex-shrink:0; background:var(--panel); border:1px solid var(--line); padding:10px 14px; }

  .ticket-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .ticket-icon{ font-size:26px; line-height:1; }
  .ticket-status{ font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; padding:3px 8px; border-radius:2px; }
  .ticket-status.pending{ background:rgba(255,59,48,0.15); color:var(--blood-bright); }
  .ticket-status.done{ background:rgba(94,200,255,0.15); color:var(--blue); }

  .challenge-header h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:19px; color:var(--blue); margin:0 0 8px; letter-spacing:1px; }
  .challenge-header p{ font-size:12px; color:var(--ink-dim); margin:8px 0 0; line-height:1.5; }
  .challenge-header code{ color:var(--gold); }

  .explanation-box{
    background:#060810; border:1px solid var(--blue-dim); padding:10px 12px;
    font-size:11.5px; color:var(--ink); line-height:1.6;
  }
  .explanation-box .exp-title{
    color:var(--blue); font-weight:800; text-transform:uppercase; font-size:10px; letter-spacing:1px; margin-bottom:6px;
  }
  .explanation-box code{ color:var(--gold); }
  .explanation-box pre{
    background:#000; border:1px solid var(--line); padding:8px; margin:6px 0 0;
    overflow-x:auto; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--gold); white-space:pre;
  }

  .hint-toggle{
    display:inline-block; margin-top:8px; font-size:10.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--gold); border:1px solid var(--blue-dim); padding:5px 10px; cursor:pointer; border-radius:2px;
  }
  .hint-toggle:hover{ background:rgba(224,184,74,0.1); }
  .hint-box{
    display:none; margin-top:8px; background:var(--panel2); border:1px dashed var(--gold);
    padding:8px 10px; font-size:11.5px; color:var(--ink); line-height:1.5;
  }
  .hint-box.show{ display:block; }
  .hint-box b{ color:var(--gold); }

  textarea#codeInput{
    width:100%; flex:1; min-height:60px; resize:vertical; background:#000; color:var(--blue);
    border:1px solid var(--line); font-family:'JetBrains Mono', monospace; font-size:12px;
    padding:10px; outline:none; line-height:1.5;
  }
  textarea#codeInput:focus{ border-color:var(--blue); }

  .actions{ display:flex; gap:8px; align-items:center; flex-shrink:0; flex-wrap:wrap; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11px; letter-spacing:1px; text-transform:uppercase;
    background:var(--blue); color:#04162a; border:none; padding:9px 16px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.5; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--blue); border:1px solid var(--blue-dim); }

  .console{
    background:#050710; border:1px solid var(--line); padding:8px 10px; font-size:11px;
    flex:1; min-height:50px; overflow-y:auto; line-height:1.6;
  }
  .console .line.info{ color:var(--ink-dim); }
  .console .line.pass{ color:var(--blue); }
  .console .line.fail{ color:var(--blood-bright); }
  .console .line.success{ color:var(--blue); font-weight:bold; }
  .console .line.warn{ color:var(--gold); }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:8px; }
    .layout{ flex-direction:column; height:auto; }
    .sidebar{ width:100%; height:auto; max-height:150px; }
    .main-panel{ height:auto; overflow-y:visible; }
    textarea#codeInput{ min-height:110px; }
    .console{ flex:none; max-height:160px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'cod_linguagens_pratica';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>CODIFICAÇÃO — OFICINA DE CÓDIGO: LINGUAGENS, DADOS E GDD</div>
    <div>RESOLVIDOS: <span id="lblProgress">0/0</span></div>
  </div>

  <div class="stage">
    <div class="layout">
      <div class="sidebar">
        <div class="sidebar-title">Chamados</div>
        <div id="challengeList"></div>
      </div>

      <div class="main-panel">
        <div class="challenge-header">
          <div class="ticket-row">
            <div class="ticket-icon" id="ticketIcon">🐞</div>
            <div class="ticket-status pending" id="ticketStatus">PENDENTE</div>
          </div>
          <h2 id="challengeTitle">--</h2>

          <div class="explanation-box">
            <div class="exp-title">📖 Como funciona</div>
            <div id="explanationText"></div>
          </div>

          <p id="challengeDesc"></p>

          <button class="hint-toggle" id="btnHint">💡 Ver dica</button>
          <div class="hint-box" id="hintBox"></div>
        </div>

        <textarea id="codeInput" spellcheck="false"></textarea>

        <div class="actions">
          <button class="btn" id="btnRun">🔧 Resolver chamado</button>
          <button class="btn btn-secondary" id="btnNext" style="display:none;">Próximo chamado →</button>
        </div>

        <div class="console" id="consoleOutput"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `cod_linguagens_pratica_progress_${username}`;

  const CHALLENGES = [
    {
      id: 1,
      title: 'Ler o volume salvo',
      icon: '🔊',
      fnName: 'lerVolume',
      starter: 'function lerVolume(configJson) {\n  // configJson é uma string JSON, ex: \'{"volume":80,"idioma":"pt"}\'\n  // devolva o valor do campo "volume"\n\n}',
      explanation: '<code>JSON.parse()</code> transforma um texto no formato JSON num objeto de verdade, que você pode acessar normalmente.<pre>const obj = JSON.parse(\'{"nome":"Ana"}\');\nobj.nome   // "Ana"</pre>',
      desc: 'A central recebeu um chamado: o <code>config.json</code> de um jogador está mostrando o volume errado na tela. Complete <code>lerVolume(configJson)</code> recebendo uma string JSON e devolvendo o valor do campo <code>"volume"</code>.',
      hint: 'Existe uma função pronta que transforma uma string JSON num objeto — depois é só acessar o campo certo com ponto.',
      tests: [
        { args: ['{"volume":80,"idioma":"pt"}'], expected: 80 },
        { args: ['{"volume":45,"idioma":"en"}'], expected: 45 },
        { args: ['{"volume":0,"idioma":"es"}'], expected: 0 }
      ]
    },
    {
      id: 2,
      title: 'GDD com todos os requisitos',
      icon: '📋',
      fnName: 'gddCompleto',
      starter: 'function gddCompleto(gdd) {\n  // gdd é um objeto, ex: { titulo: "...", genero: "...", plataforma: "..." }\n  // retorne true só se as TRÊS chaves existirem no objeto\n\n}',
      explanation: 'O operador <code>in</code> verifica se uma chave existe dentro de um objeto, devolvendo <code>true</code> ou <code>false</code>.<pre>const obj = { nome: "Ana" };\n"nome" in obj   // true\n"idade" in obj  // false</pre>',
      desc: 'Chegou uma reclamação: um GDD está incompleto e ninguém percebeu. Complete <code>gddCompleto(gdd)</code> retornando <b>true</b> só se o objeto tiver as três chaves <code>"titulo"</code>, <code>"genero"</code> e <code>"plataforma"</code> ao mesmo tempo.',
      hint: 'Existe um operador que testa se uma chave existe num objeto — como você combinaria essa checagem pras três chaves ao mesmo tempo, sem nenhuma podendo faltar?',
      tests: [
        { args: [{ titulo: 'A', genero: 'RPG', plataforma: 'PC' }], expected: true },
        { args: [{ titulo: 'A', genero: 'RPG' }], expected: false },
        { args: [{}], expected: false }
      ]
    },
    {
      id: 3,
      title: 'Salvar como JSON',
      icon: '💾',
      fnName: 'salvarConfig',
      starter: 'function salvarConfig(config) {\n  // config é um objeto\n  // devolva ele convertido em string JSON\n\n}',
      explanation: '<code>JSON.stringify()</code> faz o caminho inverso de <code>JSON.parse()</code>: transforma um objeto numa string JSON.<pre>JSON.stringify({ a: 1 })   // \'{"a":1}\'</pre>',
      desc: 'Agora é o inverso: complete <code>salvarConfig(config)</code> recebendo um objeto e devolvendo ele convertido em <b>string JSON</b>, pronta pra salvar em arquivo.',
      hint: 'Existe uma função pronta que faz o caminho inverso de JSON.parse — transforma objeto em texto.',
      tests: [
        { args: [{ volume: 50 }], expected: '{"volume":50}' },
        { args: [{ idioma: 'pt' }], expected: '{"idioma":"pt"}' },
        { args: [{}], expected: '{}' }
      ]
    },
    {
      id: 4,
      title: 'Assets em formato válido',
      icon: '🖼️',
      fnName: 'assetsValidos',
      starter: 'function assetsValidos(lista) {\n  // lista é um array de objetos { nome, formato }\n  // retorne um novo array só com os que tem formato "png", "jpg" ou "json"\n\n}',
      explanation: 'O método <code>.filter()</code> cria um novo array só com os itens que passam num teste. Combine com <code>.includes()</code> pra checar se um valor está numa lista.<pre>[1, 2, 3].filter(n => n > 1)         // [2, 3]\n["a", "b"].includes("a")            // true</pre>',
      desc: 'O pipeline de renderização só aceita alguns formatos de asset. Complete <code>assetsValidos(lista)</code> recebendo um array de objetos <code>{ nome, formato }</code> e retornando um novo array só com os que têm formato <code>"png"</code>, <code>"jpg"</code> ou <code>"json"</code>.',
      hint: 'Existe um método de array que filtra itens que passam num teste — combine com .includes() numa lista de formatos válidos.',
      tests: [
        { args: [[{ nome: 'a', formato: 'png' }, { nome: 'b', formato: 'psd' }, { nome: 'c', formato: 'json' }]], expected: [{ nome: 'a', formato: 'png' }, { nome: 'c', formato: 'json' }] },
        { args: [[{ nome: 'x', formato: 'psd' }]], expected: [] },
        { args: [[]], expected: [] }
      ]
    },
    {
      id: 5,
      title: 'Peso total dos assets',
      icon: '⚖️',
      fnName: 'pesoTotalKb',
      starter: 'function pesoTotalKb(texturas) {\n  // texturas é um array de objetos { nome, kb }\n  // retorne a soma de todos os "kb"\n\n}',
      explanation: 'Pra somar um valor de cada item de um array, você pode usar um laço, ou o método <code>.reduce()</code>.<pre>const itens = [{ v: 10 }, { v: 20 }];\nconst total = itens.reduce((soma, it) => soma + it.v, 0);\n// total é 30</pre>',
      desc: 'Antes de fechar a build, a central quer saber se as texturas cabem no orçamento de memória. Complete <code>pesoTotalKb(texturas)</code> recebendo um array de objetos <code>{ nome, kb }</code> e retornando a soma de todos os <code>kb</code>.',
      hint: 'Pense em percorrer o array acumulando uma soma a cada item, ou pesquise por um método de array pra "reduzir" a uma soma só.',
      tests: [
        { args: [[{ nome: 'a', kb: 120 }, { nome: 'b', kb: 80 }]], expected: 200 },
        { args: [[]], expected: 0 },
        { args: [[{ nome: 'a', kb: 50 }]], expected: 50 }
      ]
    },
    {
      id: 6,
      title: 'IDs de asset duplicados',
      icon: '🔁',
      fnName: 'temIdDuplicado',
      starter: 'function temIdDuplicado(ids) {\n  // ids é um array de strings\n  // retorne true se algum id aparecer mais de uma vez\n\n}',
      explanation: 'Um <code>Set</code> guarda valores sem repetição — é útil pra lembrar o que você já viu enquanto percorre uma lista.<pre>const vistos = new Set();\nvistos.add("a");\nvistos.has("a")   // true\nvistos.has("b")   // false</pre>',
      desc: 'Dois assets com o mesmo id causaram um bug de sobrescrita. Complete <code>temIdDuplicado(ids)</code> recebendo um array de strings e retornando <b>true</b> se algum id aparecer mais de uma vez.',
      hint: 'Percorra a lista guardando os ids já vistos (um Set ajuda bastante) — se encontrar um id repetido, já é true.',
      tests: [
        { args: [['a', 'b', 'a']], expected: true },
        { args: [['a', 'b', 'c']], expected: false },
        { args: [[]], expected: false }
      ]
    },
    {
      id: 7,
      title: 'Contar requisitos funcionais',
      icon: '✅',
      fnName: 'contarFuncionais',
      starter: 'function contarFuncionais(requisitos) {\n  // requisitos é um array de objetos { texto, tipo }\n  // tipo pode ser "funcional" ou "nao-funcional"\n  // retorne quantos são "funcional"\n\n}',
      explanation: 'Você pode combinar <code>.filter()</code> com <code>.length</code> pra contar quantos itens passam num teste.<pre>const itens = [{ t: "a" }, { t: "b" }, { t: "a" }];\nitens.filter(i => i.t === "a").length   // 2</pre>',
      desc: 'A central quer saber quantos requisitos do GDD são <b>funcionais</b>. Complete <code>contarFuncionais(requisitos)</code> recebendo um array de objetos <code>{ texto, tipo }</code> e retornando quantos têm <code>tipo === "funcional"</code>.',
      hint: 'Filtre a lista pelos que têm tipo "funcional" e depois conte quantos sobraram.',
      tests: [
        { args: [[{ texto: 'pular', tipo: 'funcional' }, { texto: '60fps', tipo: 'nao-funcional' }, { texto: 'atacar', tipo: 'funcional' }]], expected: 2 },
        { args: [[]], expected: 0 },
        { args: [[{ texto: 'x', tipo: 'nao-funcional' }]], expected: 0 }
      ]
    },
    {
      id: 8,
      title: 'Ordenar pipeline por prioridade',
      icon: '🎯',
      fnName: 'ordenarPorPrioridade',
      starter: 'function ordenarPorPrioridade(assets) {\n  // assets é um array de objetos { nome, prioridade } (número, menor carrega primeiro)\n  // retorne um NOVO array ordenado do menor pro maior "prioridade"\n\n}',
      explanation: 'O método <code>.sort()</code> ordena um array. Pra ordenar por um campo numérico, passe uma função de comparação.<pre>const nums = [{ v: 3 }, { v: 1 }];\n[...nums].sort((a, b) => a.v - b.v);\n// [{ v: 1 }, { v: 3 }]</pre>',
      desc: 'O pipeline de renderização precisa carregar os assets na ordem certa. Complete <code>ordenarPorPrioridade(assets)</code> recebendo um array de objetos <code>{ nome, prioridade }</code> e retornando um novo array ordenado do menor pro maior valor de <code>prioridade</code>.',
      hint: 'Existe um método de array que ordena com base numa função de comparação — copie o array antes (com [...array]) pra não alterar o original.',
      tests: [
        { args: [[{ nome: 'b', prioridade: 2 }, { nome: 'a', prioridade: 1 }]], expected: [{ nome: 'a', prioridade: 1 }, { nome: 'b', prioridade: 2 }] },
        { args: [[]], expected: [] },
        { args: [[{ nome: 'a', prioridade: 5 }, { nome: 'b', prioridade: 1 }, { nome: 'c', prioridade: 3 }]], expected: [{ nome: 'b', prioridade: 1 }, { nome: 'c', prioridade: 3 }, { nome: 'a', prioridade: 5 }] }
      ]
    },
    {
      id: 9,
      title: 'JSON malformado',
      icon: '⚠️',
      fnName: 'jsonValido',
      starter: 'function jsonValido(texto) {\n  // texto é uma string qualquer\n  // retorne true se for um JSON válido, false se não for (sem travar o programa)\n\n}',
      explanation: 'Quando <code>JSON.parse()</code> recebe um texto inválido, ele lança um erro. Um bloco <code>try/catch</code> permite tentar algo e reagir se der erro, sem travar o programa.<pre>try {\n  JSON.parse("isso não é json");\n} catch (e) {\n  // cai aqui quando dá erro\n}</pre>',
      desc: 'Um chamado descreve: "o jogo trava ao carregar um save corrompido". Complete <code>jsonValido(texto)</code> recebendo uma string e retornando <b>true</b> se ela for um JSON válido, ou <b>false</b> caso contrário — sem deixar o erro travar o programa.',
      hint: 'Tente fazer o JSON.parse dentro de um try/catch — se cair no catch, o texto não era um JSON válido.',
      tests: [
        { args: ['{"a":1}'], expected: true },
        { args: ['{a:1}'], expected: false },
        { args: [''], expected: false }
      ]
    },
    {
      id: 10,
      title: 'BOSS: valide o GDD recebido em texto',
      icon: '🏆',
      fnName: 'gddValidoDeTexto',
      starter: 'function gddValidoDeTexto(textoJson) {\n  // textoJson é uma string\n  // retorne true só se: for um JSON válido E tiver as chaves "titulo", "genero" e "plataforma"\n\n}',
      explanation: 'Este chamado combina dois desafios que você já resolveu antes: validar se um texto é JSON válido (com try/catch) e checar se um objeto tem as chaves obrigatórias (com o operador in).',
      desc: 'Chamado final da oficina: a central recebe o GDD de um novo projeto como texto puro, direto de um formulário. Complete <code>gddValidoDeTexto(textoJson)</code> retornando <b>true</b> só se o texto for um JSON válido <b>e</b>, depois de convertido, tiver as chaves <code>"titulo"</code>, <code>"genero"</code> e <code>"plataforma"</code>.',
      hint: 'Combine o try/catch do desafio do JSON malformado com a checagem de chaves do desafio do GDD completo.',
      tests: [
        { args: ['{"titulo":"A","genero":"RPG","plataforma":"PC"}'], expected: true },
        { args: ['{"titulo":"A"}'], expected: false },
        { args: ['not json'], expected: false }
      ]
    }
  ];

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Codificação de Jogos: Central — Linguagens, Dados e GDD',
      subtitle: 'Prática · Turma Jogos Digitais',
      items: CHALLENGES.map((c, i) => ({
        number: i + 1,
        title: c.title,
        prompt: c.desc,
        answer: c.tests.map(t => {
          const inputs = (t.args || []).map(a => JSON.stringify(a)).join(', ');
          const exp = ('expected' in t) ? JSON.stringify(t.expected) : (t.expectedLabel || 'ver critério no código-fonte');
          return `${c.fnName}(${inputs}) deve retornar ${exp}`;
        }).join('\n')
      })),
      fileName: 'cod-linguagens-pratica-gabarito.txt'
    });
  };

  const challengeListEl = document.getElementById('challengeList');
  const challengeTitleEl = document.getElementById('challengeTitle');
  const challengeDescEl = document.getElementById('challengeDesc');
  const explanationTextEl = document.getElementById('explanationText');
  const ticketIconEl = document.getElementById('ticketIcon');
  const ticketStatusEl = document.getElementById('ticketStatus');
  const codeInput = document.getElementById('codeInput');
  const btnRun = document.getElementById('btnRun');
  const btnNext = document.getElementById('btnNext');
  const btnHint = document.getElementById('btnHint');
  const hintBox = document.getElementById('hintBox');
  const consoleOutput = document.getElementById('consoleOutput');
  const lblProgress = document.getElementById('lblProgress');

  function getCompleted() {
    try {
      return new Set(JSON.parse(localStorage.getItem(PROGRESS_KEY) || '[]'));
    } catch (e) {
      return new Set();
    }
  }
  function saveCompleted(set) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify([...set]));
  }

  let completed = getCompleted();
  let selectedId = CHALLENGES.find(c => !completed.has(c.id))?.id || CHALLENGES[0].id;

  function isUnlocked(challenge) {
    const idx = CHALLENGES.findIndex(c => c.id === challenge.id);
    if (idx === 0) return true;
    return completed.has(CHALLENGES[idx - 1].id);
  }

  function renderSidebar() {
    challengeListEl.innerHTML = '';
    CHALLENGES.forEach(c => {
      const unlocked = isUnlocked(c);
      const isDone = completed.has(c.id);
      const item = document.createElement('div');
      item.className = 'challenge-item' + (c.id === selectedId ? ' active' : '') + (isDone ? ' completed' : '') + (!unlocked ? ' locked' : '');
      const statusIcon = isDone ? '✅' : (unlocked ? '🐞' : '🔒');
      item.innerHTML = `<span class="status">${statusIcon}</span><span class="name">${c.icon} ${c.title}</span>`;
      if (unlocked) item.addEventListener('click', () => selectChallenge(c.id));
      challengeListEl.appendChild(item);
    });
    lblProgress.textContent = `${completed.size}/${CHALLENGES.length}`;
  }

  function clearConsole() { consoleOutput.innerHTML = ''; }
  function logConsole(msg, type) {
    const line = document.createElement('div');
    line.className = 'line ' + (type || 'info');
    line.textContent = msg;
    consoleOutput.appendChild(line);
    consoleOutput.scrollTop = consoleOutput.scrollHeight;
  }

  function deepEqual(a, b) {
    if (Array.isArray(a) && Array.isArray(b)) {
      return a.length === b.length && a.every((v, i) => deepEqual(v, b[i]));
    }
    if (a && b && typeof a === 'object' && typeof b === 'object') {
      const ka = Object.keys(a), kb = Object.keys(b);
      return ka.length === kb.length && ka.every(k => deepEqual(a[k], b[k]));
    }
    return a === b;
  }

  function selectChallenge(id) {
    const challenge = CHALLENGES.find(c => c.id === id);
    if (!challenge || !isUnlocked(challenge)) return;
    selectedId = id;

    challengeTitleEl.textContent = `Chamado ${challenge.id}: ${challenge.title}`;
    explanationTextEl.innerHTML = challenge.explanation;
    challengeDescEl.innerHTML = challenge.desc;
    codeInput.value = challenge.starter;
    btnNext.style.display = 'none';

    hintBox.innerHTML = challenge.hint || '';
    hintBox.classList.remove('show');
    btnHint.textContent = '💡 Ver dica';

    ticketIconEl.textContent = challenge.icon;
    const alreadyDone = completed.has(id);
    ticketStatusEl.textContent = alreadyDone ? 'RESOLVIDO' : 'PENDENTE';
    ticketStatusEl.classList.toggle('done', alreadyDone);
    ticketStatusEl.classList.toggle('pending', !alreadyDone);

    clearConsole();
    if (alreadyDone) {
      logConsole(`Você já resolveu este chamado. Pode revisar/reenviar o código.`, 'info');
    }
    renderSidebar();

    if (typeof window.reportActivity === 'function') {
      window.reportActivity(
        'cod_linguagens_pratica',
        `Codificação — Linguagens e GDD — Chamado ${challenge.id}: ${challenge.title}`,
        { challengeId: challenge.id, total: CHALLENGES.length, completed: completed.size }
      );
    }
  }

  function runChallenge() {
    const challenge = CHALLENGES.find(c => c.id === selectedId);
    if (!challenge) return;
    clearConsole();

    let fn;
    try {
      fn = new Function(`${codeInput.value}\nreturn typeof ${challenge.fnName} === 'function' ? ${challenge.fnName} : undefined;`)();
    } catch (err) {
      logConsole('Erro de sintaxe: ' + err.message, 'fail');
      return;
    }

    if (typeof fn !== 'function') {
      logConsole(`A função '${challenge.fnName}' não foi encontrada. Verifique o nome da função.`, 'fail');
      return;
    }

    let allPass = true;
    challenge.tests.forEach((t, i) => {
      let result, errorMsg = null;
      try {
        result = fn(...t.args);
      } catch (err) {
        errorMsg = err.message;
      }

      let pass;
      if (errorMsg !== null) {
        pass = false;
      } else if (typeof t.check === 'function') {
        pass = t.check(result, ...t.args);
      } else {
        pass = deepEqual(result, t.expected);
      }
      if (!pass) allPass = false;

      const argsStr = t.args.map(a => JSON.stringify(a)).join(', ');
      const expectedStr = t.expectedLabel ? t.expectedLabel : JSON.stringify(t.expected);

      if (pass) {
        logConsole(`[Teste ${i + 1}] ${challenge.fnName}(${argsStr}) → ${JSON.stringify(result)} ✅`, 'pass');
      } else if (errorMsg) {
        logConsole(`[Teste ${i + 1}] ${challenge.fnName}(${argsStr}) → Erro: ${errorMsg} ❌`, 'fail');
      } else {
        logConsole(`[Teste ${i + 1}] ${challenge.fnName}(${argsStr}) → ${JSON.stringify(result)} (esperado ${expectedStr}) ❌`, 'fail');
      }
    });

    if (allPass) {
      completed.add(challenge.id);
      saveCompleted(completed);
      ticketStatusEl.textContent = 'RESOLVIDO';
      ticketStatusEl.classList.add('done');
      ticketStatusEl.classList.remove('pending');

      const isLast = CHALLENGES[CHALLENGES.length - 1].id === challenge.id;
      if (isLast) {
        logConsole('🏆 Chamado resolvido! Você concluiu todos os chamados de Linguagens, Dados e GDD!', 'success');
      } else {
        logConsole('✅ Chamado resolvido! Próximo chamado liberado.', 'success');
        btnNext.style.display = 'inline-block';
      }
      renderSidebar();

      if (typeof window.reportActivity === 'function') {
        window.reportActivity(
          'cod_linguagens_pratica',
          `Codificação — Linguagens e GDD — Chamado ${challenge.id}: ${challenge.title} (resolvido)`,
          { challengeId: challenge.id, total: CHALLENGES.length, completed: completed.size }
        );
      }
    } else {
      logConsole('❌ Ainda não! Ajuste o código e tente de novo.', 'warn');
    }
  }

  btnHint.addEventListener('click', () => {
    const showing = hintBox.classList.toggle('show');
    btnHint.textContent = showing ? '💡 Ocultar dica' : '💡 Ver dica';
  });
  btnRun.addEventListener('click', runChallenge);
  btnNext.addEventListener('click', () => {
    const idx = CHALLENGES.findIndex(c => c.id === selectedId);
    const next = CHALLENGES[idx + 1];
    if (next) selectChallenge(next.id);
  });

  renderSidebar();
  selectChallenge(selectedId);
</script>
