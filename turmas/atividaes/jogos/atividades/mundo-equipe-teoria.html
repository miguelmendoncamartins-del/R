<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Trabalho em Equipe e Colaboração: Teoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d14; --panel:#10141f; --panel2:#0d101a; --line:#20283a;
    --blue:#5ec8ff; --blue-dim:#2f7aa8; --blood:#c1121f; --blood-bright:#ff3b30;
    --gold:#e0b84a; --ink:#dbe4f2; --ink-dim:#657388;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--blue-dim); background:#060810;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(94,200,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--blue); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .bit-row{ display:flex; align-items:flex-start; gap:12px; }
  .bit-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(94,200,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--blue-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .bit-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--blue);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble code{ color:var(--gold); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--gold); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--blue-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--blue); background:rgba(94,200,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--blue); color:var(--blue); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--blue); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--gold); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--blue); color:#04162a; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--blue); border:1px solid var(--blue-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--blue); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--gold); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--blue); border:1px solid var(--blue-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(94,200,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'mundo_equipe_teoria';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/vendor/pptxgen.bundle.js"></script>
<script src="../../../shared/slides-generator.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>JOGOS — TRABALHO EM EQUIPE E COLABORAÇÃO (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">5</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `mundo_equipe_teoria_progress_${username}`;

  const STEPS = [
    {
      story: 'Oi! Eu sou o <b>Bit</b>, assistente de indústria 4.0 da PixelForge Studios — hoje vamos falar sobre <b>trabalho em equipe</b>. <b>Colaborar</b> é diferente de só "dividir tarefas e trabalhar cada um no seu canto": colaboração de verdade significa compartilhar conhecimento, ajudar o colega quando ele trava e buscar o resultado do time, não só a sua parte isolada. <b>Cooperação</b> é agir junto rumo a um objetivo comum, mesmo quando as tarefas de cada um são diferentes.',
      question: {
        prompt: 'Dois devs de um estúdio trabalham em partes diferentes do mesmo jogo. Quando um deles descobre uma solução útil pra um bug comum, avisa o outro e explica como resolveu, mesmo não sendo obrigado. Isso é um exemplo de quê?',
        options: [
          'Colaboração — compartilhar conhecimento e ajudar o colega em prol do resultado do time',
          'Apenas divisão de tarefas, cada um trabalhando isoladamente sem se ajudar',
          'Competição saudável entre os dois devs, tentando resolver o bug mais rápido',
          'Gestão de conflitos, porque surgiu um problema técnico entre os dois'
        ],
        correctIndex: 0,
        explanation: 'Isso! Compartilhar conhecimento proativamente pra ajudar o time, mesmo sem obrigação, é a essência da colaboração de verdade.'
      }
    },
    {
      story: '<b>Liderança</b> em uma equipe não é sobre mandar — é sobre facilitar o trabalho do time: distribuir tarefas de acordo com a força de cada pessoa, remover obstáculos e dar suporte quando alguém trava. Um bom líder também sabe <b>adaptar seu estilo</b> conforme a situação: às vezes precisa dar mais direção, às vezes precisa só confiar e deixar o time trabalhar (isso se chama <b>liderança situacional</b>).',
      question: {
        prompt: 'Uma dev experiente vira líder técnica do time e passa a distribuir as tarefas conforme a força de cada colega, além de remover obstáculos que travam o trabalho deles — em vez de só dar ordens. Que tipo de liderança é essa?',
        options: [
          'Liderança que facilita o trabalho do time, distribuindo tarefas e removendo obstáculos',
          'Liderança autoritária, focada só em dar ordens sem ouvir a equipe',
          'Ausência de liderança, já que ela não está mandando em ninguém diretamente',
          'Gestão de conflitos, porque ela está resolvendo um problema entre colegas'
        ],
        correctIndex: 0,
        explanation: 'Exato! Boa liderança facilita o trabalho do time — distribui tarefas conforme a força de cada um e remove obstáculos, em vez de só mandar.'
      }
    },
    {
      story: '<b>Conflito</b> em equipe não é necessariamente ruim — o que importa é como ele é conduzido. <b>Gestão de conflitos construtiva</b> significa focar no <b>problema</b>, não na pessoa: em vez de "você errou", perguntar "o que podemos ajustar nesse processo pra isso não acontecer de novo?". Assim o conflito vira uma chance de melhorar, em vez de só gerar mágoa.',
      question: {
        prompt: 'Dois devs discordam sobre como implementar uma feature. Em vez de discutir quem "está certo", eles param pra listar os prós e contras técnicos de cada abordagem e decidem juntos qual encaixa melhor no projeto. Isso é um exemplo de quê?',
        options: [
          'Gestão de conflitos construtiva — focar no problema técnico, não em quem está certo',
          'Falta de liderança na equipe, já que ninguém decidiu sozinho o rumo a seguir',
          'Um conflito destrutivo que já deveria ter sido evitado desde o início',
          'Colaboração comum entre os dois devs, sem nenhuma relação com conflito'
        ],
        correctIndex: 0,
        explanation: 'Isso! Focar nos prós e contras técnicos do problema, em vez de em quem "está certo", é exatamente gestão de conflitos construtiva.'
      }
    },
    {
      story: '<b>Empatia</b> é se colocar no lugar do colega antes de julgar ou responder — praticar <b>escuta ativa</b>: ouvir de verdade o que a pessoa está dizendo, sem já estar pensando na sua resposta. Junto com isso vem a <b>flexibilidade</b>: estar aberto a mudar de ideia ou de plano quando a situação pede, sem se apegar demais à própria opinião inicial.',
      question: {
        prompt: 'Um colega reclama que uma tarefa está demorando mais que o esperado. Em vez de já rebater "mas era simples", a dev pergunta o que está travando e escuta a explicação completa antes de sugerir qualquer coisa. Isso é um exemplo de quê?',
        options: [
          'Empatia e escuta ativa — entender a perspectiva do colega antes de responder',
          'Gestão de conflitos, mesmo sem ter havido nenhum atrito real entre os dois',
          'Falta de liderança na equipe, porque ninguém está no comando da conversa',
          'Flexibilidade da equipe, mas sem nenhuma relação direta com escuta'
        ],
        correctIndex: 0,
        explanation: 'Isso mesmo! Ouvir a explicação completa antes de reagir, sem já rebater de cara, é a marca da empatia e da escuta ativa.'
      }
    },
    {
      story: 'Por fim, tudo isso se junta na <b>integração do trabalho colaborativo</b>: times ágeis mudam de prioridade com frequência, e um time maduro se adapta a isso com <b>flexibilidade</b>, mantendo a <b>comunicação</b> clara sobre o que mudou e por quê — em vez de só reclamar da mudança. Agora você já reconhece o que faz uma equipe colaborar bem: cooperação, liderança que apoia, conflitos bem conduzidos, empatia e flexibilidade!',
      question: {
        prompt: 'No meio de uma sprint, o cliente pede uma mudança de prioridade. Em vez de resistir, o time se reúne rapidamente, entende o motivo da mudança, comunica o novo plano pra todos e ajusta o trabalho. Isso é um exemplo de quê?',
        options: [
          'Flexibilidade e comunicação integradas ao trabalho colaborativo da equipe',
          'Falta de planejamento da equipe, que não previu essa mudança de prioridade',
          'Um conflito mal resolvido entre o time e o cliente sobre prioridades',
          'Liderança autoritária impondo a mudança pro time sem nenhuma explicação'
        ],
        correctIndex: 0,
        explanation: 'Perfeito! Adaptar o plano com flexibilidade e comunicar claramente o motivo da mudança pra todo o time é exatamente integração do trabalho colaborativo.'
      }
    },
    {
      story: 'Times ágeis costumam fazer <b>retrospectivas</b>: encontros periódicos onde o time para pra refletir sobre o que funcionou bem e o que travou no período, dando <b>feedback aberto</b> sobre o processo — não sobre pessoas — pra ajustar o próximo ciclo de trabalho.',
      question: {
        prompt: 'Ao final de cada sprint, o time se reúne pra listar o que funcionou bem e o que atrapalhou, sem apontar culpados, só focando em ajustar o processo pro próximo ciclo. Que prática de trabalho em equipe é essa?',
        options: [
          'Retrospectiva com feedback aberto sobre o processo',
          'Gestão de conflitos, porque alguém foi apontado como culpado',
          'Liderança autoritária definindo sozinha o que vai mudar',
          'Só uma reunião comum, sem relação com colaboração de equipe'
        ],
        correctIndex: 0,
        explanation: 'Isso! Refletir periodicamente sobre o processo (não sobre culpados) e ajustar o próximo ciclo é a essência da retrospectiva com feedback aberto.'
      }
    },
    {
      story: 'Quando um time cresce, ficar sem <b>papéis claros</b> gera retrabalho: duas pessoas mexendo na mesma parte sem saber, ou uma tarefa importante que ninguém assumiu. Definir quem é responsável por qual frente — mesmo que todos colaborem no restante — evita esse tipo de atrito.',
      question: {
        prompt: 'Num time de 5 devs, dois deles mexeram na mesma função ao mesmo tempo sem saber, gerando conflito no código. Depois disso, o time passa a definir claramente quem cuida de qual módulo antes de começar a sprint. Que prática está sendo adotada?',
        options: [
          'Definição clara de papéis e responsabilidades no time',
          'Gestão de conflitos depois que o problema já aconteceu, sem prevenção',
          'Falta de colaboração entre os devs do time',
          'Liderança autoritária impondo tarefas sem consulta'
        ],
        correctIndex: 0,
        explanation: 'Exato! Definir com clareza quem é responsável por qual frente do projeto evita retrabalho e conflitos de quem mexeu em quê — isso é definição de papéis.'
      }
    },
    {
      story: 'Colaboração também aparece na <b>mentoria</b>: um dev mais experiente dedica tempo pra ensinar e revisar o trabalho de alguém mais júnior, não porque é obrigado, mas porque isso fortalece o time inteiro no longo prazo.',
      question: {
        prompt: 'Uma dev sênior reserva uma hora por semana pra revisar o código de um colega júnior junto com ele, explicando o porquê de cada sugestão, em vez de só corrigir sozinha e mandar de volta. Isso é um exemplo de quê?',
        options: [
          'Mentoria — colaboração fortalecendo o crescimento do time no longo prazo',
          'Gestão de conflitos entre os dois devs',
          'Liderança autoritária corrigindo sem explicar nada',
          'Uma tarefa qualquer, sem relação com colaboração de equipe'
        ],
        correctIndex: 0,
        explanation: 'Isso! Dedicar tempo pra ensinar e explicar, não só corrigir, é mentoria — uma forma de colaboração que fortalece o time no longo prazo.'
      }
    },
    {
      story: 'Times distribuídos em fusos horários diferentes não podem contar só com reuniões ao vivo. <b>Comunicação assíncrona</b> — documentar decisões por escrito, deixar contexto claro numa mensagem, sem esperar resposta imediata — garante que todo mundo se atualize no próprio horário, sem travar o trabalho dos outros.',
      question: {
        prompt: 'Um time com devs no Brasil e em Portugal documenta cada decisão técnica importante num canal escrito, com contexto completo, em vez de depender só de reuniões ao vivo que nem todo mundo consegue acompanhar. Que prática de equipe é essa?',
        options: [
          'Comunicação assíncrona bem documentada',
          'Falta de comunicação entre os times',
          'Gestão de conflitos por causa do fuso horário',
          'Liderança centralizando toda decisão sozinha'
        ],
        correctIndex: 0,
        explanation: 'Isso mesmo! Documentar decisões por escrito, com contexto completo, pra quem não estava na hora, é comunicação assíncrona bem feita.'
      }
    },
    {
      story: 'Por fim, <b>reconhecer publicamente</b> o bom trabalho de um colega — e não só apontar erros — fortalece a colaboração: motiva quem foi reconhecido e mostra pro resto do time que esforço extra é notado, criando um ambiente mais colaborativo. Agora você já conhece várias facetas do trabalho em equipe: retrospectiva, papéis claros, mentoria, comunicação assíncrona e reconhecimento!',
      question: {
        prompt: 'Num daily, o líder técnico menciona publicamente que um dev resolveu um bug difícil sozinho durante o fim de semana, agradecendo o esforço na frente de todo o time. Que efeito essa atitude tende a gerar na equipe?',
        options: [
          'Fortalece a colaboração, motivando quem foi reconhecido e o resto do time',
          'Gera conflito, porque só uma pessoa foi mencionada',
          'Nenhum efeito relevante no time',
          'Enfraquece a liderança, porque ele elogiou em vez de cobrar mais'
        ],
        correctIndex: 0,
        explanation: 'Perfeito! Reconhecer publicamente o esforço de um colega motiva quem foi reconhecido e reforça uma cultura colaborativa em todo o time.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Jogos — Trabalho em Equipe e Colaboração',
      subtitle: 'Aula Teórica · Trilha Trabalho em Equipe e Colaboração · Turma Jogos Digitais',
      capacidade: 'Atuar em equipes de forma colaborativa.',
      steps: STEPS,
      fileName: 'mundo-equipe-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Prática — Central do Mundo do Trabalho: Trabalho em Equipe" no Portal de Aulas para os alunos resolverem os pareceres de verdade.'
    });
  };

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Jogos — Trabalho em Equipe e Colaboração',
      subtitle: 'Aula Teórica · Trilha Trabalho em Equipe e Colaboração · Turma Jogos Digitais',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'mundo-equipe-teoria-gabarito.txt'
    });
  };

  const role = urlParams.get('role') || 'aluno';
  const btnGenSlides = document.getElementById('btnGenSlides');
  if (role === 'professor') {
    btnGenSlides.style.display = 'inline-block';
    btnGenSlides.addEventListener('click', () => {
      btnGenSlides.disabled = true;
      btnGenSlides.textContent = '⏳ Gerando...';
      setTimeout(() => {
        window.generateSlidesForGestao();
        btnGenSlides.disabled = false;
        btnGenSlides.textContent = '🖨️ Gerar Slides (PPTX)';
      }, 50);
    });
  }

  const storyWrap = document.getElementById('storyWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const lblStepTotal = document.getElementById('lblStepTotal');
  const progressFill = document.getElementById('progressFill');

  lblStepTotal.textContent = STEPS.length;

  function loadProgress() {
    try {
      return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
    } catch (e) {
      return null;
    }
  }

  function saveProgress(data) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(data));
  }

  const ORDER_KEY = PROGRESS_KEY.replace('_progress_', '_order_');

  function shuffleOrder() {
    const arr = STEPS.map((_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function loadOrder() {
    try {
      const parsed = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
      if (Array.isArray(parsed) && parsed.length === STEPS.length && parsed.every(n => Number.isInteger(n) && n >= 0 && n < STEPS.length)) {
        return parsed;
      }
    } catch (e) {}
    return null;
  }

  const saved = loadProgress();
  let stepOrder = (saved && !saved.completed) ? (loadOrder() || shuffleOrder()) : shuffleOrder();
  localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
  let currentStepIndex = (saved && !saved.completed) ? Math.min(saved.lastStepIndex || 0, STEPS.length - 1) : 0;
  let correctCount = (saved && typeof saved.correctCount === 'number') ? saved.correctCount : 0;

  function updateProgressBar() {
    const pct = Math.round(((currentStepIndex) / STEPS.length) * 100);
    progressFill.style.width = pct + '%';
    lblStepNum.textContent = Math.min(currentStepIndex + 1, STEPS.length);
  }

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity('mundo_equipe_teoria', label, {
        step: currentStepIndex + 1,
        total: STEPS.length,
        correctCount: correctCount
      });
    }
  }

  function renderStory() {
    updateProgressBar();
    const step = STEPS[stepOrder[currentStepIndex]];
    reportStep(`Jogos — Trabalho em Equipe — Etapa ${currentStepIndex + 1}/${STEPS.length}`);

    storyWrap.innerHTML = '';

    const row = document.createElement('div');
    row.className = 'bit-row';
    row.innerHTML = `
      <div class="bit-avatar">🤖</div>
      <div class="speech-bubble">
        <span class="bit-name">Bit, Assistente de Indústria 4.0</span>
        ${step.story}
      </div>
    `;
    storyWrap.appendChild(row);

    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.innerHTML = `<button class="btn" id="btnNext">Próximo →</button>`;
    storyWrap.appendChild(actions);

    document.getElementById('btnNext').addEventListener('click', renderQuestion);
  }

  function renderQuestion() {
    const step = STEPS[stepOrder[currentStepIndex]];
    const q = step.question;

    storyWrap.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2>❓ ${q.prompt}</h2>`;

    const optionsWrap = document.createElement('div');
    const letters = ['A', 'B', 'C', 'D'];
    let answered = false;

    const order = q.options.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    const correctPos = order.indexOf(q.correctIndex);

    order.forEach((origIdx, pos) => {
      const optText = q.options[origIdx];
      const opt = document.createElement('div');
      opt.className = 'option';
      opt.innerHTML = `<span class="opt-letter">${letters[pos]}</span><span>${optText}</span>`;
      opt.addEventListener('click', () => {
        if (answered) return;
        answered = true;
        selectAnswer(pos);
      });
      optionsWrap.appendChild(opt);

      function selectAnswer(chosenIdx) {
        const allOptionEls = optionsWrap.querySelectorAll('.option');
        allOptionEls.forEach(el => el.classList.add('disabled'));

        const isCorrect = chosenIdx === correctPos;
        allOptionEls[chosenIdx].classList.add(isCorrect ? 'correct' : 'incorrect');
        if (!isCorrect) {
          allOptionEls[correctPos].classList.add('correct');
        }
        if (isCorrect) correctCount++;

        const feedback = document.createElement('div');
        feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
        feedback.innerHTML = isCorrect
          ? `✅ Correto! ${q.explanation}`
          : `❌ Não foi dessa vez. A resposta certa é "<b>${q.options[q.correctIndex]}</b>": ${q.explanation.replace(/^(Isso mesmo!|Isso!|Correto!|Exato!|Perfeito!|Correta!)\s*/i, '')}`;
        card.appendChild(feedback);

        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.style.marginTop = '14px';
        actions.innerHTML = `<button class="btn" id="btnNextAfterAnswer">Próximo →</button>`;
        card.appendChild(actions);

        saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
        reportStep(`Jogos — Trabalho em Equipe — Etapa ${currentStepIndex + 1}/${STEPS.length} (respondida)`);

        document.getElementById('btnNextAfterAnswer').addEventListener('click', () => {
          currentStepIndex++;
          if (currentStepIndex >= STEPS.length) {
            finishJourney();
          } else {
            saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
            renderStory();
          }
        });
      }
    });

    card.appendChild(optionsWrap);
    storyWrap.innerHTML = '';
    storyWrap.appendChild(card);
  }

  function finishJourney(reviewOnly) {
    const pct = STEPS.length > 0 ? Math.round((correctCount / STEPS.length) * 100) : 0;
    const passed = reviewOnly ? true : pct >= 80;
    if (!reviewOnly) {
      saveProgress({ lastStepIndex: STEPS.length, correctCount, completed: passed });
      reportStep(`Jogos — Trabalho em Equipe — ${passed ? 'Concluída' : 'Não concluída'} (${correctCount}/${STEPS.length})`);
    }

    progressFill.style.width = '100%';
    lblStepNum.textContent = STEPS.length;

    storyWrap.innerHTML = passed ? `
      <div class="card finish-screen">
        <div class="trophy">🏆</div>
        <h2>Trabalho em Equipe concluído!</h2>
        <p>Você já reconhece o que faz uma equipe colaborar bem: cooperação de verdade, liderança que apoia, conflitos conduzidos de forma construtiva, empatia com escuta ativa e flexibilidade diante de mudanças.</p>
        <div class="score">Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%).</div>
        <p>Agora é hora de colocar a mão na massa: volte à trilha e abra o módulo de prática da Central do Mundo do Trabalho.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn btn-secondary" id="btnRestart">🔁 Rever a teoria</button>
        </div>
      </div>
    ` : `
      <div class="card finish-screen">
        <div class="trophy">📚</div>
        <h2>Quase lá!</h2>
        <p>Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%) — é preciso pelo menos 80% de acerto para concluir esta atividade.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn" id="btnRestart">🔁 Tentar novamente</button>
        </div>
      </div>
    `;

    document.getElementById('btnRestart').addEventListener('click', () => {
      currentStepIndex = 0;
      correctCount = 0;
      stepOrder = shuffleOrder();
      localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
      saveProgress({ lastStepIndex: 0, correctCount: 0, completed: false });
      renderStory();
    });
  }

  if (saved && saved.completed) {
    currentStepIndex = STEPS.length;
    finishJourney(true);
  } else {
    renderStory();
  }
</script>
