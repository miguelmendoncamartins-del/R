<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Ambiente e Ferramentas de Dev de Jogos: Teoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d0a; --panel:#10140f; --panel2:#0d110c; --line:#223022;
    --green:#7cff3f; --green-dim:#4a9a2a; --blood:#c1121f; --blood-bright:#ff3b30;
    --yellow:#d4c86a; --ink:#d9e6d2; --ink-dim:#6f8368;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--green-dim); background:#050805;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(124,255,63,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--green); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .eri-row{ display:flex; align-items:flex-start; gap:12px; }
  .eri-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(124,255,63,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--green-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .eri-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--green);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble code{ color:var(--yellow); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--yellow); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--green-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--green); background:rgba(124,255,63,0.08); }
  .option.correct .opt-letter{ border-color:var(--green); color:var(--green); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--green); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--yellow); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--green); color:#04220a; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--green); border:1px solid var(--green-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--green); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--yellow); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--green); border:1px solid var(--green-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(124,255,63,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'fund_ambiente_teoria';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/vendor/pptxgen.bundle.js"></script>
<script src="../../../shared/slides-generator.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>JOGOS — AMBIENTE E FERRAMENTAS (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">6</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `fund_ambiente_teoria_progress_${username}`;

  const STEPS = [
    {
      story: 'Olá de novo! Eu sou o <b>Eri</b>, guardião do oceano de código. Antes de nadar em qualquer linguagem, todo desenvolvedor de jogos precisa montar seu "aquário de trabalho": o <b>ambiente de desenvolvimento</b>. Um jogo digital 2D nasce da junção entre <b>código</b> (a lógica que faz tudo se mexer), <b>assets</b> (sprites, sons, cenários) e um <b>motor/engine</b> que junta as duas coisas na tela.',
      question: {
        prompt: 'Além da arte (sprites, sons, cenários), o que mais é essencial pra um jogo digital 2D funcionar de verdade?',
        options: [
          'Código — a lógica de programação que faz os elementos reagir e se mexer',
          'Só a arte já é suficiente, o resto o computador resolve sozinho',
          'Apenas um nome criativo pro jogo',
          'Nada além do design das telas'
        ],
        correctIndex: 0,
        explanation: 'Isso! Sem código, os sprites ficam parados na tela — é a lógica de programação que dá vida e reação aos elementos do jogo.'
      }
    },
    {
      story: 'Antes de escrever a primeira linha, é preciso <b>instalar e configurar o ambiente de desenvolvimento</b>: a engine (ou framework), o SDK da linguagem escolhida e as variáveis de ambiente que dizem ao sistema operacional onde encontrar essas ferramentas. Pular essa etapa é como tentar nadar sem água — nada funciona.',
      question: {
        prompt: 'Um colega abre o terminal, digita o comando da engine e recebe "comando não reconhecido". Qual é a causa mais provável?',
        options: [
          'O ambiente de desenvolvimento não foi instalado/configurado corretamente (falta o SDK ou variável de ambiente)',
          'O computador dele está com o teclado com defeito',
          'Ele digitou o comando rápido demais',
          'Isso é normal e não indica nenhum problema'
        ],
        correctIndex: 0,
        explanation: 'Exato! "Comando não reconhecido" costuma significar que a ferramenta não está instalada ou que o sistema não sabe onde encontrá-la (variável de ambiente/PATH mal configurada).'
      }
    },
    {
      story: 'Com o ambiente pronto, entram as <b>ferramentas de desenvolvimento de jogos</b>: as <b>engines</b> (como Godot, Unity ou Unreal) já trazem prontos o sistema de renderização, física e áudio, poupando você de reinventar tudo isso do zero a cada projeto novo.',
      question: {
        prompt: 'Por que a maioria dos estúdios de jogos usa uma engine em vez de programar renderização, física e áudio do zero pra cada jogo novo?',
        options: [
          'Porque a engine já resolve essas partes complexas, deixando o time focado na lógica e no design do próprio jogo',
          'Porque é proibido programar esses sistemas por conta própria',
          'Porque engines são sempre gratuitas e sem código nenhum',
          'Porque isso deixa o jogo mais lento de propósito'
        ],
        correctIndex: 0,
        explanation: 'Isso! Engines poupam um trabalho enorme de infraestrutura (renderização, física, áudio) que já vem pronta e testada — o time foca no que faz o jogo ser único.'
      }
    },
    {
      story: 'Dentro do fluxo diário, dois papéis não se confundem: o <b>editor de código</b> é onde você escreve e organiza o texto do programa (com destaque de sintaxe, autocomplete etc); o <b>compilador</b> (ou interpretador) é quem de fato transforma esse texto em algo que a máquina executa — e é ele quem aponta erros de sintaxe.',
      question: {
        prompt: 'Você escreveu um código com um erro de sintaxe, mas o editor de texto não avisou nada — só quando tentou RODAR o jogo é que apareceu uma mensagem de erro. Por que isso acontece?',
        options: [
          'Porque quem verifica se o código realmente funciona é o compilador/interpretador, não o editor de texto sozinho',
          'Porque o editor de código está quebrado',
          'Porque erros de sintaxe não existem em jogos',
          'Porque o computador precisa ser reiniciado sempre'
        ],
        correctIndex: 0,
        explanation: 'Correto! O editor ajuda a escrever, mas é o compilador/interpretador que efetivamente processa o código e revela se ele está correto ao ser executado.'
      }
    },
    {
      story: 'Cada <b>plataforma de jogo</b> tende a favorecer certas <b>linguagens de programação</b>: C# é a linguagem padrão da engine Unity, GDScript é a linguagem própria da Godot, C++ domina engines de alta performance como a Unreal, e JavaScript é comum em jogos que rodam direto no navegador.',
      question: {
        prompt: 'Um time vai lançar um jogo 2D leve que precisa rodar direto no navegador do jogador, sem instalar nada. Qual linguagem combina melhor com essa plataforma?',
        options: [
          'JavaScript',
          'C++ voltado a engines de alta performance offline',
          'Uma linguagem qualquer, a plataforma não interfere na escolha',
          'Nenhuma linguagem roda em navegador'
        ],
        correctIndex: 0,
        explanation: 'Isso! JavaScript é a linguagem nativa dos navegadores — ideal quando o jogo precisa rodar direto ali, sem instalação.'
      }
    },
    {
      story: 'Por fim, além da engine em si, existem <b>bibliotecas</b> específicas para desenvolvimento de jogos 2D — pacotes prontos de código para física de colisão, animação de sprites ou sistemas de partículas, por exemplo — que você importa no projeto em vez de escrever do zero. Agora você já conhece o "aquário" completo: ambiente, ferramentas, editor/compilador, linguagem certa pra cada plataforma e bibliotecas de apoio!',
      question: {
        prompt: 'Uma desenvolvedora precisa de um sistema de partículas (poeira, fumaça, faíscas) pro jogo dela e não quer escrever esse sistema do zero. O que ela deve buscar?',
        options: [
          'Uma biblioteca pronta de efeitos/partículas para jogos 2D',
          'Reinstalar o sistema operacional',
          'Trocar de linguagem de programação',
          'Desistir do efeito, pois não existe forma de reaproveitar código pronto'
        ],
        correctIndex: 0,
        explanation: 'Exato! Bibliotecas prontas evitam reinventar a roda — é só integrar ao projeto o pacote de código já testado para aquele efeito.'
      }
    },
    {
      story: 'Mas o oceano de código não para no básico! Nem toda engine serve pra todo jogo: engines voltadas a mundos 3D pesados (com iluminação avançada, física complexa) trazem uma bagagem de aprendizado e configuração muito maior do que o necessário pra um jogo 2D casual — escolher a ferramenta do tamanho certo do projeto poupa tempo e dor de cabeça.',
      question: {
        prompt: 'Uma equipe quer fazer um jogo 2D casual simples e escolhe uma engine pesada, voltada a mundos 3D de alta performance. O que é mais provável de acontecer?',
        options: [
          'O tempo gasto aprendendo e configurando a engine fica desproporcional à complexidade real do projeto',
          'Não faz diferença nenhuma, toda engine é igualmente simples pra qualquer projeto',
          'O jogo automaticamente vira 3D mesmo sendo pensado como 2D',
          'É proibido usar uma engine 3D pra fazer jogos 2D'
        ],
        correctIndex: 0,
        explanation: 'Isso! A engine certa é a que combina com o tamanho e a complexidade do projeto — usar uma ferramenta pesada demais só adiciona aprendizado e configuração desnecessários.'
      }
    },
    {
      story: 'Voltando às variáveis de ambiente: elas não servem só pra "achar" uma ferramenta — quando existe MAIS de uma versão instalada de uma engine ou SDK, é a ordem das pastas na variável PATH que decide qual versão o terminal encontra primeiro. Instalar uma versão nova não apaga a antiga automaticamente!',
      question: {
        prompt: 'Um desenvolvedor instala a versão nova de uma engine, mas o terminal insiste em rodar a versão antiga, como se a nova nem existisse. O que provavelmente está acontecendo?',
        options: [
          'A variável de ambiente PATH ainda aponta primeiro pra pasta da versão antiga',
          'A engine nova sempre substitui a antiga automaticamente, então o problema é outro',
          'O terminal escolhe a versão aleatoriamente a cada execução',
          'É necessário formatar o computador pra resolver'
        ],
        correctIndex: 0,
        explanation: 'Exato! Com mais de uma versão instalada, quem decide qual é encontrada primeiro é a ordem das pastas na variável PATH — a versão antiga pode continuar "na frente" mesmo com a nova instalada.'
      }
    },
    {
      story: 'O editor de código também pode crescer com você: <b>extensões</b> como as de autocomplete (sugestão automática de código enquanto você digita) tornam a escrita muito mais rápida. Mas atenção — isso é um reforço do EDITOR, continua sendo o compilador/interpretador quem de fato valida se aquele código funciona.',
      question: {
        prompt: 'Uma desenvolvedora quer parar de digitar cada função inteira na mão e receber sugestões automáticas de código enquanto escreve. O que ela deve buscar?',
        options: [
          'Instalar uma extensão de autocomplete/IntelliSense no editor de código',
          'Trocar o compilador da engine por um mais rápido',
          'Isso só é possível reescrevendo o sistema operacional',
          'Não existe forma de acelerar a escrita de código'
        ],
        correctIndex: 0,
        explanation: 'Isso! Extensões de autocomplete são recursos do editor que sugerem código automaticamente — poupando digitação, mas sem substituir o papel do compilador na validação.'
      }
    },
    {
      story: 'Por fim, um ponto que confunde muita gente: instalar a <b>engine</b> não é o mesmo que instalar o <b>SDK</b> da linguagem escolhida. O SDK é o conjunto de ferramentas que efetivamente compila/executa código naquela linguagem — sem ele, mesmo com a engine instalada, o projeto não compila.',
      question: {
        prompt: 'Um aluno instala a engine certinho, mas o projeto não compila e aparece uma mensagem dizendo que a linguagem escolhida não foi encontrada no ambiente. O que provavelmente falta?',
        options: [
          'Instalar e configurar o SDK da linguagem de programação escolhida, separado da engine',
          'Reinstalar a engine do zero, ela deve estar corrompida',
          'Trocar de computador',
          'Isso é normal, engines nunca precisam de SDK'
        ],
        correctIndex: 0,
        explanation: 'Exato! A engine e o SDK da linguagem são peças diferentes do ambiente — a engine organiza o projeto, mas é o SDK que compila/executa o código daquela linguagem específica.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Jogos — Ambiente e Ferramentas de Desenvolvimento',
      subtitle: 'Aula Teórica · Trilha Ambiente e Ferramentas de Desenvolvimento · Turma Jogos Digitais',
      capacidade: 'Reconhecer os procedimentos de preparação de ambiente de programação / Reconhecer as diferentes linguagens de programação utilizadas conforme a plataforma do jogo a ser produzido.',
      steps: STEPS,
      fileName: 'fund-ambiente-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Prática — Central de Suporte: Ambiente e Ferramentas" no Portal de Aulas para os alunos resolverem chamados de verdade.'
    });
  };

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Jogos — Ambiente e Ferramentas de Desenvolvimento',
      subtitle: 'Aula Teórica · Trilha Ambiente e Ferramentas de Desenvolvimento · Turma Jogos Digitais',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'fund-ambiente-teoria-gabarito.txt'
    });
  };

  const role = urlParams.get('role') || 'aluno';
  const btnGenSlides = document.getElementById('btnGenSlides');
  if (role === 'professor') {
    btnGenSlides.style.display = 'inline-block';
    btnGenSlides.addEventListener('click', () => {
      btnGenSlides.disabled = true;
      btnGenSlides.textContent = '⏳ Gerando...';
      setTimeout(() => {
        window.generateSlidesForGestao();
        btnGenSlides.disabled = false;
        btnGenSlides.textContent = '🖨️ Gerar Slides (PPTX)';
      }, 50);
    });
  }

  const storyWrap = document.getElementById('storyWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const lblStepTotal = document.getElementById('lblStepTotal');
  const progressFill = document.getElementById('progressFill');

  lblStepTotal.textContent = STEPS.length;

  function loadProgress() {
    try {
      return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
    } catch (e) {
      return null;
    }
  }

  function saveProgress(data) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(data));
  }

  const ORDER_KEY = PROGRESS_KEY.replace('_progress_', '_order_');

  function shuffleOrder() {
    const arr = STEPS.map((_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function loadOrder() {
    try {
      const parsed = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
      if (Array.isArray(parsed) && parsed.length === STEPS.length && parsed.every(n => Number.isInteger(n) && n >= 0 && n < STEPS.length)) {
        return parsed;
      }
    } catch (e) {}
    return null;
  }

  const saved = loadProgress();
  let stepOrder = (saved && !saved.completed) ? (loadOrder() || shuffleOrder()) : shuffleOrder();
  localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
  let currentStepIndex = (saved && !saved.completed) ? Math.min(saved.lastStepIndex || 0, STEPS.length - 1) : 0;
  let correctCount = (saved && typeof saved.correctCount === 'number') ? saved.correctCount : 0;

  function updateProgressBar() {
    const pct = Math.round(((currentStepIndex) / STEPS.length) * 100);
    progressFill.style.width = pct + '%';
    lblStepNum.textContent = Math.min(currentStepIndex + 1, STEPS.length);
  }

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity('fund_ambiente_teoria', label, {
        step: currentStepIndex + 1,
        total: STEPS.length,
        correctCount: correctCount
      });
    }
  }

  function renderStory() {
    updateProgressBar();
    const step = STEPS[stepOrder[currentStepIndex]];
    reportStep(`Jogos — Ambiente e Ferramentas — Etapa ${currentStepIndex + 1}/${STEPS.length}`);

    storyWrap.innerHTML = '';

    const row = document.createElement('div');
    row.className = 'eri-row';
    row.innerHTML = `
      <div class="eri-avatar">🦈</div>
      <div class="speech-bubble">
        <span class="eri-name">Eri, o Guardião do Oceano de Código</span>
        ${step.story}
      </div>
    `;
    storyWrap.appendChild(row);

    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.innerHTML = `<button class="btn" id="btnNext">Próximo →</button>`;
    storyWrap.appendChild(actions);

    document.getElementById('btnNext').addEventListener('click', renderQuestion);
  }

  function renderQuestion() {
    const step = STEPS[stepOrder[currentStepIndex]];
    const q = step.question;

    storyWrap.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2>❓ ${q.prompt}</h2>`;

    const optionsWrap = document.createElement('div');
    const letters = ['A', 'B', 'C', 'D'];
    let answered = false;

    const order = q.options.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    const correctPos = order.indexOf(q.correctIndex);

    order.forEach((origIdx, pos) => {
      const optText = q.options[origIdx];
      const opt = document.createElement('div');
      opt.className = 'option';
      opt.innerHTML = `<span class="opt-letter">${letters[pos]}</span><span>${optText}</span>`;
      opt.addEventListener('click', () => {
        if (answered) return;
        answered = true;
        selectAnswer(pos);
      });
      optionsWrap.appendChild(opt);

      function selectAnswer(chosenIdx) {
        const allOptionEls = optionsWrap.querySelectorAll('.option');
        allOptionEls.forEach(el => el.classList.add('disabled'));

        const isCorrect = chosenIdx === correctPos;
        allOptionEls[chosenIdx].classList.add(isCorrect ? 'correct' : 'incorrect');
        if (!isCorrect) {
          allOptionEls[correctPos].classList.add('correct');
        }
        if (isCorrect) correctCount++;

        const feedback = document.createElement('div');
        feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
        feedback.innerHTML = isCorrect
          ? `✅ Correto! ${q.explanation}`
          : `❌ Não foi dessa vez. A resposta certa é "<b>${q.options[q.correctIndex]}</b>": ${q.explanation.replace(/^(Isso mesmo!|Isso!|Correto!|Exato!|Perfeito!|Correta!)\s*/i, '')}`;
        card.appendChild(feedback);

        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.style.marginTop = '14px';
        actions.innerHTML = `<button class="btn" id="btnNextAfterAnswer">Próximo →</button>`;
        card.appendChild(actions);

        saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
        reportStep(`Jogos — Ambiente e Ferramentas — Etapa ${currentStepIndex + 1}/${STEPS.length} (respondida)`);

        document.getElementById('btnNextAfterAnswer').addEventListener('click', () => {
          currentStepIndex++;
          if (currentStepIndex >= STEPS.length) {
            finishJourney();
          } else {
            saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
            renderStory();
          }
        });
      }
    });

    card.appendChild(optionsWrap);
    storyWrap.innerHTML = '';
    storyWrap.appendChild(card);
  }

  function finishJourney(reviewOnly) {
    const pct = STEPS.length > 0 ? Math.round((correctCount / STEPS.length) * 100) : 0;
    const passed = reviewOnly ? true : pct >= 80;
    if (!reviewOnly) {
      saveProgress({ lastStepIndex: STEPS.length, correctCount, completed: passed });
      reportStep(`Jogos — Ambiente e Ferramentas — ${passed ? 'Concluída' : 'Não concluída'} (${correctCount}/${STEPS.length})`);
    }

    progressFill.style.width = '100%';
    lblStepNum.textContent = STEPS.length;

    storyWrap.innerHTML = passed ? `
      <div class="card finish-screen">
        <div class="trophy">🏆</div>
        <h2>Ambiente e Ferramentas concluídos!</h2>
        <p>Você já reconhece o que compõe o ambiente de dev de jogos: instalação, engines, editor x compilador, linguagem por plataforma e bibliotecas de apoio.</p>
        <div class="score">Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%).</div>
        <p>Agora é hora de colocar a mão na massa: volte à trilha e abra o módulo de prática da Central de Suporte.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn btn-secondary" id="btnRestart">🔁 Rever a teoria</button>
        </div>
      </div>
    ` : `
      <div class="card finish-screen">
        <div class="trophy">📚</div>
        <h2>Quase lá!</h2>
        <p>Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%) — é preciso pelo menos 80% de acerto para concluir esta atividade.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn" id="btnRestart">🔁 Tentar novamente</button>
        </div>
      </div>
    `;

    document.getElementById('btnRestart').addEventListener('click', () => {
      currentStepIndex = 0;
      correctCount = 0;
      stepOrder = shuffleOrder();
      localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
      saveProgress({ lastStepIndex: 0, correctCount: 0, completed: false });
      renderStory();
    });
  }

  if (saved && saved.completed) {
    currentStepIndex = STEPS.length;
    finishJourney(true);
  } else {
    renderStory();
  }
</script>
