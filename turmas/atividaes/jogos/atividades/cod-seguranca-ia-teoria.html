<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Segurança no Código e IA com Grafos: Teoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d14; --panel:#10141f; --panel2:#0d101a; --line:#20283a;
    --blue:#5ec8ff; --blue-dim:#2f7aa8; --blood:#c1121f; --blood-bright:#ff3b30;
    --gold:#e0b84a; --ink:#dbe4f2; --ink-dim:#657388;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--blue-dim); background:#060810;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(94,200,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--blue); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .bia-row{ display:flex; align-items:flex-start; gap:12px; }
  .bia-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(94,200,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--blue-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .bia-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--blue);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble code{ color:var(--gold); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--gold); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--blue-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--blue); background:rgba(94,200,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--blue); color:var(--blue); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--blue); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--gold); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--blue); color:#04162a; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--blue); border:1px solid var(--blue-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--blue); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--gold); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--blue); border:1px solid var(--blue-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(94,200,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'cod_seguranca_ia_teoria';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/vendor/pptxgen.bundle.js"></script>
<script src="../../../shared/slides-generator.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>CODIFICAÇÃO — SEGURANÇA NO CÓDIGO E IA COM GRAFOS (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">5</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `cod_seguranca_ia_teoria_progress_${username}`;

  const STEPS = [
    {
      story: 'Oi! Eu sou a <b>Bia</b>, a joaninha debugger da PixelForge Studios. Hoje: <b>segurança no código</b>. Toda entrada do jogador (nome de usuário, texto de chat, valores digitados) deve passar por <b>validação de input</b> antes de ser usada — checar tipo, tamanho e conteúdo esperado. Sem isso, um jogador mal-intencionado pode tentar injetar comandos maliciosos disfarçados de texto comum.',
      question: {
        prompt: 'Antes de salvar o nome de usuário digitado no cadastro, o sistema verifica se ele tem um tamanho razoável e não contém caracteres suspeitos de comandos de banco de dados. Que prática de segurança é essa?',
        options: ['Validação de inputs do usuário, pra prevenir injeções maliciosas', 'Um trigger de multimídia disparado por ação', 'Renderização de sprites na tela do jogo', 'Um requisito não funcional de performance'],
        correctIndex: 0,
        explanation: 'Isso! Checar tipo, tamanho e conteúdo de uma entrada antes de usá-la é validação de input, prevenindo injeções maliciosas.'
      }
    },
    {
      story: 'Mudando de assunto: pra fazer NPCs (personagens não-jogáveis) se moverem de forma inteligente, jogos usam <b>grafos</b> — uma estrutura de <b>waypoints</b> (pontos de referência) conectados entre si, formando um mapa de caminhos possíveis pelo cenário.',
      question: {
        prompt: 'Um NPC guarda de patrulha se move entre pontos específicos do mapa, seguindo conexões pré-definidas entre esses pontos, em vez de andar livremente por qualquer lugar. Que estrutura de dados representa esses pontos conectados?',
        options: ['Grafo de waypoints', 'Árvore de decisão', 'Uma classe encapsulada', 'Um componente de saúde'],
        correctIndex: 0,
        explanation: 'Exato! Pontos de referência conectados entre si, formando um mapa de caminhos, são um grafo de waypoints.'
      }
    },
    {
      story: 'Uma vez que o grafo existe, é preciso um <b>algoritmo de busca</b> pra encontrar o melhor caminho entre dois pontos dentro dele — é assim que um NPC descobre a rota mais curta (ou mais segura) até o jogador, navegando pelo grafo de waypoints.',
      question: {
        prompt: 'Um NPC precisa descobrir o caminho mais curto entre sua posição atual e a posição do jogador, navegando pelos waypoints conectados do mapa. Que tipo de algoritmo resolve esse problema?',
        options: ['Um algoritmo de busca em grafos', 'Uma docstring explicando a função', 'Um trigger de áudio disparado', 'Uma variável de ambiente do sistema'],
        correctIndex: 0,
        explanation: 'Isso mesmo! Encontrar o melhor caminho entre dois pontos de um grafo é justamente o papel de um algoritmo de busca em grafos.'
      }
    },
    {
      story: 'Pra decidir <b>o que fazer</b> (não só pra onde ir), muitos NPCs usam <b>árvores de decisão</b>: uma sequência de condicionais aninhadas que checam o estado do jogo pra escolher uma ação — como "se ver o jogador, ataca; senão, patrulha".',
      question: {
        prompt: 'Um inimigo checa: "se o jogador estiver visível, ataca; senão, se ouvir um barulho, investiga; senão, continua patrulhando". Que estrutura de IA está sendo usada pra tomar essa decisão?',
        options: ['Árvore de decisão', 'Grafo de waypoints', 'Um framework de áudio', 'Validação de input'],
        correctIndex: 0,
        explanation: 'Perfeito! Uma sequência de condicionais aninhadas pra decidir uma ação com base no estado do jogo é uma árvore de decisão.'
      }
    },
    {
      story: 'Grafos (pra navegação) e árvores de decisão (pra tomar decisões) costumam trabalhar juntos numa <b>máquina de estado</b> simples: o NPC alterna entre estados como "Patrulhando", "Perseguindo" e "Atacando", cada um com seu próprio comportamento — e a árvore de decisão é o que decide quando trocar de estado. Agora você já reconhece validação de inputs, grafos de waypoints, algoritmos de busca, árvores de decisão e máquinas de estado!',
      question: {
        prompt: 'Um NPC começa no estado "Patrulhando", muda pra "Perseguindo" quando vê o jogador, e muda pra "Atacando" quando chega perto o suficiente — cada estado com um comportamento próprio. Que conceito de IA organiza esses estados e transições?',
        options: ['Máquina de estado', 'Validação de input', 'Pipeline de renderização', 'Encapsulamento de classe'],
        correctIndex: 0,
        explanation: 'Isso! Organizar comportamentos em estados distintos, com transições entre eles, é justamente uma máquina de estado.'
      }
    },
    {
      story: 'Validar input não é só checar se o campo está vazio: também é checar o <b>tipo de dado</b> esperado. Um campo de "idade" deve aceitar apenas números — se o sistema aceitar um texto qualquer ali sem verificar, pode gerar erros inesperados (ou brechas de segurança) mais adiante no código.',
      question: {
        prompt: 'Um formulário de cadastro tem um campo "idade" que deveria aceitar só números, mas o sistema aceita texto solto ali sem checar nada. Que tipo de validação está faltando nesse campo?',
        options: ['Validação de tipo de dado — checar se o valor é realmente um número', 'Um algoritmo de busca em grafos', 'Uma máquina de estado', 'Um trigger de colisão'],
        correctIndex: 0,
        explanation: 'Isso! Checar se o dado enviado é do tipo esperado (número, nesse caso) também faz parte da validação de input.'
      }
    },
    {
      story: 'Nem todo caminho num grafo de waypoints tem o mesmo "custo": alguns trechos podem ser mais longos, mais lentos (terreno difícil) ou mais perigosos. Quando o grafo tem esses <b>pesos</b> nas conexões, o algoritmo de busca não procura só QUALQUER caminho — procura o de <b>menor custo total</b>.',
      question: {
        prompt: 'Num grafo de waypoints, o caminho A é mais curto em distância, mas atravessa lava (custo alto); o caminho B é mais longo, mas seguro (custo baixo). Um algoritmo de busca que considera pesos escolhe qual caminho?',
        options: ['O de menor custo total, que pode não ser o mais curto em distância', 'Sempre o caminho fisicamente mais curto, ignorando o risco', 'Um caminho aleatório entre os dois', 'Nenhum dos dois — o NPC fica parado'],
        correctIndex: 0,
        explanation: 'Exato! Quando as conexões do grafo têm peso, o algoritmo busca o menor custo total, não necessariamente a menor distância.'
      }
    },
    {
      story: 'Árvores de decisão podem ter várias condições em cascata, e a <b>ordem</b> delas importa: a condição checada primeiro tem prioridade. Um inimigo pode checar primeiro "vida baixa?" antes mesmo de checar "vê o jogador?" — porque fugir pra sobreviver é mais urgente que atacar.',
      question: {
        prompt: 'Um inimigo checa PRIMEIRO se sua vida está baixa (e foge, se estiver) e só DEPOIS checa se vê o jogador (pra atacar). O que essa ordem de condições revela sobre a prioridade do comportamento?',
        options: ['Sobreviver (fugir com vida baixa) tem prioridade mais alta que atacar o jogador', 'A ordem das condições numa árvore de decisão nunca importa', 'O inimigo está com bug, porque deveria atacar sempre primeiro', 'Isso não é uma árvore de decisão, e sim um grafo de waypoints'],
        correctIndex: 0,
        explanation: 'Isso mesmo! Numa árvore de decisão, a condição checada primeiro tem prioridade — aqui, sobreviver vem antes de atacar.'
      }
    },
    {
      story: 'Máquinas de estado podem ter mais de três estados. Além de Patrulhando/Perseguindo/Atacando, é comum adicionar um estado <b>Fugindo</b>: quando a vida do NPC fica baixa durante um combate, ele transiciona pra esse novo estado, priorizando sobrevivência sobre o ataque.',
      question: {
        prompt: 'Durante o estado "Atacando", a vida do NPC cai abaixo de 20%, e ele transiciona automaticamente pro estado "Fugindo", parando de atacar. O que provocou essa transição de estado?',
        options: ['Uma condição de vida baixa, definida na máquina de estado, disparou a transição pro novo estado', 'O grafo de waypoints foi apagado do jogo', 'Um trigger de colisão com uma moeda', 'A validação de input do nome do jogador falhou'],
        correctIndex: 0,
        explanation: 'Correto! Máquinas de estado reagem a condições do jogo (como vida baixa) pra decidir quando transicionar entre estados — aqui, de Atacando pra Fugindo.'
      }
    },
    {
      story: 'Por fim, um cuidado essencial de segurança: validar dados só no <b>cliente</b> (no computador do jogador) não é suficiente, porque um jogador mal-intencionado pode burlar essa checagem. É preciso validar novamente no <b>servidor</b>, que é quem realmente controla e confia (ou não) nos dados recebidos.',
      question: {
        prompt: 'Um jogo só valida o nome de usuário no navegador do jogador (client-side), sem checar de novo no servidor. Por que isso é uma falha de segurança?',
        options: ['Um jogador mal-intencionado pode burlar a validação do cliente e enviar dados inválidos direto pro servidor', 'Validação no cliente já é suficiente e nunca precisa ser repetida', 'O servidor não tem capacidade de validar nenhum dado', 'Isso só seria um problema se o jogo fosse offline'],
        correctIndex: 0,
        explanation: 'Isso! A validação no cliente pode ser burlada — por isso o servidor, que realmente controla os dados, precisa validar de novo.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Codificação de Jogos — Segurança no Código e IA com Grafos',
      subtitle: 'Aula Teórica · Trilha Segurança no Código e IA com Grafos · Turma Jogos Digitais',
      capacidade: 'Aplicar boas práticas de segurança da informação no código / Aplicar estruturas de dados avançadas (Grafos e Árvores de Decisão) para lógica e IA.',
      steps: STEPS,
      fileName: 'cod-seguranca-ia-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Prática — Central de Codificação: Segurança no Código e IA com Grafos" no Portal de Aulas para os alunos resolverem os pareceres de verdade.'
    });
  };

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Codificação de Jogos — Segurança no Código e IA com Grafos',
      subtitle: 'Aula Teórica · Trilha Segurança no Código e IA com Grafos · Turma Jogos Digitais',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'cod-seguranca-ia-teoria-gabarito.txt'
    });
  };

  const role = urlParams.get('role') || 'aluno';
  const btnGenSlides = document.getElementById('btnGenSlides');
  if (role === 'professor') {
    btnGenSlides.style.display = 'inline-block';
    btnGenSlides.addEventListener('click', () => {
      btnGenSlides.disabled = true;
      btnGenSlides.textContent = '⏳ Gerando...';
      setTimeout(() => {
        window.generateSlidesForGestao();
        btnGenSlides.disabled = false;
        btnGenSlides.textContent = '🖨️ Gerar Slides (PPTX)';
      }, 50);
    });
  }

  const storyWrap = document.getElementById('storyWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const lblStepTotal = document.getElementById('lblStepTotal');
  const progressFill = document.getElementById('progressFill');

  lblStepTotal.textContent = STEPS.length;

  function loadProgress() {
    try {
      return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
    } catch (e) {
      return null;
    }
  }

  function saveProgress(data) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(data));
  }

  const ORDER_KEY = PROGRESS_KEY.replace('_progress_', '_order_');

  function shuffleOrder() {
    const arr = STEPS.map((_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function loadOrder() {
    try {
      const parsed = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
      if (Array.isArray(parsed) && parsed.length === STEPS.length && parsed.every(n => Number.isInteger(n) && n >= 0 && n < STEPS.length)) {
        return parsed;
      }
    } catch (e) {}
    return null;
  }

  const saved = loadProgress();
  let stepOrder = (saved && !saved.completed) ? (loadOrder() || shuffleOrder()) : shuffleOrder();
  localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
  let currentStepIndex = (saved && !saved.completed) ? Math.min(saved.lastStepIndex || 0, STEPS.length - 1) : 0;
  let correctCount = (saved && typeof saved.correctCount === 'number') ? saved.correctCount : 0;

  function updateProgressBar() {
    const pct = Math.round(((currentStepIndex) / STEPS.length) * 100);
    progressFill.style.width = pct + '%';
    lblStepNum.textContent = Math.min(currentStepIndex + 1, STEPS.length);
  }

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity('cod_seguranca_ia_teoria', label, {
        step: currentStepIndex + 1,
        total: STEPS.length,
        correctCount: correctCount
      });
    }
  }

  function renderStory() {
    updateProgressBar();
    const step = STEPS[stepOrder[currentStepIndex]];
    reportStep(`Codificação — Segurança e IA — Etapa ${currentStepIndex + 1}/${STEPS.length}`);

    storyWrap.innerHTML = '';

    const row = document.createElement('div');
    row.className = 'bia-row';
    row.innerHTML = `
      <div class="bia-avatar">🐞</div>
      <div class="speech-bubble">
        <span class="bia-name">Bia, a Joaninha Debugger</span>
        ${step.story}
      </div>
    `;
    storyWrap.appendChild(row);

    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.innerHTML = `<button class="btn" id="btnNext">Próximo →</button>`;
    storyWrap.appendChild(actions);

    document.getElementById('btnNext').addEventListener('click', renderQuestion);
  }

  function renderQuestion() {
    const step = STEPS[stepOrder[currentStepIndex]];
    const q = step.question;

    storyWrap.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2>❓ ${q.prompt}</h2>`;

    const optionsWrap = document.createElement('div');
    const letters = ['A', 'B', 'C', 'D'];
    let answered = false;

    const order = q.options.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    const correctPos = order.indexOf(q.correctIndex);

    order.forEach((origIdx, pos) => {
      const optText = q.options[origIdx];
      const opt = document.createElement('div');
      opt.className = 'option';
      opt.innerHTML = `<span class="opt-letter">${letters[pos]}</span><span>${optText}</span>`;
      opt.addEventListener('click', () => {
        if (answered) return;
        answered = true;
        selectAnswer(pos);
      });
      optionsWrap.appendChild(opt);

      function selectAnswer(chosenIdx) {
        const allOptionEls = optionsWrap.querySelectorAll('.option');
        allOptionEls.forEach(el => el.classList.add('disabled'));

        const isCorrect = chosenIdx === correctPos;
        allOptionEls[chosenIdx].classList.add(isCorrect ? 'correct' : 'incorrect');
        if (!isCorrect) {
          allOptionEls[correctPos].classList.add('correct');
        }
        if (isCorrect) correctCount++;

        const feedback = document.createElement('div');
        feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
        feedback.innerHTML = isCorrect
          ? `✅ Correto! ${q.explanation}`
          : `❌ Não foi dessa vez. A resposta certa é "<b>${q.options[q.correctIndex]}</b>": ${q.explanation.replace(/^(Isso mesmo!|Isso!|Correto!|Exato!|Perfeito!|Correta!)\s*/i, '')}`;
        card.appendChild(feedback);

        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.style.marginTop = '14px';
        actions.innerHTML = `<button class="btn" id="btnNextAfterAnswer">Próximo →</button>`;
        card.appendChild(actions);

        saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
        reportStep(`Codificação — Segurança e IA — Etapa ${currentStepIndex + 1}/${STEPS.length} (respondida)`);

        document.getElementById('btnNextAfterAnswer').addEventListener('click', () => {
          currentStepIndex++;
          if (currentStepIndex >= STEPS.length) {
            finishJourney();
          } else {
            saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
            renderStory();
          }
        });
      }
    });

    card.appendChild(optionsWrap);
    storyWrap.innerHTML = '';
    storyWrap.appendChild(card);
  }

  function finishJourney(reviewOnly) {
    const pct = STEPS.length > 0 ? Math.round((correctCount / STEPS.length) * 100) : 0;
    const passed = reviewOnly ? true : pct >= 80;
    if (!reviewOnly) {
      saveProgress({ lastStepIndex: STEPS.length, correctCount, completed: passed });
      reportStep(`Codificação — Segurança e IA — ${passed ? 'Concluída' : 'Não concluída'} (${correctCount}/${STEPS.length})`);
    }

    progressFill.style.width = '100%';
    lblStepNum.textContent = STEPS.length;

    storyWrap.innerHTML = passed ? `
      <div class="card finish-screen">
        <div class="trophy">🏆</div>
        <h2>Segurança no Código e IA com Grafos concluídos!</h2>
        <p>Você já reconhece validação de inputs, grafos de waypoints, algoritmos de busca em grafos, árvores de decisão e máquinas de estado pra IA de NPCs.</p>
        <div class="score">Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%).</div>
        <p>Agora é hora de colocar a mão na massa: volte à trilha e abra o módulo de prática da Central de Codificação.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn btn-secondary" id="btnRestart">🔁 Rever a teoria</button>
        </div>
      </div>
    ` : `
      <div class="card finish-screen">
        <div class="trophy">📚</div>
        <h2>Quase lá!</h2>
        <p>Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%) — é preciso pelo menos 80% de acerto para concluir esta atividade.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn" id="btnRestart">🔁 Tentar novamente</button>
        </div>
      </div>
    `;

    document.getElementById('btnRestart').addEventListener('click', () => {
      currentStepIndex = 0;
      correctCount = 0;
      stepOrder = shuffleOrder();
      localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
      saveProgress({ lastStepIndex: 0, correctCount: 0, completed: false });
      renderStory();
    });
  }

  if (saved && saved.completed) {
    currentStepIndex = STEPS.length;
    finishJourney(true);
  } else {
    renderStory();
  }
</script>
