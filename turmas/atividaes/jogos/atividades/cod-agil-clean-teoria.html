<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Metodologia Ágil e Clean Code: Teoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d14; --panel:#10141f; --panel2:#0d101a; --line:#20283a;
    --blue:#5ec8ff; --blue-dim:#2f7aa8; --blood:#c1121f; --blood-bright:#ff3b30;
    --gold:#e0b84a; --ink:#dbe4f2; --ink-dim:#657388;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--blue-dim); background:#060810;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(94,200,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--blue); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .bia-row{ display:flex; align-items:flex-start; gap:12px; }
  .bia-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(94,200,255,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--blue-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .bia-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--blue);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble code{ color:var(--gold); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--gold); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--blue-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--blue); background:rgba(94,200,255,0.08); }
  .option.correct .opt-letter{ border-color:var(--blue); color:var(--blue); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--blue); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--gold); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--blue); color:#04162a; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--blue); border:1px solid var(--blue-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--blue); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--gold); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--blue); border:1px solid var(--blue-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(94,200,255,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'cod_agil_clean_teoria';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/vendor/pptxgen.bundle.js"></script>
<script src="../../../shared/slides-generator.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>CODIFICAÇÃO — METODOLOGIA ÁGIL E CLEAN CODE (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">5</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `cod_agil_clean_teoria_progress_${username}`;

  const STEPS = [
    {
      story: 'Oi! Eu sou a <b>Bia</b>, a joaninha debugger da PixelForge Studios. Hoje: <b>metodologia ágil</b>. Na PixelForge organizamos o trabalho em <b>Sprints</b> — ciclos curtos de trabalho com um objetivo definido — usando um <b>quadro Kanban</b>, que organiza as tarefas em colunas como "A Fazer", "Em Progresso" e "Concluído", deixando o fluxo de trabalho visível pra todo mundo.',
      question: {
        prompt: 'Uma equipe organiza as tarefas do projeto em três colunas visuais — "A Fazer", "Em Progresso" e "Concluído" — movendo os cartões conforme o trabalho avança. Que ferramenta ágil é essa?',
        options: ['Quadro Kanban de tarefas visuais', 'Um GDD, documento de design', 'Um pipeline de renderização', 'Uma variável de ambiente'],
        correctIndex: 0,
        explanation: 'Isso! Organizar tarefas em colunas visuais que mostram o progresso do fluxo de trabalho é justamente um quadro Kanban.'
      }
    },
    {
      story: 'Quando surge um problema técnico complexo, uma prática comum é o <b>live coding</b> em grupo: várias pessoas debugam juntas em tempo real, discutindo hipóteses e testando soluções — combinando diferentes perspectivas pra resolver mais rápido do que uma pessoa sozinha conseguiria.',
      question: {
        prompt: 'Diante de um bug de colisão difícil de entender, três devs se juntam numa chamada e debugam o código juntos em tempo real, testando hipóteses em conjunto. Que prática é essa?',
        options: ['Live coding colaborativo pra resolução de problemas técnicos', 'Um Sprint isolado, sem nenhuma colaboração entre os devs', 'Documentação técnica escrita sobre o código', 'Um requisito não funcional de performance do sistema'],
        correctIndex: 0,
        explanation: 'Exato! Debugar em grupo, em tempo real, combinando perspectivas diferentes, é live coding colaborativo.'
      }
    },
    {
      story: 'Escrever <b>Clean Code</b> (código limpo) significa usar <b>nomenclatura clara</b>: uma variável chamada <code>vidaJogador</code> comunica muito mais do que uma chamada <code>x</code>. Junto disso vem o princípio <b>DRY</b> ("Don’t Repeat Yourself" — não se repita): se você percebe o mesmo trecho de lógica copiado em vários lugares, é sinal de que ele deveria virar uma função reaproveitável.',
      question: {
        prompt: 'Um dev percebe que o mesmo cálculo de dano está copiado e colado em cinco lugares diferentes do código, e decide transformá-lo numa única função reaproveitável. Que princípio de Clean Code ele está aplicando?',
        options: ['DRY (Don’t Repeat Yourself) — evitar repetição de código', 'Nomenclatura clara, sem nenhuma relação direta com repetição', 'Um trigger de multimídia disparado por ação', 'Encapsulamento de dados internos da classe'],
        correctIndex: 0,
        explanation: 'Isso mesmo! Transformar código duplicado numa única função reaproveitável é aplicar o princípio DRY.'
      }
    },
    {
      story: '<b>Refatorar</b> um código monolítico (uma função gigante que faz "tudo") significa quebrá-lo em partes menores, cada uma com uma responsabilidade clara — isso é chamado de <b>modularização</b>. O comportamento final do programa continua o mesmo, mas o código fica muito mais fácil de entender e manter.',
      question: {
        prompt: 'Uma função gigante que carregava o jogo, processava a entrada do jogador e desenhava a tela, tudo junto, é quebrada em três funções menores, cada uma com uma responsabilidade específica. Que prática é essa?',
        options: ['Refatoração com modularização', 'Documentação técnica do código', 'Live coding colaborativo em grupo', 'Um quadro Kanban de tarefas'],
        correctIndex: 0,
        explanation: 'Perfeito! Quebrar uma função monolítica em partes menores, cada uma com sua responsabilidade, é refatoração com modularização.'
      }
    },
    {
      story: 'Por fim, boa <b>documentação</b> técnica inclui <b>docstrings</b> (comentários estruturados explicando o que uma função faz, seus parâmetros e retorno) e <b>guias de referência</b>, que ajudam outros devs (ou você mesmo, meses depois) a entender rapidamente como usar cada parte do código sem precisar ler tudo linha por linha. Agora você já reconhece Kanban, live coding, DRY, refatoração/modularização e documentação técnica!',
      question: {
        prompt: 'Acima de uma função complexa, um dev escreve um comentário estruturado explicando o que a função faz, quais parâmetros espera e o que retorna. Que prática de documentação é essa?',
        options: ['Docstring, comentário estruturado', 'Um quadro Kanban de tarefas', 'Refatoração do código monolítico', 'Um trigger de áudio disparado'],
        correctIndex: 0,
        explanation: 'Isso! Um comentário estruturado explicando função, parâmetros e retorno é justamente uma docstring.'
      }
    },
    {
      story: 'Clean Code também é sobre <b>nomenclatura clara</b>: nomes de variáveis e funções devem comunicar seu propósito sem precisar de comentário extra. <code>vidaJogador</code> diz muito mais que <code>x</code>, e <code>calcularDano()</code> diz muito mais que <code>fn1()</code>.',
      question: {
        prompt: 'Ao revisar um código antigo, uma dev encontra uma variável chamada apenas "x" guardando a vida do jogador, e renomeia para "vidaJogador" sem mudar mais nada. Que princípio de Clean Code ela está aplicando?',
        options: ['Nomenclatura clara — nomes que comunicam o propósito', 'DRY — eliminar repetição de código', 'Refatoração com modularização', 'Uma docstring documentando a função'],
        correctIndex: 0,
        explanation: 'Isso! Trocar um nome vago por um nome que comunica claramente o propósito da variável é aplicar nomenclatura clara.'
      }
    },
    {
      story: 'Voltando à metodologia ágil: um <b>Sprint</b> é um ciclo curto de trabalho (geralmente 1 a 4 semanas) com um objetivo bem definido no início — ao final do Sprint, a equipe entrega algo funcional e revisa o que foi feito antes de começar o próximo ciclo.',
      question: {
        prompt: 'No início de um ciclo de duas semanas, a equipe define um objetivo claro pro que será entregue, e só ao final desse período revisa o resultado antes de começar o próximo ciclo. Que conceito ágil descreve esse ciclo curto e objetivo?',
        options: ['Sprint', 'Quadro Kanban', 'Docstring', 'Refatoração'],
        correctIndex: 0,
        explanation: 'Exato! Um ciclo curto de trabalho com objetivo definido, revisado ao final antes do próximo ciclo, é um Sprint.'
      }
    },
    {
      story: 'Um exemplo clássico de <b>live coding</b> em grupo: um bug de <b>colisão</b> em que os personagens atravessam paredes de forma inconsistente. Como o comportamento só aparece em certas situações, é mais rápido reunir a equipe pra testar hipóteses juntos do que um dev sozinho tentar reproduzir o bug isoladamente.',
      question: {
        prompt: 'Um bug faz personagens atravessarem paredes só em certas situações, difícil de reproduzir sozinho. A equipe decide se reunir numa chamada e debugar juntos, testando hipóteses em tempo real. Por que essa abordagem funciona bem pra esse tipo de bug?',
        options: ['Combina perspectivas diferentes em tempo real, ajudando a reproduzir e isolar um bug difícil e inconsistente', 'Porque um Sprint só pode terminar depois que todos os bugs forem corrigidos', 'Porque documentação técnica sozinha já resolveria o bug', 'Porque bugs de colisão nunca podem ser debugados em grupo'],
        correctIndex: 0,
        explanation: 'Isso mesmo! Debugar em grupo ajuda especialmente em bugs inconsistentes/difíceis de reproduzir, já que várias pessoas testam hipóteses ao mesmo tempo.'
      }
    },
    {
      story: 'Além de docstrings em funções específicas, projetos maiores mantêm <b>guias de referência</b> — documentos mais amplos que explicam a arquitetura geral, decisões de design e como as partes se conectam, garantindo <b>rastreabilidade</b>: qualquer pessoa consegue entender por que o código foi feito de determinado jeito.',
      question: {
        prompt: 'Além dos comentários em cada função, a equipe mantém um documento único explicando a arquitetura geral do projeto e por que certas decisões de design foram tomadas. Que tipo de documentação é essa?',
        options: ['Um guia de referência, garantindo rastreabilidade das decisões', 'Uma docstring de uma função específica', 'Um quadro Kanban de tarefas', 'Um Sprint de duas semanas'],
        correctIndex: 0,
        explanation: 'Correto! Um documento mais amplo, sobre arquitetura e decisões de design, é um guia de referência — ele garante rastreabilidade.'
      }
    },
    {
      story: 'Um ponto importante da refatoração: o <b>comportamento externo do programa não muda</b> — só a estrutura interna do código melhora. Se, ao refatorar, uma funcionalidade passa a se comportar diferente pro jogador, isso não é mais refatoração pura, é uma mudança de comportamento (que merece ser testada e comunicada à parte).',
      question: {
        prompt: 'Ao refatorar uma função de dano, um dev percebe que o resultado calculado mudou pros mesmos valores de entrada de antes. Isso é um sinal de quê?',
        options: ['A refatoração não foi "pura" — o comportamento externo mudou, o que não deveria acontecer', 'Isso é normal e esperado em qualquer refatoração', 'É um sinal de que o código está mais modularizado', 'É um sinal de que a nomenclatura ficou mais clara'],
        correctIndex: 0,
        explanation: 'Isso! Refatoração de verdade preserva o comportamento externo — se o resultado mudou, algo além da estrutura interna foi alterado.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Codificação de Jogos — Metodologia Ágil e Clean Code',
      subtitle: 'Aula Teórica · Trilha Metodologia Ágil e Clean Code · Turma Jogos Digitais',
      capacidade: 'Aplicar metodologias ágeis e resolução de problemas técnicos / Aplicar boas práticas de desenvolvimento (Clean Code) e documentação de projetos com rastreabilidade.',
      steps: STEPS,
      fileName: 'cod-agil-clean-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Prática — Central de Codificação: Metodologia Ágil e Clean Code" no Portal de Aulas para os alunos resolverem os pareceres de verdade.'
    });
  };

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Codificação de Jogos — Metodologia Ágil e Clean Code',
      subtitle: 'Aula Teórica · Trilha Metodologia Ágil e Clean Code · Turma Jogos Digitais',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'cod-agil-clean-teoria-gabarito.txt'
    });
  };

  const role = urlParams.get('role') || 'aluno';
  const btnGenSlides = document.getElementById('btnGenSlides');
  if (role === 'professor') {
    btnGenSlides.style.display = 'inline-block';
    btnGenSlides.addEventListener('click', () => {
      btnGenSlides.disabled = true;
      btnGenSlides.textContent = '⏳ Gerando...';
      setTimeout(() => {
        window.generateSlidesForGestao();
        btnGenSlides.disabled = false;
        btnGenSlides.textContent = '🖨️ Gerar Slides (PPTX)';
      }, 50);
    });
  }

  const storyWrap = document.getElementById('storyWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const lblStepTotal = document.getElementById('lblStepTotal');
  const progressFill = document.getElementById('progressFill');

  lblStepTotal.textContent = STEPS.length;

  function loadProgress() {
    try {
      return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
    } catch (e) {
      return null;
    }
  }

  function saveProgress(data) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(data));
  }

  const ORDER_KEY = PROGRESS_KEY.replace('_progress_', '_order_');

  function shuffleOrder() {
    const arr = STEPS.map((_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function loadOrder() {
    try {
      const parsed = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
      if (Array.isArray(parsed) && parsed.length === STEPS.length && parsed.every(n => Number.isInteger(n) && n >= 0 && n < STEPS.length)) {
        return parsed;
      }
    } catch (e) {}
    return null;
  }

  const saved = loadProgress();
  let stepOrder = (saved && !saved.completed) ? (loadOrder() || shuffleOrder()) : shuffleOrder();
  localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
  let currentStepIndex = (saved && !saved.completed) ? Math.min(saved.lastStepIndex || 0, STEPS.length - 1) : 0;
  let correctCount = (saved && typeof saved.correctCount === 'number') ? saved.correctCount : 0;

  function updateProgressBar() {
    const pct = Math.round(((currentStepIndex) / STEPS.length) * 100);
    progressFill.style.width = pct + '%';
    lblStepNum.textContent = Math.min(currentStepIndex + 1, STEPS.length);
  }

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity('cod_agil_clean_teoria', label, {
        step: currentStepIndex + 1,
        total: STEPS.length,
        correctCount: correctCount
      });
    }
  }

  function renderStory() {
    updateProgressBar();
    const step = STEPS[stepOrder[currentStepIndex]];
    reportStep(`Codificação — Ágil e Clean Code — Etapa ${currentStepIndex + 1}/${STEPS.length}`);

    storyWrap.innerHTML = '';

    const row = document.createElement('div');
    row.className = 'bia-row';
    row.innerHTML = `
      <div class="bia-avatar">🐞</div>
      <div class="speech-bubble">
        <span class="bia-name">Bia, a Joaninha Debugger</span>
        ${step.story}
      </div>
    `;
    storyWrap.appendChild(row);

    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.innerHTML = `<button class="btn" id="btnNext">Próximo →</button>`;
    storyWrap.appendChild(actions);

    document.getElementById('btnNext').addEventListener('click', renderQuestion);
  }

  function renderQuestion() {
    const step = STEPS[stepOrder[currentStepIndex]];
    const q = step.question;

    storyWrap.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2>❓ ${q.prompt}</h2>`;

    const optionsWrap = document.createElement('div');
    const letters = ['A', 'B', 'C', 'D'];
    let answered = false;

    const order = q.options.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    const correctPos = order.indexOf(q.correctIndex);

    order.forEach((origIdx, pos) => {
      const optText = q.options[origIdx];
      const opt = document.createElement('div');
      opt.className = 'option';
      opt.innerHTML = `<span class="opt-letter">${letters[pos]}</span><span>${optText}</span>`;
      opt.addEventListener('click', () => {
        if (answered) return;
        answered = true;
        selectAnswer(pos);
      });
      optionsWrap.appendChild(opt);

      function selectAnswer(chosenIdx) {
        const allOptionEls = optionsWrap.querySelectorAll('.option');
        allOptionEls.forEach(el => el.classList.add('disabled'));

        const isCorrect = chosenIdx === correctPos;
        allOptionEls[chosenIdx].classList.add(isCorrect ? 'correct' : 'incorrect');
        if (!isCorrect) {
          allOptionEls[correctPos].classList.add('correct');
        }
        if (isCorrect) correctCount++;

        const feedback = document.createElement('div');
        feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
        feedback.innerHTML = isCorrect
          ? `✅ Correto! ${q.explanation}`
          : `❌ Não foi dessa vez. A resposta certa é "<b>${q.options[q.correctIndex]}</b>": ${q.explanation.replace(/^(Isso mesmo!|Isso!|Correto!|Exato!|Perfeito!|Correta!)\s*/i, '')}`;
        card.appendChild(feedback);

        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.style.marginTop = '14px';
        actions.innerHTML = `<button class="btn" id="btnNextAfterAnswer">Próximo →</button>`;
        card.appendChild(actions);

        saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
        reportStep(`Codificação — Ágil e Clean Code — Etapa ${currentStepIndex + 1}/${STEPS.length} (respondida)`);

        document.getElementById('btnNextAfterAnswer').addEventListener('click', () => {
          currentStepIndex++;
          if (currentStepIndex >= STEPS.length) {
            finishJourney();
          } else {
            saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
            renderStory();
          }
        });
      }
    });

    card.appendChild(optionsWrap);
    storyWrap.innerHTML = '';
    storyWrap.appendChild(card);
  }

  function finishJourney(reviewOnly) {
    const pct = STEPS.length > 0 ? Math.round((correctCount / STEPS.length) * 100) : 0;
    const passed = reviewOnly ? true : pct >= 80;
    if (!reviewOnly) {
      saveProgress({ lastStepIndex: STEPS.length, correctCount, completed: passed });
      reportStep(`Codificação — Ágil e Clean Code — ${passed ? 'Concluída' : 'Não concluída'} (${correctCount}/${STEPS.length})`);
    }

    progressFill.style.width = '100%';
    lblStepNum.textContent = STEPS.length;

    storyWrap.innerHTML = passed ? `
      <div class="card finish-screen">
        <div class="trophy">🏆</div>
        <h2>Metodologia Ágil e Clean Code concluídos!</h2>
        <p>Você já reconhece o quadro Kanban, live coding colaborativo, o princípio DRY, refatoração/modularização e docstrings de documentação técnica.</p>
        <div class="score">Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%).</div>
        <p>Agora é hora de colocar a mão na massa: volte à trilha e abra o módulo de prática da Central de Codificação.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn btn-secondary" id="btnRestart">🔁 Rever a teoria</button>
        </div>
      </div>
    ` : `
      <div class="card finish-screen">
        <div class="trophy">📚</div>
        <h2>Quase lá!</h2>
        <p>Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%) — é preciso pelo menos 80% de acerto para concluir esta atividade.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn" id="btnRestart">🔁 Tentar novamente</button>
        </div>
      </div>
    `;

    document.getElementById('btnRestart').addEventListener('click', () => {
      currentStepIndex = 0;
      correctCount = 0;
      stepOrder = shuffleOrder();
      localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
      saveProgress({ lastStepIndex: 0, correctCount: 0, completed: false });
      renderStory();
    });
  }

  if (saved && saved.completed) {
    currentStepIndex = STEPS.length;
    finishJourney(true);
  } else {
    renderStory();
  }
</script>
