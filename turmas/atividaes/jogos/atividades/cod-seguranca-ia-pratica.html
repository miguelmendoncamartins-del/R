<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Jogos: Central de Codificação</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d14; --panel:#10141f; --panel2:#0d101a; --line:#20283a;
    --blue:#5ec8ff; --blue-dim:#2f7aa8; --blood:#c1121f; --blood-bright:#ff3b30;
    --gold:#e0b84a; --ink:#dbe4f2; --ink-dim:#657388;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--blue-dim); background:#060810;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(94,200,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .stage{ flex:1; min-height:0; padding:12px; overflow:hidden; display:flex; }
  .layout{ display:flex; flex-direction:row; flex-wrap:nowrap; gap:14px; width:100%; height:100%; }

  .sidebar{
    width:200px; flex-shrink:0; height:100%; overflow-y:auto;
    background:var(--panel); border:1px solid var(--line); padding:8px;
  }
  .sidebar-title{ font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; padding:0 2px; }
  .challenge-item{
    display:flex; align-items:center; gap:8px; padding:8px 8px; margin-bottom:4px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:11px;
  }
  .challenge-item .status{ font-size:13px; width:16px; text-align:center; flex-shrink:0; }
  .challenge-item.active{ border-color:var(--blue); color:var(--blue); }
  .challenge-item.completed{ color:var(--ink); }
  .challenge-item.locked{ opacity:0.4; cursor:not-allowed; }
  .challenge-item .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .main-panel{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; height:100%; overflow-y:auto; }

  .challenge-header{ flex-shrink:0; background:var(--panel); border:1px solid var(--line); padding:10px 14px; }

  .enemy-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .enemy-avatar{ font-size:32px; line-height:1; filter:drop-shadow(0 0 6px rgba(94,200,255,0.4)); }
  .enemy-info{ flex:1; min-width:0; }
  .enemy-name{ font-size:11.5px; color:var(--gold); font-weight:800; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
  .hp-bar-track{ width:100%; height:8px; background:#1a2233; border:1px solid var(--line); overflow:hidden; }
  .hp-bar-fill{ height:100%; width:100%; background:var(--blood-bright); transition:width 0.6s ease; }
  .hp-bar-fill.defeated{ width:0%; background:var(--ink-dim); }

  .challenge-header h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:19px; color:var(--blue); margin:0 0 8px; letter-spacing:1px; }
  .challenge-header p{ font-size:12px; color:var(--ink-dim); margin:8px 0 0; line-height:1.5; }
  .challenge-header code{ color:var(--gold); }

  .explanation-box{
    background:#060810; border:1px solid var(--blue-dim); padding:10px 12px;
    font-size:11.5px; color:var(--ink); line-height:1.6;
  }
  .explanation-box .exp-title{
    color:var(--blue); font-weight:800; text-transform:uppercase; font-size:10px; letter-spacing:1px; margin-bottom:6px;
  }
  .explanation-box code{ color:var(--gold); }
  .explanation-box pre{
    background:#000; border:1px solid var(--line); padding:8px; margin:6px 0 0;
    overflow-x:auto; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--gold); white-space:pre;
  }

  .hint-toggle{
    display:inline-block; margin-top:8px; font-size:10.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--gold); border:1px solid var(--blue-dim); padding:5px 10px; cursor:pointer; border-radius:2px;
  }
  .hint-toggle:hover{ background:rgba(224,184,74,0.1); }
  .hint-box{
    display:none; margin-top:8px; background:var(--panel2); border:1px dashed var(--gold);
    padding:8px 10px; font-size:11.5px; color:var(--ink); line-height:1.5;
  }
  .hint-box.show{ display:block; }
  .hint-box b{ color:var(--gold); }

  textarea#codeInput{
    width:100%; flex:1; min-height:60px; resize:vertical; background:#000; color:var(--blue);
    border:1px solid var(--line); font-family:'JetBrains Mono', monospace; font-size:12px;
    padding:10px; outline:none; line-height:1.5;
  }
  textarea#codeInput:focus{ border-color:var(--blue); }

  .actions{ display:flex; gap:8px; align-items:center; flex-shrink:0; flex-wrap:wrap; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11px; letter-spacing:1px; text-transform:uppercase;
    background:var(--blue); color:#04162a; border:none; padding:9px 16px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.5; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--blue); border:1px solid var(--blue-dim); }

  .console{
    background:#050710; border:1px solid var(--line); padding:8px 10px; font-size:11px;
    flex:1; min-height:50px; overflow-y:auto; line-height:1.6;
  }
  .console .line.info{ color:var(--ink-dim); }
  .console .line.pass{ color:var(--blue); }
  .console .line.fail{ color:var(--blood-bright); }
  .console .line.success{ color:var(--blue); font-weight:bold; }
  .console .line.warn{ color:var(--gold); }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:8px; }
    .layout{ flex-direction:column; height:auto; }
    .sidebar{ width:100%; height:auto; max-height:150px; }
    .main-panel{ height:auto; overflow-y:visible; }
    textarea#codeInput{ min-height:110px; }
    .console{ flex:none; max-height:160px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'cod_seguranca_ia_pratica';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>CODIFICAÇÃO — CENTRAL (SEGURANÇA E IA COM GRAFOS)</div>
    <div>RESOLVIDOS: <span id="lblProgress">0/0</span></div>
  </div>

  <div class="stage">
    <div class="layout">
      <div class="sidebar">
        <div class="sidebar-title">Chamados</div>
        <div id="challengeList"></div>
      </div>

      <div class="main-panel">
        <div class="challenge-header">
          <div class="enemy-row">
            <div class="enemy-avatar" id="enemyAvatar">🐞</div>
            <div class="enemy-info">
              <div class="enemy-name" id="enemyName">--</div>
              <div class="hp-bar-track"><div class="hp-bar-fill" id="hpBarFill"></div></div>
            </div>
          </div>
          <h2 id="challengeTitle">--</h2>

          <div class="explanation-box">
            <div class="exp-title">📖 Como funciona</div>
            <div id="explanationText"></div>
          </div>

          <p id="challengeDesc"></p>
          <button class="hint-toggle" id="btnHint">💡 Ver dica</button>
          <div class="hint-box" id="hintBox"></div>
        </div>

        <textarea id="codeInput" spellcheck="false"></textarea>

        <div class="actions">
          <button class="btn" id="btnRun">▶ Executar código</button>
          <button class="btn btn-secondary" id="btnNext" style="display:none;">Próximo chamado →</button>
        </div>

        <div class="console" id="consoleOutput"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `cod_seguranca_ia_pratica_progress_${username}`;

  const CHALLENGES = [
    {
      id: 1,
      title: 'Nome de usuário suspeito',
      enemyName: 'Chamado: Cadastro sem validação',
      enemyEmoji: '🚫',
      fnName: 'validarNomeUsuario',
      starter: 'function validarNomeUsuario(nome) {\n  // retorne true se nome for uma string de 3 a 20 caracteres,\n  // contendo só letras, números e underscore (_)\n\n}',
      explanation: 'Você pode validar o <b>formato</b> de um texto com uma <b>expressão regular</b> (regex): um padrão que descreve os caracteres permitidos.<pre>const padrao = /^[a-z]{2,4}$/;\npadrao.test("ab")     // true (2 letras minúsculas)\npadrao.test("AB12")   // false (tem maiúscula e número)</pre>Lembre-se: primeiro confirme que a entrada é mesmo do tipo <code>string</code> antes de testar o padrão.',
      desc: 'O sistema de cadastro está aceitando qualquer coisa no campo de nome de usuário — inclusive tentativas de injeção de comandos. Complete <code>validarNomeUsuario(nome)</code> pra bloquear entradas fora do padrão.',
      hint: 'Pesquise sobre expressões regulares (regex) em JavaScript e o método <code>.test()</code>. Não esqueça de checar primeiro se <code>nome</code> é mesmo uma string.',
      tests: [
        { args: ['jogador1'], expected: true },
        { args: ['ana_2024'], expected: true },
        { args: ['ab'], expected: false },
        { args: ["robo'; DROP TABLE users;--"], expected: false },
        { args: ['nome com espaço'], expected: false },
        { args: [12345], expected: false },
        { args: [''], expected: false }
      ]
    },
    {
      id: 2,
      title: 'Idade digitada errada',
      enemyName: 'Chamado: Campo de idade sem checagem de tipo',
      enemyEmoji: '🔢',
      fnName: 'validarIdade',
      starter: 'function validarIdade(valor) {\n  // retorne true se valor for um NÚMERO finito e maior ou igual a 0\n\n}',
      explanation: 'JavaScript tem funções prontas pra checar números: <code>typeof valor === \'number\'</code> confirma o tipo, e <code>Number.isFinite(valor)</code> garante que não é <code>NaN</code> nem <code>Infinity</code>.<pre>typeof "10" === \'number\'   // false — é texto, não número!\nNumber.isFinite(7 / 0)      // false — é Infinity</pre>',
      desc: 'O formulário de cadastro aceita qualquer valor no campo "idade", inclusive texto solto. Complete <code>validarIdade(valor)</code> pra só aceitar números válidos e não negativos.',
      hint: 'Pense em três checagens: é do tipo certo? é um número válido (não é NaN nem Infinity)? não é negativo?',
      tests: [
        { args: [25], expected: true },
        { args: [0], expected: true },
        { args: ['25'], expected: false },
        { args: [-5], expected: false },
        { args: [NaN], expected: false },
        { args: [Infinity], expected: false }
      ]
    },
    {
      id: 3,
      title: 'O guarda de patrulha',
      enemyName: 'Chamado: Mapa de waypoints do NPC',
      enemyEmoji: '🕸️',
      fnName: 'vizinhosDoNo',
      starter: 'function vizinhosDoNo(grafo, no) {\n  // grafo é um objeto tipo { A: ["B","C"], B: ["A"] }\n  // retorne a lista de vizinhos do nó "no" (ou array vazio se ele não existir)\n\n}',
      explanation: 'Um objeto pode guardar listas associadas a chaves, como um grafo de adjacência.<pre>const mapa = { casa: ["rua"], rua: ["casa", "praca"] };\nmapa["rua"]      // ["casa", "praca"]\nmapa["parque"]   // undefined — chave que não existe!</pre>Pra não devolver <code>undefined</code> quando a chave não existe, você pode usar o operador <code>||</code> com um valor padrão.',
      desc: 'O NPC guarda precisa saber quais pontos do mapa estão diretamente conectados ao ponto onde ele está. Complete <code>vizinhosDoNo(grafo, no)</code> retornando os vizinhos desse nó no grafo de waypoints.',
      hint: 'Acesse a propriedade do objeto pelo nome do nó — e pense no que devolver se essa propriedade não existir.',
      tests: [
        { args: [{ A: ['B', 'C'], B: ['A'], C: ['A'] }, 'A'], expected: ['B', 'C'] },
        { args: [{ A: ['B', 'C'], B: ['A'], C: ['A'] }, 'B'], expected: ['A'] },
        { args: [{ A: ['B', 'C'], B: ['A'], C: ['A'] }, 'Z'], expected: [] }
      ]
    },
    {
      id: 4,
      title: 'O caminho mais curto',
      enemyName: 'Chamado: Rota até o jogador',
      enemyEmoji: '🧭',
      fnName: 'distanciaMinima',
      starter: 'function distanciaMinima(grafo, origem, destino) {\n  // retorne o número de "saltos" do caminho mais curto entre origem e destino\n  // (0 se origem === destino, -1 se não existir caminho)\n\n}',
      explanation: 'Uma <b>busca em largura</b> (BFS) explora um grafo nível por nível, usando uma <b>fila</b> (array onde você tira o primeiro item com <code>.shift()</code>) e um <code>Set</code> pra não visitar o mesmo nó duas vezes.<pre>let fila = [inicio];\nlet visitado = new Set([inicio]);\nwhile (fila.length) {\n  const atual = fila.shift();\n  // olha os vizinhos de "atual" e empilha os novos...\n}</pre>Você já viu essa lógica de sensor + fila no jogo Campo Minado — a ideia aqui é parecida, só que sobre um grafo em vez de um tabuleiro.',
      desc: 'O NPC precisa saber quantos saltos separam ele do jogador, navegando pelo grafo de waypoints. Complete <code>distanciaMinima(grafo, origem, destino)</code> usando busca em grafo.',
      hint: 'Isso é uma busca em grafo. Uma fila (array com <code>.shift()</code>) e um <code>Set</code> de nós visitados ajudam a explorar nível por nível, contando os saltos.',
      tests: [
        { args: [{ A: ['B'], B: ['A', 'C'], C: ['B', 'D'], D: ['C'], E: [] }, 'A', 'D'], expected: 3 },
        { args: [{ A: ['B'], B: ['A', 'C'], C: ['B', 'D'], D: ['C'], E: [] }, 'A', 'A'], expected: 0 },
        { args: [{ A: ['B'], B: ['A', 'C'], C: ['B', 'D'], D: ['C'], E: [] }, 'A', 'E'], expected: -1 },
        { args: [{ A: ['B'], B: ['A', 'C'], C: ['B', 'D'], D: ['C'], E: [] }, 'A', 'B'], expected: 1 }
      ]
    },
    {
      id: 5,
      title: 'Lava ou caminho seguro?',
      enemyName: 'Chamado: Custo do caminho',
      enemyEmoji: '🌋',
      fnName: 'custoDoCaminho',
      starter: 'function custoDoCaminho(grafo, caminho) {\n  // grafo é tipo { A: [{ para: "B", peso: 4 }], ... }\n  // caminho é um array de nomes de nós, tipo ["A","B","C"]\n  // retorne a soma dos pesos das arestas do caminho (-1 se algum salto não existir)\n\n}',
      explanation: 'Quando as conexões de um grafo têm peso, você pode usar <code>.find()</code> pra localizar a aresta certa entre dois nós numa lista.<pre>const arestas = [{ para: "B", peso: 3 }, { para: "C", peso: 7 }];\nconst aresta = arestas.find(a => a.para === "C");\naresta.peso   // 7</pre>Percorra o caminho de dois em dois nós (atual e próximo) somando o peso de cada trecho.',
      desc: 'Nem todo caminho tem o mesmo custo — alguns atravessam terrenos perigosos. Complete <code>custoDoCaminho(grafo, caminho)</code> somando o peso das conexões percorridas.',
      hint: 'Percorra o caminho par a par (nó atual e o próximo) e procure, na lista de conexões do nó atual, a aresta que leva ao próximo.',
      tests: [
        { args: [{ A: [{ para: 'B', peso: 4 }, { para: 'C', peso: 1 }], B: [{ para: 'D', peso: 2 }], C: [{ para: 'B', peso: 1 }, { para: 'D', peso: 6 }], D: [] }, ['A', 'C', 'B', 'D']], expected: 4 },
        { args: [{ A: [{ para: 'B', peso: 4 }, { para: 'C', peso: 1 }], B: [{ para: 'D', peso: 2 }], C: [{ para: 'B', peso: 1 }, { para: 'D', peso: 6 }], D: [] }, ['A', 'B', 'D']], expected: 6 },
        { args: [{ A: [{ para: 'B', peso: 4 }, { para: 'C', peso: 1 }], B: [{ para: 'D', peso: 2 }], C: [{ para: 'B', peso: 1 }, { para: 'D', peso: 6 }], D: [] }, ['A', 'D']], expected: -1 },
        { args: [{ A: [{ para: 'B', peso: 4 }, { para: 'C', peso: 1 }], B: [{ para: 'D', peso: 2 }], C: [{ para: 'B', peso: 1 }, { para: 'D', peso: 6 }], D: [] }, ['A']], expected: 0 }
      ]
    },
    {
      id: 6,
      title: 'Atacar ou patrulhar?',
      enemyName: 'Chamado: Árvore de decisão do inimigo',
      enemyEmoji: '🌳',
      fnName: 'decidirAcao',
      starter: 'function decidirAcao(distancia, ouviuBarulho) {\n  // retorne "atacar" se distancia <= 5\n  // senão retorne "investigar" se ouviuBarulho for true\n  // senão retorne "patrulhar"\n\n}',
      explanation: 'Uma <b>árvore de decisão</b> é uma sequência de <code>if</code>/<code>else if</code> — a ordem importa, porque a primeira condição verdadeira "vence".<pre>function classificar(nota) {\n  if (nota >= 9) return "excelente";\n  if (nota >= 7) return "bom";\n  return "precisa melhorar";\n}</pre>',
      desc: 'O inimigo precisa decidir sozinho o que fazer, dependendo da distância até o jogador e se ouviu barulho. Complete <code>decidirAcao(distancia, ouviuBarulho)</code>.',
      hint: 'A ordem dos <code>if</code> importa — pense em qual condição precisa ser checada primeiro.',
      tests: [
        { args: [3, false], expected: 'atacar' },
        { args: [10, true], expected: 'investigar' },
        { args: [10, false], expected: 'patrulhar' },
        { args: [5, false], expected: 'atacar' },
        { args: [5, true], expected: 'atacar' }
      ]
    },
    {
      id: 7,
      title: 'Fugir antes de atacar',
      enemyName: 'Chamado: Prioridade de sobrevivência',
      enemyEmoji: '🥇',
      fnName: 'decidirComPrioridade',
      starter: 'function decidirComPrioridade(vida, distancia) {\n  // se vida for MENOR que 20, retorne "fugir" (isso vem antes de tudo)\n  // senão, se distancia <= 5, retorne "atacar"\n  // senão, retorne "patrulhar"\n\n}',
      explanation: 'Quando duas condições podem ser verdadeiras ao mesmo tempo, a ORDEM dos <code>if</code> decide qual prioridade vence.<pre>function status(bateria, urgente) {\n  if (bateria < 10) return "recarregar";   // prioridade máxima\n  if (urgente) return "atender";\n  return "normal";\n}</pre>Note que "recarregar" vence mesmo se <code>urgente</code> também for verdadeiro.',
      desc: 'A vida baixa precisa vencer qualquer outra decisão, mesmo com o jogador bem perto. Complete <code>decidirComPrioridade(vida, distancia)</code> respeitando essa prioridade.',
      hint: 'Sobreviver vem primeiro: a checagem de vida baixa precisa estar ANTES da checagem de distância.',
      tests: [
        { args: [10, 1], expected: 'fugir' },
        { args: [100, 1], expected: 'atacar' },
        { args: [100, 20], expected: 'patrulhar' },
        { args: [19, 1], expected: 'fugir' },
        { args: [20, 1], expected: 'atacar' }
      ]
    },
    {
      id: 8,
      title: 'Patrulhando, Perseguindo, Atacando',
      enemyName: 'Chamado: Máquina de estado do NPC',
      enemyEmoji: '🔄',
      fnName: 'proximoEstado',
      starter: 'function proximoEstado(estadoAtual, evento) {\n  // tabela de transições:\n  //  patrulhando + viuJogador     -> perseguindo\n  //  perseguindo + chegouPerto    -> atacando\n  //  perseguindo + perdeuJogador  -> patrulhando\n  //  atacando    + vidaBaixa      -> fugindo\n  //  fugindo     + seguro         -> patrulhando\n  // qualquer outra combinação: retorne o próprio estadoAtual (sem transição)\n\n}',
      explanation: 'Uma <b>máquina de estado</b> pode ser escrita como uma sequência de comparações entre o estado atual e o evento recebido.<pre>function proximo(estado, evento) {\n  if (estado === "parado" && evento === "andar") return "andando";\n  if (estado === "andando" && evento === "parar") return "parado";\n  return estado; // combinação sem transição definida\n}</pre>',
      desc: 'O comportamento do NPC muda de estado conforme os eventos do jogo. Complete <code>proximoEstado(estadoAtual, evento)</code> seguindo a tabela de transições.',
      hint: 'Compare <code>estadoAtual</code> E <code>evento</code> juntos, linha por linha da tabela — se nenhuma combinação bater, devolva o estado sem mudar.',
      tests: [
        { args: ['patrulhando', 'viuJogador'], expected: 'perseguindo' },
        { args: ['perseguindo', 'chegouPerto'], expected: 'atacando' },
        { args: ['atacando', 'vidaBaixa'], expected: 'fugindo' },
        { args: ['patrulhando', 'chegouPerto'], expected: 'patrulhando' },
        { args: ['fugindo', 'seguro'], expected: 'patrulhando' }
      ]
    },
    {
      id: 9,
      title: 'Detector de injeção',
      enemyName: 'Chamado: Filtro de segurança',
      enemyEmoji: '🖥️',
      fnName: 'contemPadraoPerigoso',
      starter: 'function contemPadraoPerigoso(texto) {\n  // retorne true se texto (ou algo que nem é texto) tiver algum sinal de\n  // tentativa de injeção maliciosa; false se for um texto comum\n\n}',
      explanation: 'O método <code>.some()</code> de um array verifica se PELO MENOS UM item passa num teste — ótimo pra checar se um texto contém qualquer item de uma lista de padrões proibidos.<pre>const proibidas = ["fogo", "gelo"];\nconst texto = "bola de fogo";\nproibidas.some(p => texto.includes(p))   // true</pre><code>.toLowerCase()</code> ajuda a ignorar maiúsculas/minúsculas na comparação.',
      desc: 'Antes de aceitar qualquer texto do jogador, o sistema precisa desconfiar de padrões perigosos — mesmo que a checagem do navegador já tenha passado (nunca confie só nela!). Complete <code>contemPadraoPerigoso(texto)</code>.',
      hint: 'Pense num jeito de checar se o texto contém QUALQUER item de uma lista de trechos suspeitos — que tipos de ataque a essa altura da oficina você já reconhece? — e não esqueça de tratar entradas que nem são string.',
      tests: [
        { args: ['Ana Clara'], expected: false },
        { args: ["robo'; DROP TABLE users;--"], expected: true },
        { args: ['<script>alert(1)<\/script>'], expected: true },
        { args: ['Ola mundo'], expected: false },
        { args: [42], expected: true }
      ]
    },
    {
      id: 10,
      title: 'CHAMADO CRÍTICO: Decisão completa do NPC',
      enemyName: 'Chamado Crítico: IA completa do inimigo',
      enemyEmoji: '🚨',
      fnName: 'avaliarNPC',
      starter: 'function avaliarNPC(estado) {\n  // estado é um objeto: { vida, distancia, ouviuBarulho }\n  // combine tudo que você já resolveu, nesta ordem de prioridade:\n  //  1) vida baixa (< 20)     -> "fugir"\n  //  2) distancia <= 5        -> "atacar"\n  //  3) ouviuBarulho          -> "investigar"\n  //  4) senão                 -> "patrulhar"\n\n}',
      explanation: 'Este chamado combina os dois anteriores: primeiro a prioridade de sobrevivência (vida baixa), depois a árvore de decisão de ataque/investigação/patrulha — na mesma ordem de prioridade que você já usou separadamente.',
      desc: 'CHAMADO CRÍTICO: a central quer uma função só, que já decide a ação completa do NPC a partir do estado dele. Complete <code>avaliarNPC(estado)</code> juntando tudo que você já resolveu.',
      hint: 'Você já resolveu as duas partes separadas nos chamados anteriores — agora é só juntar as duas, respeitando a mesma ordem de prioridade.',
      tests: [
        { args: [{ vida: 10, distancia: 1, ouviuBarulho: false }], expected: 'fugir' },
        { args: [{ vida: 100, distancia: 2, ouviuBarulho: false }], expected: 'atacar' },
        { args: [{ vida: 100, distancia: 20, ouviuBarulho: true }], expected: 'investigar' },
        { args: [{ vida: 100, distancia: 20, ouviuBarulho: false }], expected: 'patrulhar' },
        { args: [{ vida: 15, distancia: 1, ouviuBarulho: true }], expected: 'fugir' }
      ]
    }
  ];

  // Exposto sempre (não só quando o botão local aparece) pra a aba "Gestão"
  // do portal da turma conseguir chamar isso remotamente, num iframe oculto,
  // e baixar um .txt com enunciado + critério de avaliação (testes) de cada
  // chamado — aqui não existe UMA alternativa certa, e sim um valor esperado
  // por combinação de argumentos, então o gabarito lista os casos de teste.
  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Codificação de Jogos: Central — Segurança no Código e IA com Grafos',
      subtitle: 'Prática · Turma Jogos Digitais',
      items: CHALLENGES.map((c, i) => ({
        number: i + 1,
        title: c.title,
        prompt: c.desc,
        answer: c.tests.map(t => {
          const inputs = (t.args || []).map(a => JSON.stringify(a)).join(', ');
          const exp = ('expected' in t) ? JSON.stringify(t.expected) : (t.expectedLabel || 'ver critério no código-fonte');
          return `${c.fnName}(${inputs}) deve retornar ${exp}`;
        }).join('\n')
      })),
      fileName: 'cod-seguranca-ia-pratica-gabarito.txt'
    });
  };

  const challengeListEl = document.getElementById('challengeList');
  const challengeTitleEl = document.getElementById('challengeTitle');
  const challengeDescEl = document.getElementById('challengeDesc');
  const explanationTextEl = document.getElementById('explanationText');
  const enemyAvatarEl = document.getElementById('enemyAvatar');
  const enemyNameEl = document.getElementById('enemyName');
  const hpBarFill = document.getElementById('hpBarFill');
  const codeInput = document.getElementById('codeInput');
  const btnRun = document.getElementById('btnRun');
  const btnNext = document.getElementById('btnNext');
  const btnHint = document.getElementById('btnHint');
  const hintBox = document.getElementById('hintBox');
  const consoleOutput = document.getElementById('consoleOutput');
  const lblProgress = document.getElementById('lblProgress');

  function getCompleted() {
    try {
      return new Set(JSON.parse(localStorage.getItem(PROGRESS_KEY) || '[]'));
    } catch (e) {
      return new Set();
    }
  }

  function saveCompleted(set) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify([...set]));
  }

  let completed = getCompleted();
  let selectedId = CHALLENGES.find(c => !completed.has(c.id))?.id || CHALLENGES[0].id;

  function isUnlocked(challenge) {
    const idx = CHALLENGES.findIndex(c => c.id === challenge.id);
    if (idx === 0) return true;
    return completed.has(CHALLENGES[idx - 1].id);
  }

  function renderSidebar() {
    challengeListEl.innerHTML = '';
    CHALLENGES.forEach(c => {
      const unlocked = isUnlocked(c);
      const isDone = completed.has(c.id);
      const item = document.createElement('div');
      item.className = 'challenge-item' + (c.id === selectedId ? ' active' : '') + (isDone ? ' completed' : '') + (!unlocked ? ' locked' : '');
      const statusIcon = isDone ? '✅' : (unlocked ? '🎫' : '🔒');
      item.innerHTML = `<span class="status">${statusIcon}</span><span class="name">${c.enemyEmoji} ${c.enemyName}</span>`;
      if (unlocked) {
        item.addEventListener('click', () => selectChallenge(c.id));
      }
      challengeListEl.appendChild(item);
    });
    lblProgress.textContent = `${completed.size}/${CHALLENGES.length}`;
  }

  function selectChallenge(id) {
    const challenge = CHALLENGES.find(c => c.id === id);
    if (!challenge || !isUnlocked(challenge)) return;
    selectedId = id;

    challengeTitleEl.textContent = `Chamado ${challenge.id}: ${challenge.title}`;
    explanationTextEl.innerHTML = challenge.explanation;
    challengeDescEl.innerHTML = challenge.desc;
    codeInput.value = challenge.starter;
    btnNext.style.display = 'none';

    hintBox.innerHTML = challenge.hint || '';
    hintBox.classList.remove('show');
    btnHint.textContent = '💡 Ver dica';

    enemyAvatarEl.textContent = challenge.enemyEmoji;
    enemyNameEl.textContent = challenge.enemyName;
    const alreadyDefeated = completed.has(id);
    hpBarFill.classList.toggle('defeated', alreadyDefeated);

    clearConsole();
    if (alreadyDefeated) {
      logConsole(`Você já resolveu este chamado. Pode refazer pra treinar.`, 'info');
    }
    renderSidebar();

    if (typeof window.reportActivity === 'function') {
      window.reportActivity(
        'cod_seguranca_ia_pratica',
        `Codificação — Segurança e IA — Chamado ${challenge.id}: ${challenge.title}`,
        { challengeId: challenge.id, total: CHALLENGES.length, completed: completed.size }
      );
    }
  }

  function clearConsole() {
    consoleOutput.innerHTML = '';
  }

  function logConsole(msg, type) {
    const line = document.createElement('div');
    line.className = 'line ' + (type || 'info');
    line.textContent = msg;
    consoleOutput.appendChild(line);
    consoleOutput.scrollTop = consoleOutput.scrollHeight;
  }

  function deepEqual(a, b) {
    if (Array.isArray(a) && Array.isArray(b)) {
      return a.length === b.length && a.every((v, i) => deepEqual(v, b[i]));
    }
    return a === b;
  }

  function runChallenge() {
    const challenge = CHALLENGES.find(c => c.id === selectedId);
    if (!challenge) return;
    clearConsole();

    let fn;
    try {
      fn = new Function(`${codeInput.value}\nreturn typeof ${challenge.fnName} === 'function' ? ${challenge.fnName} : undefined;`)();
    } catch (err) {
      logConsole('Erro de sintaxe: ' + err.message, 'fail');
      return;
    }

    if (typeof fn !== 'function') {
      logConsole(`A função '${challenge.fnName}' não foi encontrada. Verifique o nome da função.`, 'fail');
      return;
    }

    let allPass = true;
    challenge.tests.forEach((t, i) => {
      let result, errorMsg = null;
      try {
        result = fn(...t.args);
      } catch (err) {
        errorMsg = err.message;
      }

      let pass;
      if (errorMsg !== null) {
        pass = false;
      } else if (typeof t.check === 'function') {
        pass = t.check(result, ...t.args);
      } else {
        pass = deepEqual(result, t.expected);
      }
      if (!pass) allPass = false;

      const argsStr = t.args.map(a => JSON.stringify(a)).join(', ');
      const expectedStr = t.expectedLabel ? t.expectedLabel : JSON.stringify(t.expected);

      if (pass) {
        logConsole(`[Teste ${i + 1}] ${challenge.fnName}(${argsStr}) → ${JSON.stringify(result)} ✅`, 'pass');
      } else if (errorMsg) {
        logConsole(`[Teste ${i + 1}] ${challenge.fnName}(${argsStr}) → Erro: ${errorMsg} ❌`, 'fail');
      } else {
        logConsole(`[Teste ${i + 1}] ${challenge.fnName}(${argsStr}) → ${JSON.stringify(result)} (esperado ${expectedStr}) ❌`, 'fail');
      }
    });

    if (allPass) {
      completed.add(challenge.id);
      saveCompleted(completed);
      hpBarFill.classList.add('defeated');

      const isLast = CHALLENGES[CHALLENGES.length - 1].id === challenge.id;
      if (isLast) {
        logConsole(`🏆 Chamado resolvido! Todos os chamados desta central foram atendidos!`, 'success');
      } else {
        logConsole(`✅ Chamado resolvido! Próximo chamado liberado.`, 'success');
        btnNext.style.display = 'inline-block';
      }
      renderSidebar();

      if (typeof window.reportActivity === 'function') {
        window.reportActivity(
          'cod_seguranca_ia_pratica',
          `Codificação — Segurança e IA — Chamado ${challenge.id}: ${challenge.title} (resolvido)`,
          { challengeId: challenge.id, total: CHALLENGES.length, completed: completed.size }
        );
      }
    } else {
      logConsole('❌ Ainda não bateu com o esperado! Ajuste o código e tente de novo.', 'warn');
    }
  }

  btnHint.addEventListener('click', () => {
    const showing = hintBox.classList.toggle('show');
    btnHint.textContent = showing ? '💡 Ocultar dica' : '💡 Ver dica';
  });

  btnRun.addEventListener('click', runChallenge);
  btnNext.addEventListener('click', () => {
    const idx = CHALLENGES.findIndex(c => c.id === selectedId);
    const next = CHALLENGES[idx + 1];
    if (next) selectChallenge(next.id);
  });

  selectChallenge(selectedId);
</script>

<div vw class="enabled">
  <div vw-access-button class="active"></div>
  <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
  </div>
</div>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
  if (window.VLibras) new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

</body>
