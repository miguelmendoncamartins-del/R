<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Multimídia e Versionamento: Teoria</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d0a; --panel:#10140f; --panel2:#0d110c; --line:#223022;
    --green:#7cff3f; --green-dim:#4a9a2a; --blood:#c1121f; --blood-bright:#ff3b30;
    --yellow:#d4c86a; --ink:#d9e6d2; --ink-dim:#6f8368;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--green-dim); background:#050805;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(124,255,63,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .progress-track{ height:5px; background:var(--panel2); border-bottom:1px solid var(--line); flex-shrink:0; }
  .progress-fill{ height:100%; background:var(--green); width:0%; transition:width 0.4s ease; }

  .stage{ flex:1; min-height:0; padding:18px; overflow-y:auto; display:flex; justify-content:center; }
  .story-wrap{ width:100%; max-width:620px; display:flex; flex-direction:column; gap:14px; }

  .eri-row{ display:flex; align-items:flex-start; gap:12px; }
  .eri-avatar{
    font-size:44px; line-height:1; flex-shrink:0; filter:drop-shadow(0 0 6px rgba(124,255,63,0.5));
  }
  .speech-bubble{
    background:var(--panel); border:1px solid var(--green-dim); padding:16px 18px;
    font-size:14px; line-height:1.7; position:relative;
  }
  .speech-bubble .eri-name{
    display:block; font-family:var(--user-font-display, 'VT323', monospace); font-size:18px; color:var(--green);
    letter-spacing:1px; margin-bottom:6px;
  }
  .speech-bubble code{ color:var(--yellow); }

  .card{ background:var(--panel); border:1px solid var(--line); padding:16px 18px; }
  .card h2{
    font-family:var(--user-font-display, 'VT323', monospace); font-size:20px; color:var(--yellow); margin:0 0 12px; letter-spacing:1px;
  }

  .option{
    display:flex; align-items:center; gap:10px; padding:10px 14px; margin-bottom:8px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:13px;
  }
  .option:hover{ border-color:var(--green-dim); }
  .option .opt-letter{
    width:22px; height:22px; flex-shrink:0; border:1px solid var(--ink-dim); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--ink-dim);
  }
  .option.correct{ border-color:var(--green); background:rgba(124,255,63,0.08); }
  .option.correct .opt-letter{ border-color:var(--green); color:var(--green); }
  .option.incorrect{ border-color:var(--blood-bright); background:rgba(255,59,48,0.08); }
  .option.incorrect .opt-letter{ border-color:var(--blood-bright); color:var(--blood-bright); }
  .option.disabled{ cursor:default; }

  .feedback{
    margin-top:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; border:1px dashed var(--line);
  }
  .feedback.correct{ border-color:var(--green); color:var(--ink); }
  .feedback.incorrect{ border-color:var(--blood-bright); color:var(--ink); }
  .feedback b{ color:var(--yellow); }

  .actions{ display:flex; justify-content:flex-end; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--green); color:#04220a; border:none; padding:10px 20px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.35; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--green); border:1px solid var(--green-dim); }

  .finish-screen{ text-align:center; }
  .finish-screen .trophy{ font-size:56px; margin-bottom:10px; }
  .finish-screen h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:26px; color:var(--green); margin:0 0 10px; }
  .finish-screen p{ font-size:13px; color:var(--ink-dim); line-height:1.6; margin:0 0 6px; }
  .finish-screen .score{ font-size:20px; color:var(--yellow); font-weight:800; margin:14px 0; }

  .btn-topbar{
    font-family:inherit; font-size:10px; font-weight:800; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--green); border:1px solid var(--green-dim); padding:5px 10px;
    cursor:pointer; border-radius:2px;
  }
  .btn-topbar:hover{ background:rgba(124,255,63,0.1); }
  .btn-topbar:disabled{ opacity:0.5; cursor:wait; }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:10px; }
    .speech-bubble{ padding:12px 14px; }
    .card{ padding:12px 14px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'fund_multimidia_teoria';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/vendor/pptxgen.bundle.js"></script>
<script src="../../../shared/slides-generator.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>JOGOS — MULTIMÍDIA E VERSIONAMENTO (TEORIA)</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btnGenSlides" class="btn-topbar" style="display:none;">🖨️ Gerar Slides (PPTX)</button>
      <span>ETAPA <span id="lblStepNum">1</span> DE <span id="lblStepTotal">5</span></span>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="stage">
    <div class="story-wrap" id="storyWrap"></div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `fund_multimidia_teoria_progress_${username}`;

  const STEPS = [
    {
      story: 'Sou o <b>Eri</b> mais uma vez! Chegou a hora de dar vida visual ao jogo: a <b>inserção de sprites</b> é o processo de importar imagens (personagens, itens, cenário) pro projeto e usá-las como a "pele" visual dos objetos do jogo. Um sprite sozinho é só uma imagem — é o código que decide onde e como ela aparece.',
      question: {
        prompt: 'Depois de importar a imagem de um personagem pro projeto, o que ainda falta pra ela realmente aparecer na posição certa, dentro do jogo em execução?',
        options: [
          'Associar a imagem a um objeto do jogo e definir sua posição/comportamento no código',
          'Nada, a imagem aparece sozinha assim que é importada',
          'Trocar o nome do arquivo pra "sprite.png"',
          'Aumentar o zoom da engine'
        ],
        correctIndex: 0,
        explanation: 'Isso! Importar a imagem é só o primeiro passo — é o código que associa esse sprite a um objeto do jogo e define onde/como ele se comporta na tela.'
      }
    },
    {
      story: 'Quando o jogo cresce, a <b>integração de assets gráficos</b> vira questão de organização: pastas separadas por tipo (personagens, cenário, UI), nomes de arquivo consistentes, e reaproveitamento de spritesheets (várias imagens numa única textura) evitam bagunça e cortam desperdício de memória.',
      question: {
        prompt: 'Um projeto tem centenas de imagens soltas, todas na mesma pasta, com nomes tipo "img1.png", "img2.png"... e o time está perdendo tempo procurando cada asset. Qual prática de integração de assets resolveria isso?',
        options: [
          'Organizar os assets em pastas por categoria, com nomes descritivos e consistentes',
          'Apagar metade das imagens sem critério',
          'Aumentar a resolução de todas as imagens',
          'Colocar todos os assets num único arquivo de texto'
        ],
        correctIndex: 0,
        explanation: 'Exato! Organização em pastas por categoria, com nomes claros, é o que evita a bagunça de assets à medida que o projeto cresce.'
      }
    },
    {
      story: 'A <b>integração de áudio</b> separa dois tipos de som: <b>efeitos sonoros</b> (curtos, disparados por uma ação específica, como um pulo ou dano) e <b>música/trilha sonora</b> (contínua, tocando em loop de fundo). Cada som costuma ser disparado por um evento do jogo — o efeito de "dano", por exemplo, toca quando a colisão do inimigo é detectada.',
      question: {
        prompt: 'Um jogo deveria tocar um som de "dano" toda vez que o personagem colide com um inimigo, mas o som nunca toca. Qual é a causa mais provável?',
        options: [
          'O evento de colisão não está disparando a reprodução do efeito sonoro correspondente',
          'O arquivo de áudio está com a cor errada',
          'O jogo está sem sprites',
          'Sons de dano nunca podem ser implementados em jogos 2D'
        ],
        correctIndex: 0,
        explanation: 'Isso mesmo! Assim como eventos disparam mudanças visuais, eles também precisam disparar a reprodução do som certo no momento certo.'
      }
    },
    {
      story: 'Por fim, todo projeto de jogo (e de código em geral) se beneficia do <b>versionamento</b>: uma ferramenta como o <b>Git</b> guarda o histórico de mudanças do código em "commits", permitindo voltar a uma versão anterior se algo quebrar, e permitindo que várias pessoas trabalhem no mesmo projeto sem sobrescrever o trabalho umas das outras.',
      question: {
        prompt: 'Um desenvolvedor fez uma mudança grande no código, o jogo parou de funcionar, e ele não lembra exatamente o que mudou. Como o versionamento de código ajudaria nessa situação?',
        options: [
          'Permitindo comparar ou voltar para uma versão anterior (commit) que ainda funcionava',
          'Apagando automaticamente o código com bug',
          'Impedindo que erros aconteçam no futuro',
          'Só serve pra times grandes, não ajuda em nada sozinho'
        ],
        correctIndex: 0,
        explanation: 'Correto! O histórico de commits permite comparar versões e voltar pra um estado anterior funcional — uma rede de segurança essencial em qualquer projeto.'
      }
    },
    {
      story: 'Quando duas pessoas alteram a mesma parte de um arquivo ao mesmo tempo, o Git aponta um <b>conflito de merge</b> — cabe ao time decidir manualmente qual mudança (ou combinação das duas) deve prevalecer antes de continuar. Com sprites, assets, áudio e versionamento na caixa de ferramentas, seu jogo já ganha vida visual, sonora e um histórico seguro de trabalho!',
      question: {
        prompt: 'Dois colegas editaram a mesma linha do mesmo arquivo de código, cada um no seu computador, e agora o Git avisa sobre um "conflito de merge" ao tentar juntar as mudanças. O que isso significa?',
        options: [
          'É preciso decidir manualmente qual das duas mudanças (ou uma combinação delas) deve ficar, antes de continuar',
          'O projeto foi corrompido e precisa ser recriado do zero',
          'Um dos dois computadores está com vírus',
          'O Git resolve esse tipo de conflito sozinho, sem intervenção humana'
        ],
        correctIndex: 0,
        explanation: 'Isso! Um conflito de merge exige decisão humana — o Git avisa quando duas mudanças colidem, mas não escolhe sozinho qual delas deve prevalecer.'
      }
    },
    {
      story: 'Voltando aos sprites: personagens que "andam" ou "atacam" de verdade usam uma <b>spritesheet</b> — uma única imagem com vários quadros (frames) da animação lado a lado. O código troca qual frame é exibido a cada intervalo de tempo, criando a ilusão de movimento, como um flipbook.',
      question: {
        prompt: 'Um personagem se move pelo cenário, mas o sprite dele fica completamente parado, sem nenhuma animação de "andar". O que provavelmente falta?',
        options: [
          'Trocar qual frame da spritesheet é exibido em intervalos regulares, criando a animação de andar',
          'Aumentar a velocidade de movimento do personagem',
          'Trocar a cor do personagem',
          'Isso é impossível de resolver sem redesenhar o sprite inteiro'
        ],
        correctIndex: 0,
        explanation: 'Exato! Sem alternar os frames da spritesheet ao longo do tempo, o sprite fica estático mesmo se movendo pelo cenário — a animação depende dessa troca de quadros.'
      }
    },
    {
      story: 'Sobre áudio: a trilha sonora de fundo normalmente é configurada pra tocar em <b>loop</b> (repetir automaticamente ao chegar no final), diferente de um efeito sonoro curto, que toca uma vez e para. Esquecer de marcar a música como loop faz ela simplesmente silenciar quando o arquivo termina.',
      question: {
        prompt: 'A música de fundo de um jogo toca normalmente, mas silencia completamente depois de alguns minutos, sem motivo aparente — o jogador percebe que era só a duração do arquivo. O que provavelmente não foi configurado?',
        options: [
          'A opção de tocar a música em loop (repetir ao chegar no final)',
          'O volume geral do jogo',
          'A resolução do arquivo de áudio',
          'A cor de fundo da tela'
        ],
        correctIndex: 0,
        explanation: 'Isso! Música de fundo precisa ser configurada explicitamente pra repetir (loop) — sem isso, ela simplesmente para quando o arquivo termina.'
      }
    },
    {
      story: 'No Git, <b>branches</b> (ramificações) permitem trabalhar numa funcionalidade nova sem mexer direto no código estável da <b>main</b> (ramo principal). Só depois que a funcionalidade está pronta e testada, ela é unida (merge) de volta à main — protegendo o que já funciona.',
      question: {
        prompt: 'Dois desenvolvedores editam código direto na branch principal (main) ao mesmo tempo, e um recurso ainda incompleto quebra o jogo pra todo mundo do time. O que uma estratégia de branches teria evitado?',
        options: [
          'Desenvolver o recurso novo numa branch separada, só unindo (merge) à main quando estivesse pronto e testado',
          'Trabalhar sempre sozinho, sem nunca usar Git em equipe',
          'Apagar o código de um dos dois desenvolvedores',
          'Branches não têm relação nenhuma com esse tipo de problema'
        ],
        correctIndex: 0,
        explanation: 'Correto! Isolar trabalho em progresso numa branch separada protege a main de ficar quebrada por código ainda incompleto.'
      }
    },
    {
      story: 'Nem tudo deve entrar no controle de versão: arquivos temporários, pastas geradas automaticamente (como builds compiladas) ou pesados demais poluem o histórico e deixam o repositório gigante. Um arquivo <b>.gitignore</b> lista o que o Git deve simplesmente ignorar, nunca versionando.',
      question: {
        prompt: 'O repositório de um projeto ficou enorme e lento porque a pasta inteira de "build" (gerada automaticamente a cada compilação) está sendo versionada junto com o código-fonte. Qual prática evitaria isso?',
        options: [
          'Listar a pasta de build num arquivo .gitignore, pra o Git nunca versionar esse conteúdo gerado',
          'Apagar o Git do projeto por completo',
          'Compactar a pasta de build antes de cada commit',
          'Isso é normal e não há como evitar'
        ],
        correctIndex: 0,
        explanation: 'Isso! O .gitignore existe exatamente pra manter arquivos gerados/temporários fora do controle de versão, mantendo o repositório limpo e leve.'
      }
    },
    {
      story: 'Por fim, a forma de <b>commitar</b> importa tanto quanto commitar: commits pequenos, com mensagens descritivas ("corrige colisão do inimigo com parede"), tornam o histórico útil de verdade. Um único commit gigante chamado "mudanças" não ajuda ninguém a entender o que realmente mudou meses depois.',
      question: {
        prompt: 'Um projeto tem um histórico de commits cheio de mensagens como "fix", "fix2", "ajustes finais v3" — e ninguém consegue entender o que mudou em cada um sem abrir o código inteiro. O que deveria ter sido feito diferente?',
        options: [
          'Fazer commits menores e mais frequentes, com mensagens descritivas do que de fato mudou',
          'Nunca fazer commits, só salvar o projeto localmente',
          'Apagar o histórico de commits antigo',
          'Commitar o projeto inteiro de uma vez só, no final do desenvolvimento'
        ],
        correctIndex: 0,
        explanation: 'Exato! Commits pequenos e bem descritos tornam o histórico do projeto uma ferramenta útil, não só uma obrigação — facilita entender e reverter mudanças específicas.'
      }
    }
  ];

  window.generateSlidesForGestao = function () {
    return window.PortalSlides.generate({
      title: 'Jogos — Multimídia e Versionamento',
      subtitle: 'Aula Teórica · Trilha Multimídia e Versionamento · Turma Jogos Digitais',
      capacidade: 'Reconhecer os processos de integração de elementos de multimídia / Reconhecer métodos de versionamento aplicados na produção de jogos.',
      steps: STEPS,
      fileName: 'fund-multimidia-teoria-slides.pptx',
      closingTitle: 'Hora da prática!',
      closingText: 'Abra o módulo "Prática — Central de Suporte: Multimídia e Versionamento" no Portal de Aulas para os alunos resolverem chamados de verdade.'
    });
  };

  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Jogos — Multimídia e Versionamento',
      subtitle: 'Aula Teórica · Trilha Multimídia e Versionamento · Turma Jogos Digitais',
      items: STEPS.map((step, i) => ({
        number: i + 1,
        prompt: step.question.prompt,
        options: step.question.options,
        correctIndex: step.question.correctIndex,
        answer: step.question.options[step.question.correctIndex]
      })),
      fileName: 'fund-multimidia-teoria-gabarito.txt'
    });
  };

  const role = urlParams.get('role') || 'aluno';
  const btnGenSlides = document.getElementById('btnGenSlides');
  if (role === 'professor') {
    btnGenSlides.style.display = 'inline-block';
    btnGenSlides.addEventListener('click', () => {
      btnGenSlides.disabled = true;
      btnGenSlides.textContent = '⏳ Gerando...';
      setTimeout(() => {
        window.generateSlidesForGestao();
        btnGenSlides.disabled = false;
        btnGenSlides.textContent = '🖨️ Gerar Slides (PPTX)';
      }, 50);
    });
  }

  const storyWrap = document.getElementById('storyWrap');
  const lblStepNum = document.getElementById('lblStepNum');
  const lblStepTotal = document.getElementById('lblStepTotal');
  const progressFill = document.getElementById('progressFill');

  lblStepTotal.textContent = STEPS.length;

  function loadProgress() {
    try {
      return JSON.parse(localStorage.getItem(PROGRESS_KEY) || 'null');
    } catch (e) {
      return null;
    }
  }

  function saveProgress(data) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(data));
  }

  const ORDER_KEY = PROGRESS_KEY.replace('_progress_', '_order_');

  function shuffleOrder() {
    const arr = STEPS.map((_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function loadOrder() {
    try {
      const parsed = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
      if (Array.isArray(parsed) && parsed.length === STEPS.length && parsed.every(n => Number.isInteger(n) && n >= 0 && n < STEPS.length)) {
        return parsed;
      }
    } catch (e) {}
    return null;
  }

  const saved = loadProgress();
  let stepOrder = (saved && !saved.completed) ? (loadOrder() || shuffleOrder()) : shuffleOrder();
  localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
  let currentStepIndex = (saved && !saved.completed) ? Math.min(saved.lastStepIndex || 0, STEPS.length - 1) : 0;
  let correctCount = (saved && typeof saved.correctCount === 'number') ? saved.correctCount : 0;

  function updateProgressBar() {
    const pct = Math.round(((currentStepIndex) / STEPS.length) * 100);
    progressFill.style.width = pct + '%';
    lblStepNum.textContent = Math.min(currentStepIndex + 1, STEPS.length);
  }

  function reportStep(label) {
    if (typeof window.reportActivity === 'function') {
      window.reportActivity('fund_multimidia_teoria', label, {
        step: currentStepIndex + 1,
        total: STEPS.length,
        correctCount: correctCount
      });
    }
  }

  function renderStory() {
    updateProgressBar();
    const step = STEPS[stepOrder[currentStepIndex]];
    reportStep(`Jogos — Multimídia e Versionamento — Etapa ${currentStepIndex + 1}/${STEPS.length}`);

    storyWrap.innerHTML = '';

    const row = document.createElement('div');
    row.className = 'eri-row';
    row.innerHTML = `
      <div class="eri-avatar">🦈</div>
      <div class="speech-bubble">
        <span class="eri-name">Eri, o Guardião do Oceano de Código</span>
        ${step.story}
      </div>
    `;
    storyWrap.appendChild(row);

    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.innerHTML = `<button class="btn" id="btnNext">Próximo →</button>`;
    storyWrap.appendChild(actions);

    document.getElementById('btnNext').addEventListener('click', renderQuestion);
  }

  function renderQuestion() {
    const step = STEPS[stepOrder[currentStepIndex]];
    const q = step.question;

    storyWrap.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2>❓ ${q.prompt}</h2>`;

    const optionsWrap = document.createElement('div');
    const letters = ['A', 'B', 'C', 'D'];
    let answered = false;

    const order = q.options.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    const correctPos = order.indexOf(q.correctIndex);

    order.forEach((origIdx, pos) => {
      const optText = q.options[origIdx];
      const opt = document.createElement('div');
      opt.className = 'option';
      opt.innerHTML = `<span class="opt-letter">${letters[pos]}</span><span>${optText}</span>`;
      opt.addEventListener('click', () => {
        if (answered) return;
        answered = true;
        selectAnswer(pos);
      });
      optionsWrap.appendChild(opt);

      function selectAnswer(chosenIdx) {
        const allOptionEls = optionsWrap.querySelectorAll('.option');
        allOptionEls.forEach(el => el.classList.add('disabled'));

        const isCorrect = chosenIdx === correctPos;
        allOptionEls[chosenIdx].classList.add(isCorrect ? 'correct' : 'incorrect');
        if (!isCorrect) {
          allOptionEls[correctPos].classList.add('correct');
        }
        if (isCorrect) correctCount++;

        const feedback = document.createElement('div');
        feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
        feedback.innerHTML = isCorrect
          ? `✅ Correto! ${q.explanation}`
          : `❌ Não foi dessa vez. A resposta certa é "<b>${q.options[q.correctIndex]}</b>": ${q.explanation.replace(/^(Isso mesmo!|Isso!|Correto!|Exato!|Perfeito!|Correta!)\s*/i, '')}`;
        card.appendChild(feedback);

        const actions = document.createElement('div');
        actions.className = 'actions';
        actions.style.marginTop = '14px';
        actions.innerHTML = `<button class="btn" id="btnNextAfterAnswer">Próximo →</button>`;
        card.appendChild(actions);

        saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
        reportStep(`Jogos — Multimídia e Versionamento — Etapa ${currentStepIndex + 1}/${STEPS.length} (respondida)`);

        document.getElementById('btnNextAfterAnswer').addEventListener('click', () => {
          currentStepIndex++;
          if (currentStepIndex >= STEPS.length) {
            finishJourney();
          } else {
            saveProgress({ lastStepIndex: currentStepIndex, correctCount, completed: false });
            renderStory();
          }
        });
      }
    });

    card.appendChild(optionsWrap);
    storyWrap.innerHTML = '';
    storyWrap.appendChild(card);
  }

  function finishJourney(reviewOnly) {
    const pct = STEPS.length > 0 ? Math.round((correctCount / STEPS.length) * 100) : 0;
    const passed = reviewOnly ? true : pct >= 80;
    if (!reviewOnly) {
      saveProgress({ lastStepIndex: STEPS.length, correctCount, completed: passed });
      reportStep(`Jogos — Multimídia e Versionamento — ${passed ? 'Concluída' : 'Não concluída'} (${correctCount}/${STEPS.length})`);
    }

    progressFill.style.width = '100%';
    lblStepNum.textContent = STEPS.length;

    storyWrap.innerHTML = passed ? `
      <div class="card finish-screen">
        <div class="trophy">🏆</div>
        <h2>Multimídia e Versionamento concluídos!</h2>
        <p>Você já reconhece inserção de sprites, organização de assets gráficos, integração de áudio e o básico de versionamento com Git.</p>
        <div class="score">Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%).</div>
        <p>Agora é hora de colocar a mão na massa: volte à trilha e abra o módulo de prática da Central de Suporte.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn btn-secondary" id="btnRestart">🔁 Rever a teoria</button>
        </div>
      </div>
    ` : `
      <div class="card finish-screen">
        <div class="trophy">📚</div>
        <h2>Quase lá!</h2>
        <p>Você acertou ${correctCount} de ${STEPS.length} perguntas (${pct}%) — é preciso pelo menos 80% de acerto para concluir esta atividade.</p>
        <div class="actions" style="justify-content:center; margin-top:12px;">
          <button class="btn" id="btnRestart">🔁 Tentar novamente</button>
        </div>
      </div>
    `;

    document.getElementById('btnRestart').addEventListener('click', () => {
      currentStepIndex = 0;
      correctCount = 0;
      stepOrder = shuffleOrder();
      localStorage.setItem(ORDER_KEY, JSON.stringify(stepOrder));
      saveProgress({ lastStepIndex: 0, correctCount: 0, completed: false });
      renderStory();
    });
  }

  if (saved && saved.completed) {
    currentStepIndex = STEPS.length;
    finishJourney(true);
  } else {
    renderStory();
  }
</script>
