<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — JavaScript Básico</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d0a; --panel:#10140f; --panel2:#0d110c; --line:#223022;
    --green:#7cff3f; --green-dim:#4a9a2a; --blood:#c1121f; --blood-bright:#ff3b30;
    --yellow:#d4c86a; --ink:#d9e6d2; --ink-dim:#6f8368;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--green-dim); background:#050805;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(124,255,63,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .stage{ flex:1; min-height:0; padding:12px; overflow:hidden; display:flex; }
  .layout{ display:flex; flex-direction:row; flex-wrap:nowrap; gap:14px; width:100%; height:100%; }

  .sidebar{
    width:190px; flex-shrink:0; height:100%; overflow-y:auto;
    background:var(--panel); border:1px solid var(--line); padding:8px;
  }
  .sidebar-title{ font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; padding:0 2px; }
  .challenge-item{
    display:flex; align-items:center; gap:8px; padding:8px 8px; margin-bottom:4px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:11px;
  }
  .challenge-item .status{ font-size:13px; width:16px; text-align:center; flex-shrink:0; }
  .challenge-item.active{ border-color:var(--green); color:var(--green); }
  .challenge-item.completed{ color:var(--ink); }
  .challenge-item.locked{ opacity:0.4; cursor:not-allowed; }
  .challenge-item .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .main-panel{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; height:100%; overflow-y:auto; }

  .challenge-header{ flex-shrink:0; background:var(--panel); border:1px solid var(--line); padding:10px 14px; }

  .enemy-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .enemy-avatar{ font-size:32px; line-height:1; filter:drop-shadow(0 0 6px rgba(255,59,48,0.4)); }
  .enemy-info{ flex:1; min-width:0; }
  .enemy-name{ font-size:11.5px; color:var(--yellow); font-weight:800; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
  .hp-bar-track{ width:100%; height:8px; background:#1a221a; border:1px solid var(--line); overflow:hidden; }
  .hp-bar-fill{ height:100%; width:100%; background:var(--blood-bright); transition:width 0.6s ease; }
  .hp-bar-fill.defeated{ width:0%; background:var(--ink-dim); }

  .challenge-header h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:19px; color:var(--green); margin:0 0 8px; letter-spacing:1px; }
  .challenge-header p{ font-size:12px; color:var(--ink-dim); margin:8px 0 0; line-height:1.5; }
  .challenge-header code{ color:var(--yellow); }

  .explanation-box{
    background:#081208; border:1px solid var(--green-dim); padding:10px 12px;
    font-size:11.5px; color:var(--ink); line-height:1.6;
  }
  .explanation-box .exp-title{
    color:var(--green); font-weight:800; text-transform:uppercase; font-size:10px; letter-spacing:1px; margin-bottom:6px;
  }
  .explanation-box code{ color:var(--yellow); }
  .explanation-box pre{
    background:#000; border:1px solid var(--line); padding:8px; margin:6px 0 0;
    overflow-x:auto; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--yellow); white-space:pre;
  }

  .given-vars{ font-size:10.5px; color:var(--ink-dim); margin-top:8px; }
  .given-vars b{ color:var(--yellow); }

  .hint-toggle{
    display:inline-block; margin-top:8px; font-size:10.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--yellow); border:1px solid var(--green-dim); padding:5px 10px; cursor:pointer; border-radius:2px;
  }
  .hint-toggle:hover{ background:rgba(212,200,106,0.1); }
  .hint-box{
    display:none; margin-top:8px; background:var(--panel2); border:1px dashed var(--yellow);
    padding:8px 10px; font-size:11.5px; color:var(--ink); line-height:1.5;
  }
  .hint-box.show{ display:block; }
  .hint-box b{ color:var(--yellow); }

  textarea#codeInput{
    width:100%; flex:1; min-height:60px; resize:vertical; background:#000; color:var(--green);
    border:1px solid var(--line); font-family:'JetBrains Mono', monospace; font-size:12px;
    padding:10px; outline:none; line-height:1.5;
  }
  textarea#codeInput:focus{ border-color:var(--green); }

  .actions{ display:flex; gap:8px; align-items:center; flex-shrink:0; flex-wrap:wrap; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11px; letter-spacing:1px; text-transform:uppercase;
    background:var(--green); color:#04220a; border:none; padding:9px 16px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.5; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--green); border:1px solid var(--green-dim); }

  .console{
    background:#060806; border:1px solid var(--line); padding:8px 10px; font-size:11px;
    flex:1; min-height:50px; overflow-y:auto; line-height:1.6;
  }
  .console .line.info{ color:var(--ink-dim); }
  .console .line.pass{ color:var(--green); }
  .console .line.fail{ color:var(--blood-bright); }
  .console .line.success{ color:var(--green); font-weight:bold; }
  .console .line.warn{ color:var(--yellow); }

  /* Celular/telas estreitas: a barra lateral + painel lado a lado espreme
     demais o conteúdo (texto quebrando palavra a palavra). Empilha tudo
     numa coluna só e deixa a página inteira rolar, em vez de depender de
     várias regiões de scroll aninhadas. */
  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:8px; }
    .layout{ flex-direction:column; height:auto; }
    .sidebar{ width:100%; height:auto; max-height:150px; }
    .main-panel{ height:auto; overflow-y:visible; }
    textarea#codeInput{ min-height:110px; }
    .console{ flex:none; max-height:160px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'js_basico';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>JAVASCRIPT — ARENA DE DUELOS (BÁSICO)</div>
    <div>VITÓRIAS: <span id="lblProgress">0/0</span></div>
  </div>

  <div class="stage">
    <div class="layout">
      <div class="sidebar">
        <div class="sidebar-title">Adversários</div>
        <div id="challengeList"></div>
      </div>

      <div class="main-panel">
        <div class="challenge-header">
          <div class="enemy-row">
            <div class="enemy-avatar" id="enemyAvatar">💤</div>
            <div class="enemy-info">
              <div class="enemy-name" id="enemyName">--</div>
              <div class="hp-bar-track"><div class="hp-bar-fill" id="hpBarFill"></div></div>
            </div>
          </div>
          <h2 id="challengeTitle">--</h2>

          <div class="explanation-box">
            <div class="exp-title">📖 Como funciona</div>
            <div id="explanationText"></div>
          </div>

          <p id="challengeDesc"></p>
          <div class="given-vars" id="givenVarsLabel" style="display:none;"></div>

          <button class="hint-toggle" id="btnHint">💡 Ver dica</button>
          <div class="hint-box" id="hintBox"></div>
        </div>

        <textarea id="codeInput" spellcheck="false"></textarea>

        <div class="actions">
          <button class="btn" id="btnRun">⚔ Atacar!</button>
          <button class="btn btn-secondary" id="btnNext" style="display:none;">Próximo duelo →</button>
        </div>

        <div class="console" id="consoleOutput"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `js_basico_progress_${username}`;

  const CHALLENGES = [
    {
      id: 1,
      title: 'Desperte seu Poder',
      enemyName: 'Pixel Adormecido',
      enemyEmoji: '💤',
      resultVar: 'resultado',
      givenVars: [],
      starter: '// crie uma variável chamada resultado com o valor 100\n\n',
      explanation: 'Uma <b>variável</b> é como uma caixinha com um nome, onde você guarda um valor para usar depois. Para criar uma, use a palavra <code>let</code>, dê um nome, um sinal de igual <code>=</code> e o valor.<pre>let idade = 10;</pre>Isso cria uma caixinha chamada <code>idade</code> guardando o número 10.',
      desc: 'O <b>Pixel Adormecido</b> 💤 só acorda se você invocar seu poder inicial. Crie uma variável chamada <code>resultado</code> guardando o valor <b>100</b>.',
      hint: 'Use <code>let</code>, dê o nome exato pedido pra variável e o valor certo, seguido de ponto e vírgula.',
      tests: [
        { values: {}, expected: 100 }
      ]
    },
    {
      id: 2,
      title: 'Soma de Poderes',
      enemyName: 'Duende Somador',
      enemyEmoji: '➕',
      resultVar: 'resultado',
      givenVars: ['a', 'b'],
      starter: '// as variáveis a e b já existem\n// crie uma variável chamada resultado com a soma de a e b\n\n',
      explanation: 'Você pode somar dois números com o sinal <code>+</code>. Se já existem duas variáveis, por exemplo <code>x</code> e <code>y</code>, é só somar:<pre>let total = x + y;</pre>',
      desc: 'O <b>Duende Somador</b> ➕ combina dois poderes. As variáveis <code>a</code> e <code>b</code> já existem — crie uma variável chamada <code>resultado</code> guardando a soma delas.',
      hint: 'Qual operador matemático você usaria para somar dois valores? Aplique ele entre <code>a</code> e <code>b</code>.',
      tests: [
        { values: { a: 2, b: 3 }, expected: 5 },
        { values: { a: 10, b: 15 }, expected: 25 },
        { values: { a: 0, b: 0 }, expected: 0 }
      ]
    },
    {
      id: 3,
      title: 'Poder Restante',
      enemyName: 'Fantasma Subtrator',
      enemyEmoji: '➖',
      resultVar: 'resultado',
      givenVars: ['a', 'b'],
      starter: '// as variáveis a e b já existem\n// crie uma variável chamada resultado com a subtração de a por b\n\n',
      explanation: 'Para subtrair, use o sinal <code>-</code>:<pre>let sobra = x - y;</pre>',
      desc: 'O <b>Fantasma Subtrator</b> ➖ rouba parte da sua energia. As variáveis <code>a</code> e <code>b</code> já existem — crie <code>resultado</code> com o valor de <code>a</code> menos <code>b</code>.',
      hint: 'Qual operador faz uma subtração? Repare na ordem: é <code>a</code> menos <code>b</code>, não o contrário.',
      tests: [
        { values: { a: 10, b: 4 }, expected: 6 },
        { values: { a: 5, b: 5 }, expected: 0 },
        { values: { a: 3, b: 10 }, expected: -7 }
      ]
    },
    {
      id: 4,
      title: 'Poder em Dobro',
      enemyName: 'Clone Multiplicador',
      enemyEmoji: '✖️',
      resultVar: 'resultado',
      givenVars: ['a', 'b'],
      starter: '// as variáveis a e b já existem\n// crie uma variável chamada resultado com a multiplicação de a por b\n\n',
      explanation: 'Para multiplicar, use o sinal <code>*</code>:<pre>let dobro = x * 2;</pre>',
      desc: 'O <b>Clone Multiplicador</b> ✖️ duplica ataques. As variáveis <code>a</code> e <code>b</code> já existem — crie <code>resultado</code> com o valor de <code>a</code> vezes <code>b</code>.',
      hint: 'Qual sinal representa multiplicação em JavaScript? Aplique ele entre <code>a</code> e <code>b</code>.',
      tests: [
        { values: { a: 3, b: 4 }, expected: 12 },
        { values: { a: 5, b: 0 }, expected: 0 },
        { values: { a: -2, b: 3 }, expected: -6 }
      ]
    },
    {
      id: 5,
      title: 'Divisão de Energia',
      enemyName: 'Feiticeiro Divisor',
      enemyEmoji: '➗',
      resultVar: 'resultado',
      givenVars: ['a', 'b'],
      starter: '// as variáveis a e b já existem\n// crie uma variável chamada resultado com a divisão de a por b\n\n',
      explanation: 'Para dividir, use o sinal <code>/</code>:<pre>let metade = x / 2;</pre>',
      desc: 'O <b>Feiticeiro Divisor</b> ➗ reparte energias. As variáveis <code>a</code> e <code>b</code> já existem — crie <code>resultado</code> com o valor de <code>a</code> dividido por <code>b</code>.',
      hint: 'Qual sinal representa divisão em JavaScript? Repare na ordem: é <code>a</code> dividido por <code>b</code>.',
      tests: [
        { values: { a: 10, b: 2 }, expected: 5 },
        { values: { a: 9, b: 3 }, expected: 3 },
        { values: { a: 7, b: 2 }, expected: 3.5 }
      ]
    },
    {
      id: 6,
      title: 'Duelo de Poderes',
      enemyName: 'Sentinela Balança',
      enemyEmoji: '⚖️',
      resultVar: 'resultado',
      givenVars: ['a', 'b'],
      starter: '// as variáveis a e b já existem\n// crie uma variável chamada resultado que seja true se a for maior que b, ou false caso contrário\n\n',
      explanation: 'JavaScript tem operadores de comparação que já devolvem <code>true</code> ou <code>false</code>. Por exemplo, <code>x &lt; y</code> resulta em <code>true</code> se x for menor que y.<pre>let cabe = x &lt; 10;</pre>',
      desc: 'A <b>Sentinela Balança</b> ⚖️ só tomba se um lado pesar mais que o outro. As variáveis <code>a</code> e <code>b</code> já existem — crie <code>resultado</code> com <b>true</b> se <code>a</code> for maior que <code>b</code>, ou <b>false</b> caso contrário.',
      hint: 'Existe um operador que compara se um valor é maior que outro e já devolve true ou false sozinho. Aplique-o entre a e b, na ordem certa.',
      tests: [
        { values: { a: 10, b: 5 }, expected: true },
        { values: { a: 5, b: 10 }, expected: false },
        { values: { a: 7, b: 7 }, expected: false }
      ]
    },
    {
      id: 7,
      title: 'Resíduo Arcano',
      enemyName: 'Espírito do Resto',
      enemyEmoji: '🌀',
      resultVar: 'resultado',
      givenVars: ['a', 'b'],
      starter: '// as variáveis a e b já existem\n// crie uma variável chamada resultado com o resto da divisão de a por b\n\n',
      explanation: 'O operador de resto (módulo) devolve o que sobra de uma divisão inteira.<pre>let sobra = 10 % 3; // sobra vale 1</pre>',
      desc: 'O <b>Espírito do Resto</b> 🌀 só se revela quando você calcula exatamente o que sobra de uma divisão. As variáveis <code>a</code> e <code>b</code> já existem — crie <code>resultado</code> com o resto da divisão de <code>a</code> por <code>b</code>.',
      hint: 'Existe um operador específico para "o que sobra" de uma divisão — não é a barra normal de divisão.',
      tests: [
        { values: { a: 10, b: 3 }, expected: 1 },
        { values: { a: 9, b: 3 }, expected: 0 },
        { values: { a: 7, b: 2 }, expected: 1 }
      ]
    },
    {
      id: 8,
      title: 'Grito de Guerra',
      enemyName: 'Eco Sussurrante',
      enemyEmoji: '🗣️',
      resultVar: 'resultado',
      givenVars: ['nome', 'titulo'],
      starter: '// as variáveis nome e titulo já existem\n// crie uma variável chamada resultado juntando nome e titulo, com um espaço entre eles\n\n',
      explanation: 'Strings (textos) também podem ser combinadas com o sinal <code>+</code>. Isso se chama <b>concatenação</b>.<pre>let frase = "Olá" + " " + "mundo"; // "Olá mundo"</pre>',
      desc: 'O <b>Eco Sussurrante</b> 🗣️ só escuta um grito de guerra completo. As variáveis <code>nome</code> e <code>titulo</code> já existem (textos) — crie <code>resultado</code> juntando <code>nome</code>, um espaço, e <code>titulo</code>, nessa ordem.',
      hint: 'O mesmo sinal usado pra somar números também junta textos. Não esqueça do espaço entre eles.',
      tests: [
        { values: { nome: 'Eri', titulo: 'Guardião' }, expected: 'Eri Guardião' },
        { values: { nome: 'Ana', titulo: 'Mestra' }, expected: 'Ana Mestra' },
        { values: { nome: 'Zed', titulo: 'Rei' }, expected: 'Zed Rei' }
      ]
    },
    {
      id: 9,
      title: 'Ampliação de Energia',
      enemyName: 'Golem Crescente',
      enemyEmoji: '🗿',
      resultVar: 'resultado',
      givenVars: ['pontos'],
      starter: '// a variável pontos já existe\n// crie uma variável chamada resultado somando 10 ao valor de pontos\n\n',
      explanation: 'Você pode combinar soma com atribuição usando <code>+=</code>, que soma um valor à variável e já guarda o resultado nela mesma.<pre>let vida = 5;\nvida += 3; // vida agora vale 8</pre>Também dá pra criar uma variável nova a partir de outra, só com <code>+</code>.',
      desc: 'O <b>Golem Crescente</b> 🗿 só reage a um aumento exato de energia. A variável <code>pontos</code> já existe — crie <code>resultado</code> com o valor de <code>pontos</code> mais <b>10</b>.',
      hint: 'Pense em como aumentar um valor existente em uma quantia fixa — pode usar soma normal ou o operador de soma-e-atribuição.',
      tests: [
        { values: { pontos: 0 }, expected: 10 },
        { values: { pontos: 5 }, expected: 15 },
        { values: { pontos: -10 }, expected: 0 }
      ]
    },
    {
      id: 10,
      title: 'Julgamento Final',
      enemyName: 'Oráculo Binário',
      enemyEmoji: '🔯',
      resultVar: 'resultado',
      givenVars: ['vida'],
      starter: '// a variável vida já existe\n// crie uma variável chamada resultado com o texto \'vitoria\' se vida for maior que 0, ou \'derrota\' caso contrário\n\n',
      explanation: 'Um bloco <code>if/else</code> permite escolher entre dois caminhos dependendo de uma condição.<pre>let status;\nif (energia &gt; 0) {\n  status = \'ativo\';\n} else {\n  status = \'inativo\';\n}</pre>',
      desc: 'O <b>Oráculo Binário</b> 🔯 só aceita um veredito baseado na vida restante. A variável <code>vida</code> já existe — crie <code>resultado</code> com o texto <code>"vitoria"</code> se <code>vida</code> for maior que 0, ou <code>"derrota"</code> caso contrário.',
      hint: 'Use uma estrutura condicional pra decidir entre os dois textos com base no valor de vida. Preste atenção na grafia exata dos textos pedidos.',
      tests: [
        { values: { vida: 10 }, expected: 'vitoria' },
        { values: { vida: 0 }, expected: 'derrota' },
        { values: { vida: -5 }, expected: 'derrota' }
      ]
    }
  ];

  // Exposto sempre (não só quando o botão local aparece) pra a aba "Gestão"
  // do portal da turma conseguir chamar isso remotamente, num iframe oculto,
  // e baixar um .txt com enunciado + critério de avaliação (testes) de cada
  // duelo — aqui não existe UM código certo, e sim um valor esperado por
  // combinação de entradas, então o gabarito lista os casos de teste.
  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'JavaScript Básico',
      subtitle: 'Prática · Turma Jogos Digitais',
      items: CHALLENGES.map((c, i) => ({
        number: i + 1,
        title: c.title,
        prompt: c.desc,
        answer: c.tests.map(t => {
          const inputs = Object.entries(t.values || {}).map(([k, v]) => `${k} = ${JSON.stringify(v)}`).join(', ');
          const prefix = inputs ? `Com ${inputs}` : 'Sem variáveis de entrada';
          return `${prefix} → ${c.resultVar} deve ser ${JSON.stringify(t.expected)}`;
        }).join('\n')
      })),
      fileName: 'js-basico-gabarito.txt'
    });
  };

  const challengeListEl = document.getElementById('challengeList');
  const challengeTitleEl = document.getElementById('challengeTitle');
  const challengeDescEl = document.getElementById('challengeDesc');
  const explanationTextEl = document.getElementById('explanationText');
  const givenVarsLabelEl = document.getElementById('givenVarsLabel');
  const enemyAvatarEl = document.getElementById('enemyAvatar');
  const enemyNameEl = document.getElementById('enemyName');
  const hpBarFill = document.getElementById('hpBarFill');
  const codeInput = document.getElementById('codeInput');
  const btnRun = document.getElementById('btnRun');
  const btnNext = document.getElementById('btnNext');
  const btnHint = document.getElementById('btnHint');
  const hintBox = document.getElementById('hintBox');
  const consoleOutput = document.getElementById('consoleOutput');
  const lblProgress = document.getElementById('lblProgress');

  function getCompleted() {
    try {
      return new Set(JSON.parse(localStorage.getItem(PROGRESS_KEY) || '[]'));
    } catch (e) {
      return new Set();
    }
  }

  function saveCompleted(set) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify([...set]));
  }

  let completed = getCompleted();
  let selectedId = CHALLENGES.find(c => !completed.has(c.id))?.id || CHALLENGES[0].id;

  function isUnlocked(challenge) {
    const idx = CHALLENGES.findIndex(c => c.id === challenge.id);
    if (idx === 0) return true;
    return completed.has(CHALLENGES[idx - 1].id);
  }

  function renderSidebar() {
    challengeListEl.innerHTML = '';
    CHALLENGES.forEach(c => {
      const unlocked = isUnlocked(c);
      const isDone = completed.has(c.id);
      const item = document.createElement('div');
      item.className = 'challenge-item' + (c.id === selectedId ? ' active' : '') + (isDone ? ' completed' : '') + (!unlocked ? ' locked' : '');
      const statusIcon = isDone ? '💀' : (unlocked ? '⚔️' : '🔒');
      item.innerHTML = `<span class="status">${statusIcon}</span><span class="name">${c.enemyEmoji} ${c.enemyName}</span>`;
      if (unlocked) {
        item.addEventListener('click', () => selectChallenge(c.id));
      }
      challengeListEl.appendChild(item);
    });
    lblProgress.textContent = `${completed.size}/${CHALLENGES.length}`;
  }

  function selectChallenge(id) {
    const challenge = CHALLENGES.find(c => c.id === id);
    if (!challenge || !isUnlocked(challenge)) return;
    selectedId = id;

    challengeTitleEl.textContent = `Duelo ${challenge.id}: ${challenge.title}`;
    explanationTextEl.innerHTML = challenge.explanation;
    challengeDescEl.innerHTML = challenge.desc;
    codeInput.value = challenge.starter;
    btnNext.style.display = 'none';

    if (challenge.givenVars.length > 0) {
      givenVarsLabelEl.innerHTML = `Variáveis disponíveis: <b>${challenge.givenVars.join(', ')}</b>`;
      givenVarsLabelEl.style.display = 'block';
    } else {
      givenVarsLabelEl.style.display = 'none';
    }

    hintBox.innerHTML = challenge.hint || '';
    hintBox.classList.remove('show');
    btnHint.textContent = '💡 Ver dica';

    enemyAvatarEl.textContent = challenge.enemyEmoji;
    enemyNameEl.textContent = challenge.enemyName;
    const alreadyDefeated = completed.has(id);
    hpBarFill.classList.toggle('defeated', alreadyDefeated);

    clearConsole();
    if (alreadyDefeated) {
      logConsole(`Você já derrotou ${challenge.enemyName}. Pode reviver o duelo para treinar.`, 'info');
    }
    renderSidebar();

    if (typeof window.reportActivity === 'function') {
      window.reportActivity(
        'js_basico',
        `JavaScript Básico — Duelo ${challenge.id}: ${challenge.title}`,
        { challengeId: challenge.id, total: CHALLENGES.length, completed: completed.size }
      );
    }
  }

  function clearConsole() {
    consoleOutput.innerHTML = '';
  }

  function logConsole(msg, type) {
    const line = document.createElement('div');
    line.className = 'line ' + (type || 'info');
    line.textContent = msg;
    consoleOutput.appendChild(line);
    consoleOutput.scrollTop = consoleOutput.scrollHeight;
  }

  function runChallenge() {
    const challenge = CHALLENGES.find(c => c.id === selectedId);
    if (!challenge) return;
    clearConsole();

    let fnFactory;
    try {
      fnFactory = new Function(
        ...challenge.givenVars,
        `${codeInput.value}\nreturn typeof ${challenge.resultVar} !== 'undefined' ? ${challenge.resultVar} : undefined;`
      );
    } catch (err) {
      logConsole('Erro de sintaxe: ' + err.message, 'fail');
      return;
    }

    let allPass = true;
    challenge.tests.forEach((t, i) => {
      const paramValues = challenge.givenVars.map(name => t.values[name]);
      let result, errorMsg = null;
      try {
        result = fnFactory(...paramValues);
      } catch (err) {
        errorMsg = err.message;
      }

      const pass = errorMsg === null && result === t.expected;
      if (!pass) allPass = false;

      const valuesStr = challenge.givenVars.map(name => `${name} = ${JSON.stringify(t.values[name])}`).join(', ');
      const prefix = valuesStr ? `[Ataque ${i + 1}] ${valuesStr} → ` : `[Ataque ${i + 1}] `;

      if (pass) {
        logConsole(`${prefix}${challenge.resultVar} = ${JSON.stringify(result)} ✅`, 'pass');
      } else if (errorMsg) {
        logConsole(`${prefix}Erro: ${errorMsg} ❌`, 'fail');
      } else if (result === undefined) {
        logConsole(`${prefix}a variável '${challenge.resultVar}' não foi criada ❌`, 'fail');
      } else {
        logConsole(`${prefix}${challenge.resultVar} = ${JSON.stringify(result)} (esperado ${JSON.stringify(t.expected)}) ❌`, 'fail');
      }
    });

    if (allPass) {
      completed.add(challenge.id);
      saveCompleted(completed);
      hpBarFill.classList.add('defeated');

      const isLast = CHALLENGES[CHALLENGES.length - 1].id === challenge.id;
      if (isLast) {
        logConsole(`🏆 Você derrotou ${challenge.enemyName}! Todos os adversários do módulo Básico foram vencidos!`, 'success');
      } else {
        logConsole(`💀 Você derrotou ${challenge.enemyName}! Próximo duelo liberado.`, 'success');
        btnNext.style.display = 'inline-block';
      }
      renderSidebar();

      if (typeof window.reportActivity === 'function') {
        window.reportActivity(
          'js_basico',
          `JavaScript Básico — Duelo ${challenge.id}: ${challenge.title} (vencido)`,
          { challengeId: challenge.id, total: CHALLENGES.length, completed: completed.size }
        );
      }
    } else {
      logConsole('❌ Seu ataque falhou! Ajuste o código e tente de novo.', 'warn');
    }
  }

  btnHint.addEventListener('click', () => {
    const showing = hintBox.classList.toggle('show');
    btnHint.textContent = showing ? '💡 Ocultar dica' : '💡 Ver dica';
  });

  btnRun.addEventListener('click', runChallenge);
  btnNext.addEventListener('click', () => {
    const idx = CHALLENGES.findIndex(c => c.id === selectedId);
    const next = CHALLENGES[idx + 1];
    if (next) selectChallenge(next.id);
  });

  selectChallenge(selectedId);
</script>

    <div class="vw-plugin-top-wrapper"></div>
  </div>
