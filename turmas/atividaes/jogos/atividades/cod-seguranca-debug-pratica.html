<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Segurança da Informação e Debugging: Prática</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d14; --panel:#10141f; --panel2:#0d101a; --line:#20283a;
    --blue:#5ec8ff; --blue-dim:#2f7aa8; --blood:#c1121f; --blood-bright:#ff3b30;
    --gold:#e0b84a; --ink:#dbe4f2; --ink-dim:#657388;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:var(--user-font, 'JetBrains Mono', monospace); height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--blue-dim); background:#060810;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(94,200,255,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .stage{ flex:1; min-height:0; padding:12px; overflow:hidden; display:flex; }
  .layout{ display:flex; flex-direction:row; flex-wrap:nowrap; gap:14px; width:100%; height:100%; }

  .sidebar{
    width:200px; flex-shrink:0; height:100%; overflow-y:auto;
    background:var(--panel); border:1px solid var(--line); padding:8px;
  }
  .sidebar-title{ font-size:10px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; padding:0 2px; }
  .challenge-item{
    display:flex; align-items:center; gap:8px; padding:8px 8px; margin-bottom:4px;
    border:1px solid var(--line); background:var(--panel2); cursor:pointer; font-size:11px;
  }
  .challenge-item .status{ font-size:13px; width:16px; text-align:center; flex-shrink:0; }
  .challenge-item.active{ border-color:var(--blue); color:var(--blue); }
  .challenge-item.completed{ color:var(--ink); }
  .challenge-item.locked{ opacity:0.4; cursor:not-allowed; }
  .challenge-item .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .main-panel{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; height:100%; overflow-y:auto; }

  .challenge-header{ flex-shrink:0; background:var(--panel); border:1px solid var(--line); padding:10px 14px; }

  .ticket-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .ticket-icon{ font-size:26px; line-height:1; }
  .ticket-status{ font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px; padding:3px 8px; border-radius:2px; }
  .ticket-status.pending{ background:rgba(255,59,48,0.15); color:var(--blood-bright); }
  .ticket-status.done{ background:rgba(94,200,255,0.15); color:var(--blue); }

  .challenge-header h2{ font-family:var(--user-font-display, 'VT323', monospace); font-size:19px; color:var(--blue); margin:0 0 8px; letter-spacing:1px; }
  .challenge-header p{ font-size:12px; color:var(--ink-dim); margin:8px 0 0; line-height:1.5; }
  .challenge-header code{ color:var(--gold); }

  .explanation-box{
    background:#060810; border:1px solid var(--blue-dim); padding:10px 12px;
    font-size:11.5px; color:var(--ink); line-height:1.6;
  }
  .explanation-box .exp-title{
    color:var(--blue); font-weight:800; text-transform:uppercase; font-size:10px; letter-spacing:1px; margin-bottom:6px;
  }
  .explanation-box code{ color:var(--gold); }
  .explanation-box pre{
    background:#000; border:1px solid var(--line); padding:8px; margin:6px 0 0;
    overflow-x:auto; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--gold); white-space:pre;
  }

  .hint-toggle{
    display:inline-block; margin-top:8px; font-size:10.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase;
    background:transparent; color:var(--gold); border:1px solid var(--blue-dim); padding:5px 10px; cursor:pointer; border-radius:2px;
  }
  .hint-toggle:hover{ background:rgba(224,184,74,0.1); }
  .hint-box{
    display:none; margin-top:8px; background:var(--panel2); border:1px dashed var(--gold);
    padding:8px 10px; font-size:11.5px; color:var(--ink); line-height:1.5;
  }
  .hint-box.show{ display:block; }
  .hint-box b{ color:var(--gold); }

  textarea#codeInput{
    width:100%; flex:1; min-height:60px; resize:vertical; background:#000; color:var(--blue);
    border:1px solid var(--line); font-family:'JetBrains Mono', monospace; font-size:12px;
    padding:10px; outline:none; line-height:1.5;
  }
  textarea#codeInput:focus{ border-color:var(--blue); }

  .actions{ display:flex; gap:8px; align-items:center; flex-shrink:0; flex-wrap:wrap; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11px; letter-spacing:1px; text-transform:uppercase;
    background:var(--blue); color:#04162a; border:none; padding:9px 16px; cursor:pointer; border-radius:2px;
  }
  button.btn:disabled{ opacity:0.5; cursor:not-allowed; }
  button.btn-secondary{ background:transparent; color:var(--blue); border:1px solid var(--blue-dim); }

  .console{
    background:#050710; border:1px solid var(--line); padding:8px 10px; font-size:11px;
    flex:1; min-height:50px; overflow-y:auto; line-height:1.6;
  }
  .console .line.info{ color:var(--ink-dim); }
  .console .line.pass{ color:var(--blue); }
  .console .line.fail{ color:var(--blood-bright); }
  .console .line.success{ color:var(--blue); font-weight:bold; }
  .console .line.warn{ color:var(--gold); }

  @media (max-width: 700px) {
    body{ height:auto; min-height:100vh; overflow-y:auto; padding:6px; }
    .env{ height:auto; min-height:calc(100vh - 12px); border-width:1px; }
    .stage{ overflow:visible; padding:8px; }
    .layout{ flex-direction:column; height:auto; }
    .sidebar{ width:100%; height:auto; max-height:150px; }
    .main-panel{ height:auto; overflow-y:visible; }
    textarea#codeInput{ min-height:110px; }
    .console{ flex:none; max-height:160px; }
  }
</style>
<script>
  window.ACTIVITY_LOCATION = 'cod_seguranca_debug_pratica';
</script>
<script src="../../../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../../shared/clipboard-guard.js"></script>
<script src="../../../shared/activity-tracker.js"></script>
<script src="../../../shared/progress-sync.js"></script>
<script src="../../../shared/gabarito-generator.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>CODIFICAÇÃO — OFICINA DE CÓDIGO (SEGURANÇA E DEBUGGING)</div>
    <div>RESOLVIDOS: <span id="lblProgress">0/0</span></div>
  </div>

  <div class="stage">
    <div class="layout">
      <div class="sidebar">
        <div class="sidebar-title">Chamados de Código</div>
        <div id="challengeList"></div>
      </div>

      <div class="main-panel">
        <div class="challenge-header">
          <div class="ticket-row">
            <div class="ticket-icon" id="ticketIcon">🐞</div>
            <div class="ticket-status pending" id="ticketStatus">PENDENTE</div>
          </div>
          <h2 id="challengeTitle">--</h2>

          <div class="explanation-box">
            <div class="exp-title">📖 Como funciona</div>
            <div id="explanationText"></div>
          </div>

          <p id="challengeDesc"></p>

          <button class="hint-toggle" id="btnHint">💡 Ver dica</button>
          <div class="hint-box" id="hintBox"></div>
        </div>

        <textarea id="codeInput" spellcheck="false"></textarea>

        <div class="actions">
          <button class="btn" id="btnRun">▶ Executar</button>
          <button class="btn btn-secondary" id="btnNext" style="display:none;">Próximo chamado →</button>
        </div>

        <div class="console" id="consoleOutput"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const PROGRESS_KEY = `cod_seguranca_debug_pratica_progress_${username}`;

  const CHALLENGES = [
    {
      id: 1,
      title: 'Confidencialidade: só o dono vê',
      icon: '🔒',
      fnName: 'podeVerDados',
      starter: 'function podeVerDados(idSolicitante, idDono) {\n  // retorne true só se idSolicitante for igual a idDono\n\n}',
      explanation: 'Confidencialidade é garantir que só quem deve acessar uma informação, acessa. Uma forma simples de checar isso é comparar dois valores com <code>===</code>.<pre>function mesmoTime(a, b) {\n  return a === b;\n}</pre>',
      desc: 'Um chamado pede que só o próprio jogador veja os dados da sua conta — nem outro jogador, nem por engano. Complete <code>podeVerDados(idSolicitante, idDono)</code> retornando <b>true</b> só se os dois ids forem iguais.',
      hint: 'Qual operador compara se dois valores são exatamente iguais?',
      tests: [
        { args: [5, 5], expected: true },
        { args: [5, 7], expected: false },
        { args: ['ana', 'ana'], expected: true },
        { args: ['ana', 'bia'], expected: false }
      ]
    },
    {
      id: 2,
      title: 'Integridade: pontuação não pode diminuir',
      icon: '🛡️',
      fnName: 'pontuacaoIntegra',
      starter: 'function pontuacaoIntegra(pontuacaoAntiga, pontuacaoNova) {\n  // retorne true se pontuacaoNova for maior ou igual a pontuacaoAntiga\n\n}',
      explanation: 'Integridade significa que os dados não são alterados de forma indevida. Comparações numéricas usam operadores como <code>&gt;</code>, <code>&lt;</code>, <code>&gt;=</code>, <code>&lt;=</code>.<pre>function subiu(a, b) {\n  return b > a;\n}</pre>',
      desc: 'Pra proteger a integridade do placar, uma atualização de pontuação só é aceita se a pontuação nova for maior ou igual à antiga (nunca diminui por fora do jogo). Complete <code>pontuacaoIntegra(pontuacaoAntiga, pontuacaoNova)</code> retornando <b>true</b> só se isso valer.',
      hint: 'Existe um operador de comparação que já inclui "igual". Use ele entre os dois parâmetros, na ordem certa.',
      tests: [
        { args: [100, 150], expected: true },
        { args: [100, 100], expected: true },
        { args: [100, 50], expected: false },
        { args: [0, 1], expected: true }
      ]
    },
    {
      id: 3,
      title: 'Disponibilidade: resposta dentro do prazo',
      icon: '⏱️',
      fnName: 'sistemaDisponivel',
      starter: 'function sistemaDisponivel(tempoRespostaMs) {\n  // retorne true se tempoRespostaMs for MENOR que 5000\n\n}',
      explanation: 'Disponibilidade é garantir que o sistema responde quando é preciso. Um jeito comum de medir isso é comparar um tempo medido contra um limite aceitável.<pre>function dentroDoLimite(valor, limite) {\n  return valor < limite;\n}</pre>',
      desc: 'Um servidor só é considerado disponível se responder em menos de <b>5000ms</b>. Complete <code>sistemaDisponivel(tempoRespostaMs)</code> retornando <b>true</b> se o tempo de resposta for menor que 5000.',
      hint: 'Qual operador de comparação verifica se um valor é menor que outro?',
      tests: [
        { args: [1200], expected: true },
        { args: [4999], expected: true },
        { args: [5000], expected: false },
        { args: [9000], expected: false }
      ]
    },
    {
      id: 4,
      title: 'Níveis hierárquicos de acesso',
      icon: '🪪',
      fnName: 'nivelSuficiente',
      starter: 'function nivelSuficiente(nivelUsuario, nivelExigido) {\n  // retorne true se nivelUsuario for suficiente pra nivelExigido\n\n}',
      explanation: 'Níveis hierárquicos de acesso funcionam como uma escala numérica: quem está num nível mais alto (ou igual ao exigido) pode realizar a ação.<pre>function podeEntrar(idade, minima) {\n  return idade >= minima;\n}</pre>',
      desc: 'Cada ação exige um nível mínimo de acesso (1=jogador, 2=moderador, 3=administrador). Complete <code>nivelSuficiente(nivelUsuario, nivelExigido)</code> retornando <b>true</b> se o nível do usuário for suficiente pra ação.',
      hint: 'Pense em "o nível do usuário precisa ser pelo menos o nível exigido" — qual comparação representa isso?',
      tests: [
        { args: [3, 2], expected: true },
        { args: [2, 2], expected: true },
        { args: [1, 2], expected: false },
        { args: [1, 1], expected: true }
      ]
    },
    {
      id: 5,
      title: 'Tratamento de erros: save ausente',
      icon: '💾',
      fnName: 'mensagemDeCarregamento',
      starter: 'function mensagemDeCarregamento(save) {\n  // se save for null, retorne \'Nenhum save encontrado, iniciando novo jogo\'\n  // caso contrário, retorne \'Save carregado com sucesso\'\n\n}',
      explanation: 'Tratamento de erros significa prever um caso problemático (como um dado ausente) e reagir com uma mensagem clara, em vez de deixar o programa quebrar. Um <code>if/else</code> simples resolve isso.<pre>function status(valor) {\n  if (valor === null) return \'vazio\';\n  return \'preenchido\';\n}</pre>',
      desc: 'Ao tentar carregar um save que pode não existir, o jogo não deve travar — deve reagir com uma mensagem adequada. Complete <code>mensagemDeCarregamento(save)</code> retornando exatamente <code>"Nenhum save encontrado, iniciando novo jogo"</code> se <code>save</code> for <code>null</code>, ou <code>"Save carregado com sucesso"</code> caso contrário.',
      hint: 'Use um if/else comparando o parâmetro com null, e retorne o texto certo em cada caso — copie as mensagens exatamente como pedido.',
      tests: [
        { args: [null], expected: 'Nenhum save encontrado, iniciando novo jogo' },
        { args: [{ nivel: 3 }], expected: 'Save carregado com sucesso' },
        { args: [{}], expected: 'Save carregado com sucesso' }
      ]
    },
    {
      id: 6,
      title: 'Validação segura de JSON externo',
      icon: '📄',
      fnName: 'lerItemJSON',
      starter: 'function lerItemJSON(texto) {\n  // tente converter texto com JSON.parse e retorne o objeto\n  // se der erro, retorne null em vez de deixar o erro estourar\n\n}',
      explanation: '<code>JSON.parse()</code> converte texto em objeto, mas lança um erro se o texto não for um JSON válido. Um bloco <code>try/catch</code> permite capturar esse erro e reagir, em vez de travar o programa.<pre>function tentar(fn) {\n  try {\n    return fn();\n  } catch (e) {\n    return \'deu erro\';\n  }\n}</pre>',
      desc: 'Um arquivo de item vem como texto JSON, e pode estar malformado. Complete <code>lerItemJSON(texto)</code> retornando o objeto convertido se o JSON for válido, ou <code>null</code> se não for (sem travar o jogo).',
      hint: 'Envolva a conversão num try/catch: tente converter dentro do try, e no catch retorne null.',
      tests: [
        { args: ['{"nome":"Espada","dano":10}'], check: (r) => !!r && r.nome === 'Espada' && r.dano === 10, expectedLabel: 'objeto com nome "Espada" e dano 10' },
        { args: ['{isso nao e valido}'], expected: null },
        { args: ['[1,2,3]'], expected: [1, 2, 3] },
        { args: [''], expected: null }
      ]
    },
    {
      id: 7,
      title: 'Campos obrigatórios do item',
      icon: '📋',
      fnName: 'itemValido',
      starter: 'function itemValido(item) {\n  // retorne true só se item tiver os campos nome, dano e preco (nenhum undefined)\n\n}',
      explanation: 'Validar campos obrigatórios evita que o código quebre mais adiante por falta de um dado esperado. Comparar uma propriedade com <code>undefined</code> mostra se ela existe no objeto.<pre>function temCampo(obj, campo) {\n  return obj[campo] !== undefined;\n}</pre>',
      desc: 'Antes de usar um item convertido do JSON, o código precisa confirmar que ele tem todos os campos obrigatórios: <code>nome</code>, <code>dano</code> e <code>preco</code>. Complete <code>itemValido(item)</code> retornando <b>true</b> só se os três campos existirem no objeto.',
      hint: 'Você precisa confirmar os três campos ao mesmo tempo — como você garante que TODAS as condições sejam verdadeiras, não só uma delas?',
      tests: [
        { args: [{ nome: 'Escudo', dano: 0, preco: 50 }], expected: true },
        { args: [{ nome: 'Escudo', preco: 50 }], expected: false },
        { args: [{}], expected: false },
        { args: [{ nome: 'Poção', dano: 5, preco: 0 }], expected: true }
      ]
    },
    {
      id: 8,
      title: 'Corrigir o filtro de vidas',
      icon: '❤️',
      fnName: 'somarVidasPositivas',
      starter: 'function somarVidasPositivas(vidas) {\n  // retorne a soma só dos valores MAIORES que 0 no array vidas\n\n}',
      explanation: 'Combine dois passos: primeiro filtre os valores que passam num teste, depois some o que sobrou. <code>.filter()</code> mantém só o que passa numa condição.<pre>let nums = [4, -2, 0, 6];\nlet positivos = nums.filter(n => n > 0);\n// positivos é [4, 6]</pre>',
      desc: 'Um chamado reporta que a soma de vida do time está errada quando algum personagem está com vida zerada ou negativa — esses <b>não deveriam contar</b> na soma. Escreva <code>somarVidasPositivas(vidas)</code> retornando a soma só dos valores estritamente maiores que 0 no array.',
      hint: 'Filtre os valores maiores que 0 primeiro, depois some o que sobrou — pode usar .filter() seguido de .reduce(), ou um laço só.',
      tests: [
        { args: [[10, -5, 0, 20]], expected: 30 },
        { args: [[-1, -2, -3]], expected: 0 },
        { args: [[]], expected: 0 },
        { args: [[5]], expected: 5 }
      ]
    },
    {
      id: 9,
      title: 'Inspecionar o histórico (breakpoint)',
      icon: '🔎',
      fnName: 'estadoNoPasso',
      starter: 'function estadoNoPasso(historico, indice) {\n  // retorne historico[indice], ou null se o índice estiver fora dos limites\n\n}',
      explanation: 'Antes de acessar uma posição de array por índice, é preciso checar se ela existe — um índice fora dos limites (negativo, ou maior/igual ao tamanho do array) não deve ser acessado direto.<pre>function seguro(lista, i) {\n  if (i < 0 || i >= lista.length) return null;\n  return lista[i];\n}</pre>',
      desc: 'Um "breakpoint" pausa a execução num ponto específico pra inspecionar o estado ali. Complete <code>estadoNoPasso(historico, indice)</code> retornando o item de <code>historico</code> na posição <code>indice</code>, ou <code>null</code> se o índice estiver fora dos limites do array.',
      hint: 'Antes de acessar a posição, pense nos dois jeitos de um índice "não existir" num array — um deles é ser negativo. Qual é o outro, relacionado ao tamanho da lista?',
      tests: [
        { args: [[10, 20, 30], 1], expected: 20 },
        { args: [[10, 20, 30], 5], expected: null },
        { args: [[10, 20, 30], -1], expected: null },
        { args: [[10, 20, 30], 0], expected: 10 }
      ]
    },
    {
      id: 10,
      title: 'BOSS: liberar configuração com segurança',
      icon: '🏆',
      fnName: 'carregarConfigSegura',
      starter: 'function carregarConfigSegura(autenticado, textoJson) {\n  // 1. se autenticado for false, retorne null\n  // 2. tente converter textoJson com JSON.parse — se der erro, retorne null\n  // 3. se o objeto não tiver a chave "versao", retorne null\n  // 4. caso contrário, retorne o objeto convertido\n\n}',
      explanation: 'Este chamado combina os três conceitos treinados nos anteriores: autenticação (confidencialidade), conversão segura de JSON (try/catch) e validação de campo obrigatório.',
      hint: 'Trate os três casos em sequência: autenticação, depois o try/catch do JSON.parse, depois o campo "versao" — qualquer um que falhar já retorna null.',
      desc: 'BOSS: combine tudo que você aprendeu. Complete <code>carregarConfigSegura(autenticado, textoJson)</code>: só retorne o objeto convertido se <code>autenticado</code> for <code>true</code>, o JSON for válido, E o objeto tiver a chave <code>"versao"</code>. Em qualquer outro caso, retorne <code>null</code>.',
      tests: [
        { args: [true, '{"versao":2,"som":true}'], check: (r) => !!r && r.versao === 2 && r.som === true, expectedLabel: 'objeto com versao 2 e som true' },
        { args: [false, '{"versao":2}'], expected: null },
        { args: [true, '{invalido}'], expected: null },
        { args: [true, '{"som":true}'], expected: null }
      ]
    }
  ];

  // Exposto sempre (não só quando o botão local aparece) pra a aba "Gestão"
  // do portal da turma conseguir chamar isso remotamente, num iframe oculto,
  // e baixar um .txt com enunciado + critério de avaliação (testes) de cada
  // chamado — aqui não existe UM código certo, e sim um valor esperado por
  // combinação de argumentos, então o gabarito lista os casos de teste.
  window.generateGabaritoForGestao = function () {
    return window.PortalGabarito.generate({
      title: 'Jogos: Oficina de Código — Segurança e Debugging',
      subtitle: 'Prática · Turma Jogos Digitais',
      items: CHALLENGES.map((c, i) => ({
        number: i + 1,
        title: c.title,
        prompt: c.desc,
        answer: c.tests.map(t => {
          const inputs = (t.args || []).map(a => JSON.stringify(a)).join(', ');
          const exp = ('expected' in t) ? JSON.stringify(t.expected) : (t.expectedLabel || 'ver critério no código-fonte');
          return `${c.fnName}(${inputs}) deve retornar ${exp}`;
        }).join('\n')
      })),
      fileName: 'cod-seguranca-debug-pratica-gabarito.txt'
    });
  };

  const challengeListEl = document.getElementById('challengeList');
  const challengeTitleEl = document.getElementById('challengeTitle');
  const challengeDescEl = document.getElementById('challengeDesc');
  const explanationTextEl = document.getElementById('explanationText');
  const ticketIconEl = document.getElementById('ticketIcon');
  const ticketStatusEl = document.getElementById('ticketStatus');
  const codeInput = document.getElementById('codeInput');
  const btnRun = document.getElementById('btnRun');
  const btnNext = document.getElementById('btnNext');
  const btnHint = document.getElementById('btnHint');
  const hintBox = document.getElementById('hintBox');
  const consoleOutput = document.getElementById('consoleOutput');
  const lblProgress = document.getElementById('lblProgress');

  function getCompleted() {
    try {
      return new Set(JSON.parse(localStorage.getItem(PROGRESS_KEY) || '[]'));
    } catch (e) {
      return new Set();
    }
  }
  function saveCompleted(set) {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify([...set]));
  }

  let completed = getCompleted();
  let selectedId = CHALLENGES.find(c => !completed.has(c.id))?.id || CHALLENGES[0].id;

  function isUnlocked(challenge) {
    const idx = CHALLENGES.findIndex(c => c.id === challenge.id);
    if (idx === 0) return true;
    return completed.has(CHALLENGES[idx - 1].id);
  }

  function renderSidebar() {
    challengeListEl.innerHTML = '';
    CHALLENGES.forEach(c => {
      const unlocked = isUnlocked(c);
      const isDone = completed.has(c.id);
      const item = document.createElement('div');
      item.className = 'challenge-item' + (c.id === selectedId ? ' active' : '') + (isDone ? ' completed' : '') + (!unlocked ? ' locked' : '');
      const statusIcon = isDone ? '✅' : (unlocked ? '🎫' : '🔒');
      item.innerHTML = `<span class="status">${statusIcon}</span><span class="name">${c.icon} ${c.title}</span>`;
      if (unlocked) item.addEventListener('click', () => selectChallenge(c.id));
      challengeListEl.appendChild(item);
    });
    lblProgress.textContent = `${completed.size}/${CHALLENGES.length}`;
  }

  function clearConsole() { consoleOutput.innerHTML = ''; }
  function logConsole(msg, type) {
    const line = document.createElement('div');
    line.className = 'line ' + (type || 'info');
    line.textContent = msg;
    consoleOutput.appendChild(line);
    consoleOutput.scrollTop = consoleOutput.scrollHeight;
  }

  function deepEqual(a, b) {
    if (Array.isArray(a) && Array.isArray(b)) {
      return a.length === b.length && a.every((v, i) => deepEqual(v, b[i]));
    }
    return a === b;
  }

  function selectChallenge(id) {
    const challenge = CHALLENGES.find(c => c.id === id);
    if (!challenge || !isUnlocked(challenge)) return;
    selectedId = id;

    challengeTitleEl.textContent = `Chamado ${challenge.id}: ${challenge.title}`;
    explanationTextEl.innerHTML = challenge.explanation;
    challengeDescEl.innerHTML = challenge.desc;
    codeInput.value = challenge.starter;
    btnNext.style.display = 'none';

    hintBox.innerHTML = challenge.hint || '';
    hintBox.classList.remove('show');
    btnHint.textContent = '💡 Ver dica';

    ticketIconEl.textContent = challenge.icon;
    const alreadyDone = completed.has(id);
    ticketStatusEl.textContent = alreadyDone ? 'RESOLVIDO' : 'PENDENTE';
    ticketStatusEl.className = 'ticket-status ' + (alreadyDone ? 'done' : 'pending');

    clearConsole();
    if (alreadyDone) {
      logConsole(`Você já resolveu este chamado. Pode tentar de novo pra treinar.`, 'info');
    }
    renderSidebar();

    if (typeof window.reportActivity === 'function') {
      window.reportActivity(
        'cod_seguranca_debug_pratica',
        `Codificação — Segurança e Debugging — Chamado ${challenge.id}: ${challenge.title}`,
        { challengeId: challenge.id, total: CHALLENGES.length, completed: completed.size }
      );
    }
  }

  function runChallenge() {
    const challenge = CHALLENGES.find(c => c.id === selectedId);
    if (!challenge) return;
    clearConsole();

    let fn;
    try {
      fn = new Function(`${codeInput.value}\nreturn typeof ${challenge.fnName} === 'function' ? ${challenge.fnName} : undefined;`)();
    } catch (err) {
      logConsole('Erro de sintaxe: ' + err.message, 'fail');
      return;
    }

    if (typeof fn !== 'function') {
      logConsole(`A função '${challenge.fnName}' não foi encontrada. Verifique o nome da função.`, 'fail');
      return;
    }

    let allPass = true;
    challenge.tests.forEach((t, i) => {
      let result, errorMsg = null;
      try {
        result = fn(...t.args);
      } catch (err) {
        errorMsg = err.message;
      }

      let pass;
      if (errorMsg !== null) {
        pass = false;
      } else if (typeof t.check === 'function') {
        pass = t.check(result, ...t.args);
      } else {
        pass = deepEqual(result, t.expected);
      }
      if (!pass) allPass = false;

      const argsStr = t.args.map(a => JSON.stringify(a)).join(', ');
      const expectedStr = t.expectedLabel ? t.expectedLabel : JSON.stringify(t.expected);

      if (pass) {
        logConsole(`[Teste ${i + 1}] ${challenge.fnName}(${argsStr}) → ${JSON.stringify(result)} ✅`, 'pass');
      } else if (errorMsg) {
        logConsole(`[Teste ${i + 1}] ${challenge.fnName}(${argsStr}) → Erro: ${errorMsg} ❌`, 'fail');
      } else {
        logConsole(`[Teste ${i + 1}] ${challenge.fnName}(${argsStr}) → ${JSON.stringify(result)} (esperado ${expectedStr}) ❌`, 'fail');
      }
    });

    if (allPass) {
      completed.add(challenge.id);
      saveCompleted(completed);
      ticketStatusEl.textContent = 'RESOLVIDO';
      ticketStatusEl.className = 'ticket-status done';

      const isLast = CHALLENGES[CHALLENGES.length - 1].id === challenge.id;
      if (isLast) {
        logConsole(`🏆 Chamado resolvido! Você concluiu todos os chamados de Segurança e Debugging.`, 'success');
      } else {
        logConsole(`✅ Chamado resolvido! Próximo chamado liberado.`, 'success');
        btnNext.style.display = 'inline-block';
      }
      renderSidebar();

      if (typeof window.reportActivity === 'function') {
        window.reportActivity(
          'cod_seguranca_debug_pratica',
          `Codificação — Segurança e Debugging — Chamado ${challenge.id}: ${challenge.title} (resolvido)`,
          { challengeId: challenge.id, total: CHALLENGES.length, completed: completed.size }
        );
      }
    } else {
      logConsole('❌ Ainda não passou em todos os testes. Ajuste o código e tente de novo.', 'warn');
    }
  }

  btnHint.addEventListener('click', () => {
    const showing = hintBox.classList.toggle('show');
    btnHint.textContent = showing ? '💡 Ocultar dica' : '💡 Ver dica';
  });

  btnRun.addEventListener('click', runChallenge);
  btnNext.addEventListener('click', () => {
    const idx = CHALLENGES.findIndex(c => c.id === selectedId);
    const next = CHALLENGES[idx + 1];
    if (next) selectChallenge(next.id);
  });

  selectChallenge(selectedId);
</script>

  <div vw-access-button class="active"></div>
  <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
  </div>
