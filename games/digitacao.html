<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelForge Studios — Digitação</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;500;600;800&display=swap');

  :root{
    --bg:#0a0d0a; --panel:#10140f; --panel2:#0d110c; --line:#223022;
    --green:#7cff3f; --green-dim:#4a9a2a; --blood:#c1121f; --blood-bright:#ff3b30;
    --yellow:#d4c86a; --ink:#d9e6d2; --ink-dim:#6f8368;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:10px; background:var(--bg); color:var(--ink);
    font-family:'JetBrains Mono', monospace; height:100vh; overflow:hidden;
  }

  .env{
    width:100%; height:100%; border:2px solid var(--green-dim); background:#050805;
    display:flex; flex-direction:column; box-shadow:0 0 15px rgba(124,255,63,0.15);
  }

  .topbar{
    height:30px; background:var(--panel2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    font-size:11px; color:var(--ink-dim); text-transform:uppercase; flex-shrink:0;
  }

  .stage{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; gap:18px; overflow:auto; }

  h1{
    font-family:'VT323', monospace; font-size:30px; color:var(--green);
    margin:0; letter-spacing:1px; text-shadow:0 0 8px rgba(124,255,63,.35); text-align:center;
  }
  .subtitle{ font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px; margin-top:-10px; text-align:center; }

  .settings-row{ display:flex; gap:16px; align-items:center; }
  .setting-field{
    display:flex; flex-direction:column; gap:4px; font-size:10px; color:var(--ink-dim);
    text-transform:uppercase; letter-spacing:1px;
  }
  .setting-field select{
    font-family:inherit; font-size:12px; background:var(--panel2); color:var(--ink);
    border:1px solid var(--line); border-radius:2px; padding:6px 8px; cursor:pointer;
  }
  .setting-field select:disabled{ opacity:.45; cursor:not-allowed; }

  .stats{
    display:flex; gap:24px; font-size:12px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px;
  }
  .stats b{ color:var(--yellow); font-size:15px; display:block; text-align:center; }
  .stats span{ display:block; text-align:center; }
  .stats .timer-box b{ color:var(--blood-bright); }

  .words-box{
    width:100%; max-width:900px; background:var(--panel); border:1px solid var(--line);
    padding:18px 20px; font-size:17px; line-height:2; height:16em; overflow-y:auto;
    letter-spacing:0.5px;
  }
  .word{ display:inline-block; margin:0 10px 4px 0; color:var(--ink-dim); }
  .char{ color:var(--ink-dim); }
  .char.correct{ color:var(--green); }
  .char.incorrect{ color:var(--blood-bright); text-decoration:underline; }
  .char.extra{ color:var(--blood-bright); text-decoration:underline; opacity:0.6; }
  .word.current{ border-bottom:2px solid var(--yellow); padding-bottom:2px; }

  .input-line{
    width:100%; max-width:900px; display:flex; align-items:center; gap:8px;
    background:#000; border:1px solid var(--line); padding:10px 14px;
  }
  .input-line .prompt{ color:var(--yellow); font-weight:bold; }
  .input-line input{
    flex:1; background:transparent; border:none; outline:none; color:var(--ink);
    font-family:inherit; font-size:14px;
  }
  .input-line input:disabled{ opacity:0.4; }

  .actions{ display:flex; gap:10px; }
  button.btn{
    font-family:inherit; font-weight:800; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    background:var(--green); color:#04220a; border:none; padding:10px 18px; cursor:pointer; border-radius:2px;
  }
  button.btn-secondary{ background:transparent; color:var(--green); border:1px solid var(--green-dim); }

  .btn-ranking{
    font-family:inherit; font-weight:800; font-size:10.5px; letter-spacing:1px; text-transform:uppercase;
    background:transparent; color:var(--yellow); border:1px solid var(--yellow); padding:4px 10px; cursor:pointer; border-radius:2px;
  }
  .btn-ranking:hover{ background:rgba(212,200,106,0.12); }

  .stats .streak-box b{ transition:color .15s ease, transform .15s ease; }
  .stats .streak-box.on-fire b{ color:var(--blood-bright); transform:scale(1.15); text-shadow:0 0 10px rgba(255,59,48,.6); }

  @keyframes popCorrect{ 0%{ transform:scale(1); } 40%{ transform:scale(1.35); } 100%{ transform:scale(1); } }
  @keyframes shakeWrong{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-4px); } 75%{ transform:translateX(4px); } }
  .word.pop-correct{ animation:popCorrect .22s ease; }
  .word.pop-wrong{ animation:shakeWrong .22s ease; }

  .results{
    display:none; width:100%; max-width:900px; background:var(--panel); border:1px solid var(--green);
    padding:22px; text-align:center;
  }
  .results h2{ font-family:'VT323', monospace; font-size:26px; color:var(--green); margin:0 0 14px; }
  .results-grid{ display:flex; justify-content:center; gap:30px; margin-bottom:16px; flex-wrap:wrap; }
  .results-grid div{ min-width:100px; }
  .results-grid b{ display:block; font-size:26px; color:var(--yellow); }
  .results-grid span{ font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1px; }
</style>
<script src="../shared/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../shared/clipboard-guard.js"></script>
<script src="../shared/game-leaderboard.js"></script>
</head>
<body>

<div class="env">
  <div class="topbar">
    <div>DIGITAÇÃO — TREINO DE VELOCIDADE</div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="btn-ranking" id="btnRanking">🏆 Ranking da Turma</button>
    </div>
  </div>

  <div class="stage">
    <h1>PRATIQUE SUA DIGITAÇÃO</h1>
    <div class="subtitle">Escolha o tema e o tempo, e mostre sua velocidade</div>

    <div class="settings-row">
      <label class="setting-field">Tema
        <select id="selTheme">
          <option value="variado">🌍 Variado</option>
          <option value="tecnologia">💻 Tecnologia</option>
        </select>
      </label>
      <label class="setting-field">Tempo
        <select id="selDuration">
          <option value="15">15s</option>
          <option value="30">30s</option>
        </select>
      </label>
    </div>

    <div class="stats">
      <div class="timer-box"><b id="lblTimer">30</b><span>Segundos</span></div>
      <div><b id="lblWpm">0</b><span>PPM</span></div>
      <div><b id="lblAccuracy">100%</b><span>Precisão</span></div>
      <div class="streak-box" id="streakBox"><b id="lblStreak">0</b><span>🔥 Sequência</span></div>
      <div><b id="lblBest" style="color:var(--green)">0</b><span>Recorde PPM</span></div>
    </div>

    <div class="words-box" id="wordsBox"></div>

    <div class="input-line">
      <span class="prompt">&gt;</span>
      <input type="text" id="typeInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus placeholder="Comece a digitar aqui...">
    </div>

    <div class="actions">
      <button class="btn btn-secondary" id="btnRestart">↻ Reiniciar</button>
    </div>

    <div class="results" id="resultsPanel">
      <h2>RESULTADO</h2>
      <div id="newRecordBadge" style="display:none; color:var(--yellow); font-size:12px; text-transform:uppercase; letter-spacing:1px; margin-bottom:12px;">🏆 Novo recorde pessoal!</div>
      <div class="results-grid">
        <div><b id="resWpm">0</b><span>PPM</span></div>
        <div><b id="resAccuracy">0%</b><span>Precisão</span></div>
        <div><b id="resWords">0</b><span>Palavras certas</span></div>
        <div><b id="resErrors">0</b><span>Erros</span></div>
        <div><b id="resMaxStreak" style="color:var(--blood-bright)">0</b><span>Melhor sequência</span></div>
        <div><b id="resBest" style="color:var(--green)">0</b><span>Recorde PPM</span></div>
      </div>
      <div class="actions" style="justify-content:center; margin-bottom:0;">
        <button class="btn" id="btnPlayAgain">Jogar Novamente</button>
        <button class="btn btn-secondary" id="btnRankingResults">🏆 Ver Ranking da Turma</button>
      </div>
    </div>
  </div>
</div>

<script>
  const WORD_BANK_TECNOLOGIA = [
    "commit","branch","merge","rebase","checkout","clone","fork","pull-request","push","repositorio",
    "codigo","funcao","variavel","array","objeto","classe","interface","framework","biblioteca",
    "compilador","interpretador","debug","breakpoint","bug","patch","deploy","build","script",
    "terminal","console","servidor","cliente","api","endpoint","banco-de-dados","query","cache",
    "buffer","thread","processo","algoritmo","estrutura","loop","condicional","recursao",
    "ponteiro","memoria","stack","heap","sprite","shader","textura","renderizar","engine",
    "fisica","colisao","hitbox","spawn","respawn","gameplay","asset","animacao","framerate",
    "input","output","controller","joystick","multiplayer","socket","protocolo","criptografia",
    "token","hash","autenticacao","sessao","cookie","requisicao","resposta","frontend","backend",
    "fullstack","refatorar","otimizar","performance","versionamento","gitignore","pipeline",
    "container","docker","kubernetes","microservico","escalabilidade","latencia","pixel",
    "viewport","camera","raycast","waypoint","inventario","npc","boss","checkpoint",
    "savegame","matriz","vetor","booleano","string","inteiro","compilar","executar",
    "testar","prototipo","wireframe","mockup","layout","responsivo"
  ];

  const WORD_BANK_VARIADO = [
    "casa","familia","amigo","vizinho","cidade","estrada","viagem","praia","montanha","floresta",
    "animal","cachorro","gato","passaro","peixe","arvore","flor","jardim","chuva","sol",
    "lua","estrela","ceu","vento","verao","inverno","primavera","outono","comida","agua",
    "leite","pao","arroz","feijao","fruta","banana","laranja","maca","uva","mesa",
    "cadeira","janela","porta","telefone","roupa","sapato","camisa","calca","chapeu","relogio",
    "dinheiro","trabalho","emprego","salario","cidadao","governo","pais","estado","municipio","historia",
    "geografia","matematica","ciencia","arte","musica","teatro","cinema","livro","jornal","revista",
    "noticia","esporte","futebol","basquete","natacao","corrida","saude","hospital","medico","remedio",
    "exercicio","sono","descanso","aeroporto","aviao","trem","onibus","bicicleta","caminhada","mercado",
    "loja","compra","venda","preco","desconto","feira","festa","aniversario","presente","felicidade",
    "tristeza","alegria","amizade","respeito","paciencia","coragem","sabedoria","liberdade","justica","igualdade",
    "natureza","reciclagem","energia","universidade","biblioteca","quadro","caderno","lapis","caneta","borracha",
    "mochila","uniforme","recreio","merenda","portao","corredor","diretor","secretaria","boletim","tarefa"
  ];

  const WORD_BANKS = { variado: WORD_BANK_VARIADO, tecnologia: WORD_BANK_TECNOLOGIA };
  const VALID_DURATIONS = [15, 30];

  const INITIAL_WORD_COUNT = 40;
  const EXTEND_WORD_COUNT = 20;
  const REFILL_THRESHOLD = 10;

  const wordsBox = document.getElementById('wordsBox');
  const inputEl = document.getElementById('typeInput');
  const lblTimer = document.getElementById('lblTimer');
  const lblWpm = document.getElementById('lblWpm');
  const lblAccuracy = document.getElementById('lblAccuracy');
  const resultsPanel = document.getElementById('resultsPanel');
  const resWpm = document.getElementById('resWpm');
  const resAccuracy = document.getElementById('resAccuracy');
  const resWords = document.getElementById('resWords');
  const resErrors = document.getElementById('resErrors');
  const lblBest = document.getElementById('lblBest');
  const resBest = document.getElementById('resBest');
  const newRecordBadge = document.getElementById('newRecordBadge');
  const lblStreak = document.getElementById('lblStreak');
  const streakBox = document.getElementById('streakBox');
  const resMaxStreak = document.getElementById('resMaxStreak');
  const btnRanking = document.getElementById('btnRanking');
  const btnRankingResults = document.getElementById('btnRankingResults');
  const selTheme = document.getElementById('selTheme');
  const selDuration = document.getElementById('selDuration');

  const urlParams = new URLSearchParams(window.location.search);
  const username = urlParams.get('user') || 'anon';
  const displayName = urlParams.get('name') || username;
  const turma = urlParams.get('turma') || '';
  const BEST_PPM_KEY = `digitacao_best_ppm_${username}`;
  const THEME_KEY = `digitacao_theme_${username}`;
  const DURATION_KEY = `digitacao_duration_${username}`;

  function loadTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    return WORD_BANKS[saved] ? saved : 'tecnologia';
  }
  function loadDuration() {
    const saved = parseInt(localStorage.getItem(DURATION_KEY) || '', 10);
    return VALID_DURATIONS.includes(saved) ? saved : 30;
  }

  let currentTheme = loadTheme();
  let SELECTED_SECONDS = loadDuration();
  selTheme.value = currentTheme;
  selDuration.value = String(SELECTED_SECONDS);

  function openRanking() {
    window.GameLeaderboard.showPanel({
      game: 'digitacao', turma, email: username,
      title: 'Ranking — Digitação', formatScore: s => `${s} PPM`
    });
  }
  btnRanking.addEventListener('click', openRanking);
  btnRankingResults.addEventListener('click', openRanking);
  if (!window.GameLeaderboard.enabled) { btnRanking.style.display = 'none'; btnRankingResults.style.display = 'none'; }

  function getBestPpm() {
    return parseInt(localStorage.getItem(BEST_PPM_KEY) || '0', 10);
  }

  function saveBestPpm(value) {
    localStorage.setItem(BEST_PPM_KEY, String(value));
  }

  let bestPpm = getBestPpm();
  lblBest.textContent = bestPpm;

  let wordsData = [];
  let currentWordIndex = 0;
  let started = false;
  let timer = SELECTED_SECONDS;
  let timerInterval = null;
  let correctChars = 0;
  let incorrectChars = 0;
  let correctWords = 0;
  let streak = 0;
  let maxStreak = 0;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function generateWords(count) {
    const pool = shuffle([...WORD_BANKS[currentTheme]]);
    const result = [];
    while (result.length < count) {
      for (const w of pool) {
        result.push(w);
        if (result.length >= count) break;
      }
    }
    return result;
  }

  function buildWordSpan(word) {
    const wordEl = document.createElement('span');
    wordEl.className = 'word';
    const charEls = [...word].map(ch => {
      const charEl = document.createElement('span');
      charEl.className = 'char';
      charEl.textContent = ch;
      wordEl.appendChild(charEl);
      return charEl;
    });
    return { word, el: wordEl, charEls, extraEls: [] };
  }

  function renderWords(list) {
    wordsBox.innerHTML = '';
    wordsData = list.map(w => {
      const data = buildWordSpan(w);
      wordsBox.appendChild(data.el);
      return data;
    });
    updateCurrentWordHighlight();
  }

  function extendWords() {
    const more = generateWords(EXTEND_WORD_COUNT);
    more.forEach(w => {
      const data = buildWordSpan(w);
      wordsBox.appendChild(data.el);
      wordsData.push(data);
    });
  }

  function updateCurrentWordHighlight() {
    wordsData.forEach(d => d.el.classList.remove('current'));
    const current = wordsData[currentWordIndex];
    if (current) {
      current.el.classList.add('current');
      current.el.scrollIntoView({ block: 'nearest' });
    }
  }

  function colorCurrentWord(typedVal) {
    const data = wordsData[currentWordIndex];
    if (!data) return;
    const target = data.word;

    for (let i = 0; i < target.length; i++) {
      const charEl = data.charEls[i];
      charEl.classList.remove('correct', 'incorrect');
      if (i < typedVal.length) {
        charEl.classList.add(typedVal[i] === target[i] ? 'correct' : 'incorrect');
      }
    }

    data.extraEls.forEach(el => el.remove());
    data.extraEls = [];
    if (typedVal.length > target.length) {
      [...typedVal.slice(target.length)].forEach(ch => {
        const el = document.createElement('span');
        el.className = 'char extra';
        el.textContent = ch;
        data.el.appendChild(el);
        data.extraEls.push(el);
      });
    }
  }

  function tallyWord(data, typedVal) {
    const target = data.word;
    const len = Math.min(typedVal.length, target.length);
    for (let i = 0; i < len; i++) {
      if (typedVal[i] === target[i]) correctChars++; else incorrectChars++;
    }
    if (typedVal.length > target.length) {
      incorrectChars += (typedVal.length - target.length);
    }
    const hit = typedVal === target;
    if (hit) {
      correctWords++;
      streak++;
      if (streak > maxStreak) maxStreak = streak;
    } else {
      streak = 0;
    }
    lblStreak.textContent = streak;
    streakBox.classList.toggle('on-fire', streak > 0 && streak % 5 === 0);
    return hit;
  }

  function submitCurrentWord(typedVal) {
    const data = wordsData[currentWordIndex];
    if (data) {
      colorCurrentWord(typedVal);
      const hit = tallyWord(data, typedVal);
      data.el.classList.add(hit ? 'pop-correct' : 'pop-wrong');
    }
    currentWordIndex++;
    if (currentWordIndex >= wordsData.length - REFILL_THRESHOLD) extendWords();
    updateCurrentWordHighlight();
    updateStatsLive();
  }

  function updateStatsLive() {
    const elapsedSeconds = Math.max(SELECTED_SECONDS - timer, 1);
    const minutes = elapsedSeconds / 60;
    const wpm = Math.round((correctChars / 5) / minutes);
    const totalChars = correctChars + incorrectChars;
    const accuracy = totalChars > 0 ? Math.round((correctChars / totalChars) * 100) : 100;
    lblWpm.textContent = wpm;
    lblAccuracy.textContent = accuracy + '%';
  }

  function startTimer() {
    started = true;
    selTheme.disabled = true;
    selDuration.disabled = true;
    timerInterval = setInterval(() => {
      timer--;
      lblTimer.textContent = timer;
      updateStatsLive();
      if (timer <= 0) endGame();
    }, 1000);
  }

  function handleInput() {
    if (inputEl.disabled) return;
    const val = inputEl.value;

    if (!started && val.trim().length > 0) startTimer();

    if (val.endsWith(' ')) {
      const typed = val.trim();
      inputEl.value = '';
      if (typed.length > 0) submitCurrentWord(typed);
      return;
    }

    colorCurrentWord(val);
  }

  function endGame() {
    clearInterval(timerInterval);
    timerInterval = null;

    const partial = inputEl.value.trim();
    const data = wordsData[currentWordIndex];
    if (partial.length > 0 && data) {
      colorCurrentWord(partial);
      tallyWord(data, partial);
    }

    inputEl.disabled = true;
    showResults();
  }

  function showResults() {
    const minutes = SELECTED_SECONDS / 60;
    const wpm = Math.round((correctChars / 5) / minutes);
    const totalChars = correctChars + incorrectChars;
    const accuracy = totalChars > 0 ? Math.round((correctChars / totalChars) * 100) : 100;

    resWpm.textContent = wpm;
    resAccuracy.textContent = accuracy + '%';
    resWords.textContent = correctWords;
    resErrors.textContent = incorrectChars;
    resMaxStreak.textContent = maxStreak;

    window.GameLeaderboard.submitScore({ game: 'digitacao', turma, email: username, name: displayName, score: wpm });

    if (wpm > bestPpm) {
      bestPpm = wpm;
      saveBestPpm(bestPpm);
      lblBest.textContent = bestPpm;
      newRecordBadge.style.display = 'block';
    } else {
      newRecordBadge.style.display = 'none';
    }
    resBest.textContent = bestPpm;

    resultsPanel.style.display = 'block';
  }

  function restartGame() {
    clearInterval(timerInterval);
    timerInterval = null;
    started = false;
    selTheme.disabled = false;
    selDuration.disabled = false;
    timer = SELECTED_SECONDS;
    correctChars = 0;
    incorrectChars = 0;
    correctWords = 0;
    currentWordIndex = 0;
    streak = 0;
    maxStreak = 0;

    lblTimer.textContent = timer;
    lblWpm.textContent = 0;
    lblAccuracy.textContent = '100%';
    lblStreak.textContent = 0;
    streakBox.classList.remove('on-fire');
    resultsPanel.style.display = 'none';

    inputEl.disabled = false;
    inputEl.value = '';

    renderWords(generateWords(INITIAL_WORD_COUNT));
    inputEl.focus();
  }

  inputEl.addEventListener('input', handleInput);
  wordsBox.addEventListener('click', () => inputEl.focus());
  document.getElementById('btnRestart').addEventListener('click', restartGame);
  document.getElementById('btnPlayAgain').addEventListener('click', restartGame);

  selTheme.addEventListener('change', () => {
    currentTheme = selTheme.value;
    localStorage.setItem(THEME_KEY, currentTheme);
    restartGame();
  });
  selDuration.addEventListener('change', () => {
    SELECTED_SECONDS = parseInt(selDuration.value, 10);
    localStorage.setItem(DURATION_KEY, String(SELECTED_SECONDS));
    restartGame();
  });

  restartGame();
</script>

<script>
  window.ACTIVITY_LOCATION = 'jogos_digitacao';
  window.ACTIVITY_LABEL = 'Digitação — Treino de Velocidade';
</script>
<script src="../shared/activity-tracker.js"></script>

<div vw class="enabled">
  <div vw-access-button class="active"></div>
  <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
  </div>
</div>

<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
  if (window.VLibras) new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

</body>
</html>
